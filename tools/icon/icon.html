<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Rubik; font-weight: 900; src: url(../../node_modules/@fontsource/rubik/files/rubik-hebrew-900-normal.woff2) format('woff2'); }
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #0a0720; }
  .icon { position: relative; width: 512px; height: 512px; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #6a52ff 0%, #3a2a8e 38%, #150f3d 72%, #0a0720 100%); }
  .icon::after { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 108%, rgba(255,194,61,.32), transparent 45%); }
  .art { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .blk { position: absolute; border-radius: 26px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), inset 0 8px 0 rgba(255,255,255,.45), 0 12px 24px rgba(0,0,0,.45); }
  .cy { background: linear-gradient(180deg, #b4f8ff, #20d9ff 55%, #0a8fd0); }
  .gd { background: linear-gradient(180deg, #fff0b3, #ffc23d 55%, #e88a00); }
  .eyes { position: absolute; display: flex; gap: 10px; }
  .eye { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 4px solid #130d26; position: relative; }
  .eye i { position: absolute; width: 15px; height: 15px; border-radius: 50%; background: #130d26; top: 7px; }
  .eye i::after { content: ''; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; top: 2px; left: 7px; }
  .arc { position: absolute; left: 140px; top: 40px; width: 232px; height: 120px; border: 9px solid #20d9ff; border-bottom: 0; border-radius: 120px 120px 0 0; box-sizing: border-box; filter: drop-shadow(0 0 8px rgba(32,217,255,.8)); }
  .badge { position: absolute; left: 230px; top: 18px; width: 52px; height: 52px; border-radius: 50%; background: #0b0820; border: 6px solid #20d9ff; box-sizing: border-box;
    display: grid; place-items: center; color: #fff; font: 900 26px/1 Arial, sans-serif; }
  .name { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 900 124px/1 Rubik; letter-spacing: 0;
    filter: drop-shadow(0 6px 0 #2a1a6e) drop-shadow(0 0 2px #2a1a6e) drop-shadow(0 12px 18px rgba(0,0,0,.55)); }
  .name span { background-clip: text; -webkit-background-clip: text; color: transparent; }
  .w { background-image: linear-gradient(180deg, #ffffff 30%, #c9bfff); }
  .g { background-image: linear-gradient(180deg, #fff1b8 15%, #ffc845 55%, #ff8a00); }
</style>
</head>
<body>
<div class="icon"><div class="art">
  <div class="arc"></div>
  <div class="badge">⇄</div>
  <div class="blk cy" style="left:62px; top:112px; width:150px; height:104px"></div>
  <div class="eyes" style="left:108px; top:146px"><div class="eye"><i style="left:13px"></i></div><div class="eye"><i style="left:13px"></i></div></div>
  <div class="blk cy" style="left:300px; top:112px; width:150px; height:104px"></div>
  <div class="eyes" style="left:328px; top:146px"><div class="eye"><i style="left:2px"></i></div><div class="eye"><i style="left:2px"></i></div></div>
  <div class="blk gd" style="left:146px; top:232px; width:220px; height:74px; border-radius:24px"></div>
  <div class="eyes" style="left:262px; top:252px"><div class="eye" style="width:26px;height:26px"><i style="left:12px;top:5px"></i></div><div class="eye" style="width:26px;height:26px"><i style="left:12px;top:5px"></i></div></div>
  <div class="name"><span class="w">תאו</span><span class="g">מים</span></div>
</div></div>
<script>if (location.hash === "#mask") document.querySelector(".art").style.transform = "scale(.8)";</script>
</body>
</html>
