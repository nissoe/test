<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>טריטוריה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101a2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen phone app. A tiled board of territories; duels take over the whole screen with two chess-style clocks. Single dark arena look, by choice. */
:root{
  --ink:#101a2c;        /* arena floor */
  --panel:#18263d;      /* raised surfaces */
  --line:#2b3c5a;       /* hairlines, tile gaps */
  --text:#eef2f8;
  --muted:#93a4bf;
  --amber:#ffb547;      /* accent: active clock, primary action */
  --good:#3ddc97;
  --bad:#ff5d6c;
  --font-d:'Karantina','Secular One','Arial Narrow',system-ui,sans-serif;
  --font-b:'Rubik','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-b);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- home ---------- */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 2px}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:72px;line-height:.9;margin:0;letter-spacing:.5px}
.brand h1 span{color:var(--amber)}
.mini-grid{display:grid;grid-template-columns:repeat(3,14px);gap:2px;transform:rotate(-8deg)}
.mini-grid i{width:14px;height:14px;border-radius:2px;display:block}
.tag{color:var(--muted);margin:4px 0 14px;line-height:1.5;max-width:40ch}
.field{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.field>label,.flabel{font-size:13px;color:var(--muted);letter-spacing:.3px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:64px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:15px}
.seg button.on{background:var(--amber);color:#1b1206;border-color:var(--amber);font-weight:700}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 18%,var(--panel))}
.chip.off{opacity:.45}
.chip .x{opacity:.7;font-size:13px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.big{width:100%;padding:16px;border-radius:14px;background:var(--amber);color:#1b1206;font-weight:700;font-size:19px}
.big:disabled{opacity:.4}
.ghost{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.home-foot{padding-block:12px 4px;position:sticky;bottom:0;background:linear-gradient(to top,var(--ink) 75%,transparent)}

/* ---------- board ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px}
.topbar .logo{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1}
.topbar .logo span{color:var(--amber)}
.pill{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.board-wrap{display:flex;justify-content:center}
.board{display:grid;width:100%;max-width:min(100%,60vh);direction:ltr;border-radius:14px;overflow:hidden;background:var(--ink)}
.tile{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:0 solid var(--ink);transition:filter .25s,opacity .25s,background-color .4s;padding:2px;overflow:hidden}
.tile .ic{font-size:clamp(18px,7vw,34px);line-height:1}
.tile .nm{font-size:clamp(10px,2.9vw,13px);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cn{font-size:clamp(9px,2.4vw,11px);opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.board.small .tile .cn{display:none}
.tile.dim{filter:saturate(.25) brightness(.55)}
.tile.hl{filter:brightness(1.25);box-shadow:inset 0 0 0 3px #fff}
.tile.tgt{cursor:pointer;animation:pulse 1s ease-in-out infinite}
.tile.flash{animation:flash .7s ease-out 2}
@keyframes pulse{50%{filter:brightness(1.35)}}
@keyframes flash{50%{filter:brightness(1.8)}}
.status{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.4;padding-block:12px 6px;text-wrap:balance}
.actions{display:flex;flex-direction:column;gap:8px}
.tgt-list{display:flex;flex-direction:column;gap:6px}
.tgt-btn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:start}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tgt-btn b{flex:1}
.roster{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line);margin-top:12px}
.roster .chip{font-size:13px;padding:5px 9px}
.roster .chip.out{opacity:.35;text-decoration:line-through}

/* ---------- duel ---------- */
.duel-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat-badge{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.cat-badge .ci{font-size:24px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:10px}
.clock{border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:8px 12px 6px;display:flex;flex-direction:column;gap:0;transition:border-color .2s,opacity .2s;position:relative;overflow:hidden}
.clock .who{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock .t{font-family:var(--font-d);font-weight:700;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.clock.act{border-color:var(--amber)}
.clock.act .t{color:var(--amber)}
.clock:not(.act){opacity:.6}
.clock.low .t{color:var(--bad)}
.clock .bar{position:absolute;inset:auto 0 0 0;height:4px;background:var(--line)}
.clock .bar i{display:block;height:100%;background:currentColor;transform-origin:right;transition:transform .1s linear}
.turn{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.stage{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;gap:10px}
.stage .ask{font-size:15px;color:var(--muted)}
.stage .pic{font-size:min(40vw,190px);line-height:1.05}
.logo-card{width:min(62vw,240px);aspect-ratio:1;max-width:100%;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:14%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.logo-card.dark{background:#1d2433}
.logo-card svg{width:100%;height:100%}
.stage .txt{font-size:clamp(22px,6.4vw,32px);font-weight:700;line-height:1.35;max-width:22ch;text-wrap:balance}
.stage .cd{font-family:var(--font-d);font-size:140px;font-weight:700;color:var(--amber);line-height:1}
.stage .intro{display:flex;flex-direction:column;gap:12px;align-items:center}
.stage .intro .vs{font-family:var(--font-d);font-size:44px;font-weight:700;line-height:1}
.stage .intro .vs em{font-style:normal;color:var(--amber);padding-inline:8px}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:16px;
  background:color-mix(in srgb,var(--bad) 22%,var(--ink));font-size:28px;font-weight:700;padding:16px}
.reveal small{font-size:14px;font-weight:400;color:var(--muted)}
.reveal.good{background:color-mix(in srgb,var(--good) 22%,var(--ink))}
.feed{min-height:26px;text-align:center;color:var(--muted);font-size:15px;padding-block:4px}
.feed.ok{color:var(--good);font-weight:700}
.controls{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:14px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:17px;font-weight:500;min-height:56px}
.opt.right{background:var(--good);color:#04130b}
.opt.wrong{background:var(--bad);color:#1d0306}
.hostbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hostbtns button{padding:18px 10px;border-radius:14px;font-weight:700;font-size:19px}
.b-ok{background:var(--good);color:#04130b}
.b-pass{background:var(--panel);border:1px solid var(--line)}
.hostbtns.slim button{padding:11px 10px;font-size:15px}
button:disabled{opacity:.35;cursor:default}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);padding:8px;border-radius:999px;border:1px dashed var(--line)}
a.mic{text-decoration:none;color:var(--amber);border-color:var(--amber);text-align:center}
.mic.on{color:var(--good);border-style:solid;border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.mic.on::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--good);animation:pulse 1s infinite}
.thinking{text-align:center;color:var(--muted);padding:16px;font-size:16px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(6,10,18,.72);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
.sheet h2{font-family:var(--font-d);font-size:44px;line-height:1;margin:0;text-wrap:balance}
.sheet p{margin:0;line-height:1.5;color:var(--muted)}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="he">
  <!-- HOME -->
  <section class="scr scroll" id="scr-home">
    <div class="brand">
      <h1>טריטו<span>ריה</span></h1>
      <div class="mini-grid" aria-hidden="true" id="miniGrid"></div>
    </div>
    <p class="tag">כל משבצת היא שחקן, ולכל שחקן קטגוריה. מאתגרים שכן, שני שעונים רצים, עונים בקול. למי שנגמר הזמן ראשון יוצא, והמנצח לוקח לו את השטח. מי שמשתלט על כל הלוח מנצח.</p>

    <div class="field">
      <span class="flabel">מי משחק</span>
      <div class="seg" data-key="mode">
        <button data-v="cpu">אני נגד המחשב</button>
        <button data-v="friends">חברים על מכשיר אחד</button>
      </div>
    </div>

    <div id="cpuFields">
      <div class="field">
        <label for="myName">השם שלך</label>
        <input class="inp" id="myName" maxlength="14" autocomplete="off">
      </div>
      <div class="field">
        <span class="flabel">גודל הלוח</span>
        <div class="seg" data-key="size" data-num="1">
          <button data-v="4">4 שחקנים</button>
          <button data-v="9">9 שחקנים</button>
          <button data-v="16">16 שחקנים</button>
        </div>
      </div>
      <div class="field">
        <span class="flabel">רמת המחשב</span>
        <div class="seg" data-key="diff">
          <button data-v="easy">קל</button>
          <button data-v="normal">רגיל</button>
          <button data-v="hard">קשה</button>
        </div>
      </div>
    </div>

    <div id="friendFields" hidden>
      <div class="field">
        <label for="friendName">שחקנים (2 עד 16)</label>
        <div class="row">
          <input class="inp" id="friendName" maxlength="14" placeholder="שם של שחקן" autocomplete="off">
          <button class="ghost" id="addFriend">הוספה</button>
        </div>
        <div class="chips" id="friendList"></div>
      </div>
    </div>

    <div class="field">
      <span class="flabel">איך עונים</span>
      <div class="seg" data-key="answer">
        <button data-v="voice">🎤 בקול</button>
        <button data-v="choices">4 תשובות</button>
        <button data-v="host">מנחה מסמן</button>
      </div>
      <p class="hint" id="answerHint"></p>
    </div>

    <div class="field">
      <span class="flabel">זמן לכל שחקן בדו־קרב</span>
      <div class="seg" data-key="time" data-num="1">
        <button data-v="30">30 שניות</button>
        <button data-v="45">45 שניות</button>
        <button data-v="60">60 שניות</button>
      </div>
    </div>

    <div class="field">
      <div class="row" style="justify-content:space-between">
        <span class="flabel">קטגוריות במשחק</span>
        <button class="chip" id="allCats">הכל</button>
      </div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="home-foot">
      <button class="big" id="startBtn">מתחילים</button>
    </div>
  </section>

  <!-- BOARD -->
  <section class="scr" id="scr-board" hidden>
    <div class="topbar">
      <div class="logo">טריטו<span>ריה</span></div>
      <div class="row">
        <span class="pill" id="aliveCount"></span>
        <button class="pill" id="menuBtn" aria-label="תפריט">☰</button>
      </div>
    </div>
    <div class="scroll" style="flex:1;min-height:0">
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="status" id="bstatus"></div>
      <div class="actions" id="bactions"></div>
      <div class="roster" id="roster"></div>
    </div>
  </section>

  <!-- DUEL -->
  <section class="scr" id="scr-duel" hidden>
    <div class="duel-top">
      <div class="cat-badge"><span class="ci" id="dIcon"></span><span id="dCat"></span></div>
      <button class="pill" id="duelExit" aria-label="יציאה">✕</button>
    </div>
    <div class="clocks" id="clocks"></div>
    <div class="turn" id="turn"></div>
    <div class="stage" id="stage"></div>
    <div class="feed" id="feed"></div>
    <div class="controls" id="controls"></div>
  </section>
</div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

function parseCats(){
  return CATS_RAW.map(c=>{
    const items=[]; const seen=new Set();
    c.data.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
      const i=line.indexOf('→'); if(i<0) return;
      let p=line.slice(0,i).trim();
      const a=line.slice(i+1).split('|').map(x=>x.trim()).filter(Boolean);
      if(seen.has(p)) return; seen.add(p);
      items.push({p,a});
    });
    return {...c,items};
  });
}

const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

  get(k,d){try{const v=localStorage.getItem('terr.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('terr.'+k,JSON.stringify(v))}catch(e){}}
};

const FINALS={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){
  return String(s).toLowerCase()
    .replace(/[֑-ׇ]/g,'')
    .replace(/[ךםןףץ]/g,c=>FINALS[c])
    .replace(/[^\p{L}\p{N}\s]/gu,'')
    .replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}[prev,cur]=[cur,prev]}
  return prev[n];
}
function stripPrefix(w){return w.length>3 && /^[הוש]/.test(w) ? w.slice(1) : w}
function matches(text, answers){
  const t=norm(text); if(!t) return false;
  const words=t.split(' ');
  const tJoined=t.replace(/ /g,'');
  for(const raw of answers){
    const v=norm(raw); if(!v) continue;
    const vars=new Set([v]); if(v.length>3 && v[0]==='ה') vars.add(v.slice(1));
    for(const a of vars){
      if((' '+t+' ').includes(' '+a+' ')) return true;
      const aj=a.replace(/ /g,'');
      if(aj.length>=4 && tJoined.includes(aj)) return true;
      const n=a.split(' ').length;
      const tol = aj.length<=3 ? 0 : aj.length<=5 ? 1 : 2;
      for(let i=0;i+n<=words.length;i++){
        const win=words.slice(i,i+n); win[0]=win[0];
        const cand=win.join(''); const cand2=stripPrefix(win[0])+win.slice(1).join('');
        if(lev(cand,aj)<=tol || lev(cand2,aj)<=tol) return true;
      }
    }
  }
  return false;
}

let AC=null;
function beep(f,dur,type='sine',vol=.15,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}

   MICROPHONE: Claude dictation when the page runs as an artifact,
   the browser's speech recognition everywhere else.
   ===================================================================== */
const SITE_URL='https://raw.githack.com/nissoe/test/claude/zen-dirac-yy51m3/game/index.html';
const Mic={
  d:null, SR:null, rec:null, want:false, state:'off', denied:false, seg:0, consumed:new Map(), tried:false,
  async init(){
    try{
      if(window.claude && typeof window.claude.use==='function'){
        const d=await window.claude.use('dictation');
        if(d){
          this.d=d;
          d.onPartial(({text})=>{ if(text) onSpeech('d'+this.seg,[text],false) });
          d.onFinal(({text})=>{ onSpeech('d'+this.seg,[text],true); this.seg++; });
          d.onState(({state,reason})=>{
            if(reason==='not_granted'||reason==='unavailable') this.denied=true;
            this.setState(state==='listening'?'on':(state==='starting'?'starting':'off'));
          });
        }
      }
    }catch(e){}
    // Inside the Claude viewer the browser's own recognizer is always refused, so only use it on a normal site.
    this.inClaude = !!(window.claude && typeof window.claude.use==='function');
    if(!this.d && !this.inClaude) this.SR = window.SpeechRecognition||window.webkitSpeechRecognition||null;
  },
  available(){ return !!(this.d||this.SR) && !this.denied },
  prepare(){},
  start(){
    if(!this.available()) return;
    this.want=true; this.consumed.clear();
    if(this.d){
      this.d.start({language:'he'}).catch(e=>{
        if(e && (e.code==='not_granted'||e.code==='unavailable')) this.denied=true;
        this.setState('off');
      });
      return;
    }
    if(!this.rec){
      const r=new this.SR();
      r.lang='he-IL'; r.continuous=true; r.interimResults=true; r.maxAlternatives=4;
      r.onstart=()=>this.setState('on');
      r.onresult=e=>{
        for(let i=e.resultIndex;i<e.results.length;i++){
          const res=e.results[i], alts=[];
          for(let j=0;j<res.length;j++) alts.push(res[j].transcript);
          onSpeech('w'+this.seg+'_'+i,alts,res.isFinal);
        }
      };
      r.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){ this.denied=true; this.want=false; this.setState('off'); } };
      r.onend=()=>{
        this.seg++; this.setState('off');
        if(this.want && !this.denied) setTimeout(()=>{ if(this.want){ try{r.start()}catch(e){} } },120);
      };
      this.rec=r;
    }
    try{ this.rec.start() }catch(e){}
  },
  stop(){
    this.want=false;
    if(this.d) this.d.stop().catch(()=>{});
    if(this.rec){ try{this.rec.stop()}catch(e){} }
    this.setState('off');
  },
  setState(s){ this.state=s; renderMic(); }
};
Mic.init();

let G=null;   // game

function newGame(){
  const s=SET;
  let players;
  if(s.mode==='cpu'){
    const bots=shuffle(BOT_NAMES.slice()).slice(0,s.size-1);
    players=[{name:s.name||'אני',human:true},...bots.map(n=>({name:n,human:false}))];
  }else{
    players=s.friends.map(n=>({name:n,human:true}));
  }
  const n=players.length;
  const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), total=rows*cols;
  const cats=shuffle(s.cats.slice());
  shuffle(players);
  players=players.map((p,i)=>({...p,id:i,color:COLORS[i%COLORS.length],cat:cats[i%cats.length],alive:true}));
  const tiles=new Array(total).fill(-1);
  const order=shuffle([...Array(total).keys()]);
  players.forEach((p,i)=>tiles[order[i]]=p.id);
  // leftover tiles go to a neighbouring player
  let guard=0;
  while(tiles.includes(-1) && guard++<100){
    tiles.forEach((o,i)=>{ if(o!==-1) return; const nb=adjTiles(i,rows,cols).map(j=>tiles[j]).filter(x=>x!==-1); if(nb.length) tiles[i]=pick(nb); });
  }
  G={players,tiles,rows,cols,bag:{},auto:false,hl:null,targets:null,attacker:null,busy:false,flash:null};
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}) }catch(e){}
  show('board'); renderBoard(); nextTurn();
}

function adjTiles(i,rows,cols){
  const r=Math.floor(i/cols), c=i%cols, out=[];
  if(r>0) out.push(i-cols); if(r<rows-1) out.push(i+cols);
  if(c>0) out.push(i-1); if(c<cols-1) out.push(i+1);
  return out;
}
const alive=()=>G.players.filter(p=>p.alive);
const humansAlive=()=>alive().some(p=>p.human);
function neighbors(pid){
  const s=new Set();
  G.tiles.forEach((o,i)=>{ if(o!==pid) return; adjTiles(i,G.rows,G.cols).forEach(j=>{ if(G.tiles[j]!==pid) s.add(G.tiles[j]) }) });
  return [...s].map(id=>G.players[id]);
}
function anchorTile(pid){
  const own=G.tiles.map((o,i)=>o===pid?i:-1).filter(i=>i>=0);
  if(!own.length) return -1;
  const cr=own.reduce((s,i)=>s+Math.floor(i/G.cols),0)/own.length, cc=own.reduce((s,i)=>s+i%G.cols,0)/own.length;
  let best=own[0],bd=1e9;
  own.forEach(i=>{const d=(Math.floor(i/G.cols)-cr)**2+(i%G.cols-cc)**2; if(d<bd){bd=d;best=i}});
  return best;
}

function show(name){
  ['home','board','duel'].forEach(n=>$('#scr-'+n).hidden = n!==name);

function renderBoard(){
  const b=$('#board'); b.innerHTML='';
  b.style.gridTemplateColumns=`repeat(${G.cols},1fr)`;
  b.classList.toggle('small',G.cols>=4);
  const anchors=new Map(); G.players.forEach(p=>{ if(p.alive) anchors.set(anchorTile(p.id),p) });
  G.tiles.forEach((o,i)=>{
    const p=G.players[o]; const t=document.createElement('div'); t.className='tile';
    t.style.backgroundColor=p.color;
    const r=Math.floor(i/G.cols), c=i%G.cols, W=3;
    const same=j=>G.tiles[j]===o;
    t.style.borderTopWidth = (r>0&&same(i-G.cols))?'0':W+'px';
    t.style.borderBottomWidth = (r<G.rows-1&&same(i+G.cols))?'0':W+'px';
    t.style.borderLeftWidth = (c>0&&same(i-1))?'0':W+'px';
    t.style.borderRightWidth = (c<G.cols-1&&same(i+1))?'0':W+'px';
    if(anchors.has(i)){
      const cat=catById(p.cat);
      t.innerHTML=`<span class="ic">${cat.icon}</span><span class="nm">${esc(p.name)}</span><span class="cn">${esc(cat.name)}</span>`;
    }
    if(G.hl===o) t.classList.add('hl');
    if(G.targets){
      if(G.targets.has(o)){ t.classList.add('tgt'); t.onclick=()=>{ if(G.attacker) attack(G.attacker,p) }; }
      else if(o!==G.hl) t.classList.add('dim');
    }
    if(G.flash===o) t.classList.add('flash');
    b.appendChild(t);
  });
  $('#aliveCount').textContent=`נשארו ${alive().length}`;
  const ro=$('#roster'); ro.innerHTML='';
  G.players.slice().sort((a,b)=>(b.alive-a.alive)||(countTiles(b.id)-countTiles(a.id))).forEach(p=>{

    ro.appendChild(c);
  });
}

async function nextTurn(){
  G.targets=null; G.attacker=null; G.flash=null;
  if(alive().length===1) return gameOver(alive()[0]);
  renderBoard();
  if(G.auto || (SET.mode==='cpu' && !humansAlive())){
    setStatus('הגרלה…'); setActions([]); await sleep(450); return spin();
  }
  setStatus('מי תוקף עכשיו? לוחצים להגרלה');
  setActions([{label:'🎲 הגרלה',fn:spin}]);
}

async function spin(){
  setActions([]);
  const al=alive(); const chosen=pick(al);
  const steps=G.auto?6:14;
  for(let k=0;k<steps;k++){
    G.hl = k===steps-1 ? chosen.id : pick(al).id;
    renderBoard(); SFX.tick();
    await sleep(G.auto?60:55+k*k*1.2);
  }
  G.hl=chosen.id; renderBoard();
  setStatus(`<b>${esc(chosen.name)}</b> נבחר/ה לתקוף`);
  await sleep(G.auto?250:600);
  chooseTarget(chosen);
}

async function chooseTarget(p){
  const nb=neighbors(p.id);
  if(!nb.length) return nextTurn();
  G.hl=p.id;
  if(p.human){
    G.attacker=p; G.targets=new Set(nb.map(x=>x.id)); renderBoard();
    setStatus(`<b>${esc(p.name)}</b>, את מי מאתגרים? הקטגוריה תהיה של היריב`);
    const a=$('#bactions'); a.innerHTML='';
    const list=document.createElement('div'); list.className='tgt-list';
    nb.forEach(x=>{
      const cat=catById(x.cat);
      const b=document.createElement('button'); b.className='tgt-btn';
      b.innerHTML=`<span class="dot" style="background:${x.color}"></span><b>${esc(x.name)}</b><span>${cat.icon} ${esc(cat.name)}</span>`;
      b.onclick=()=>attack(p,x); list.appendChild(b);
    });
    a.appendChild(list);
  }else{
    // bots prefer a human neighbour now and then, otherwise random
    const hum=nb.filter(x=>x.human);
    const target = hum.length && Math.random()<.5 ? pick(hum) : pick(nb);
    G.targets=new Set([target.id]); renderBoard();
    setStatus(`<b>${esc(p.name)}</b> בוחר/ת יריב…`);
    await sleep(G.auto?250:900);
    attack(p,target);
  }
}

function attack(a,d){
  G.targets=null; G.attacker=null;
  const cat=catById(d.cat);
  if(!a.human && !d.human) return simulate(a,d,cat);
  openDuel(a,d,cat);
}

async function simulate(a,d,cat){
  setActions([]);
  G.hl=a.id; G.targets=new Set([d.id]); renderBoard();
  setStatus(`⚔️ <b>${esc(a.name)}</b> נגד <b>${esc(d.name)}</b><br><span style="color:var(--muted)">${cat.icon} ${esc(cat.name)}</span>`);
  await sleep(G.auto?700:1700);
  const pA = .5;
  const w = Math.random()<pA ? a : d, l = w===a ? d : a;
  setStatus(`<b>${esc(w.name)}</b> ניצח/ה את <b>${esc(l.name)}</b>`);
  resolve(w,l);
  await sleep(G.auto?500:1100);
  afterDuel(w,l);
}

function resolve(w,l){
  G.tiles=G.tiles.map(o=>o===l.id?w.id:o);
  l.alive=false; G.hl=w.id; G.targets=null; G.flash=w.id;
  renderBoard();
}

function afterDuel(w,l){
  G.flash=null;
  if(alive().length===1) return gameOver(w);
  if(SET.mode==='cpu' && l.human){
    SFX.lose();
    return modal({
      title:'הודחת',
      text:`${w.name} לקח/ה לך את השטח. נשארו ${alive().length} שחקנים על הלוח.`,
      buttons:[
        {label:'לצפות בהמשך',fn:()=>{G.auto=true;nextTurn()}},
        {label:'משחק חדש',cls:'ghost',fn:()=>newGame()},
      ]
    });
  }
  const canGo = neighbors(w.id).length>0;
  if(w.human){
    const lc=catById(l.cat), wc=catById(w.cat);
    let keep=w.cat;
    const body=document.createElement('div');
    body.style.cssText='display:flex;flex-direction:column;gap:10px';
    if(l.cat!==w.cat){
      body.innerHTML=`<p>איזו קטגוריה תהיה שלך מעכשיו? מי שיאתגר אותך יקבל אותה.</p>
        <div class="seg" id="keepSeg"><button data-v="${w.cat}" class="on">${wc.icon} ${esc(wc.name)}</button><button data-v="${l.cat}">${lc.icon} ${esc(lc.name)}</button></div>`;
      body.querySelector('#keepSeg').onclick=e=>{const b=e.target.closest('button'); if(!b) return; keep=b.dataset.v; body.querySelectorAll('#keepSeg button').forEach(x=>x.classList.toggle('on',x===b))};
    }
    const btns=[];
    if(canGo) btns.push({label:'לאתגר עוד שכן',fn:()=>{w.cat=keep;renderBoard();chooseTarget(w)}});
    btns.push({label:'חזרה להגרלה',cls:canGo?'ghost':'big',fn:()=>{w.cat=keep;nextTurn()}});
    return modal({title:`${w.name} ניצח/ה!`,node:body,buttons:btns});
  }
  // bot winner
  if(l.cat!==w.cat && Math.random()<.4) w.cat=l.cat;
  if(canGo && Math.random()<.35){ setStatus(`<b>${esc(w.name)}</b> ממשיך/ה לתקוף`); setTimeout(()=>chooseTarget(w),G.auto?300:900); }
  else nextTurn();
}

function drawItem(cat){
  if(cat.kind==='gen') return genMath();
  const bag=G.bag[cat.id] && G.bag[cat.id].length ? G.bag[cat.id] : (G.bag[cat.id]=shuffle([...cat.items.keys()]));
  return cat.items[bag.pop()];
}
function genMath(){
  const t=Math.random(); let p,v;
  if(t<.4){const a=2+(Math.random()*10|0), b=2+(Math.random()*9|0); p=`${a} × ${b}`; v=a*b;}
  else if(t<.75){const a=5+(Math.random()*60|0), b=2+(Math.random()*30|0); p=`${a} + ${b}`; v=a+b;}
  else {const a=20+(Math.random()*70|0), b=2+(Math.random()*(a-2)|0); p=`${a} − ${b}`; v=a-b;}
  return {p,a:[String(v)],num:v};
}
function options(cat,item){
  if(cat.kind==='gen'){
    const s=new Set([item.num]);
    while(s.size<4){ const d=item.num+((Math.random()*10|0)-5)||item.num+7; if(d>=0) s.add(d) }
    return shuffle([...s].map(String));
  }
  const pool=[...new Set(cat.items.map(x=>x.a[0]))].filter(x=>x!==item.a[0]);
  return shuffle([item.a[0],...shuffle(pool).slice(0,3)]);
}

function openDuel(a,d,cat){
  closeModal();
  const T=SET.time*1000;
  D={p:[a,d],t:[T,T],T,active:0,cat,item:null,lock:false,running:false,raf:0,last:0,botTimer:0,lockTimer:0,ended:false};
  show('duel');
  $('#dIcon').textContent=cat.icon; $('#dCat').textContent=cat.name;
  renderClocks(); $('#turn').textContent=''; $('#feed').textContent=''; $('#feed').className='feed';
  const st=$('#stage');
  st.innerHTML=`<div class="intro">
    <div class="vs">${esc(a.name)}<em>נגד</em>${esc(d.name)}</div>
    <div>${cat.icon} הקטגוריה של ${esc(d.name)}: <b>${esc(cat.name)}</b></div>
    <div class="hint">${esc(a.name)} מתחיל/ה. תשובה נכונה מעבירה את השעון ליריב. ${SET.answer==='voice'?'אומרים "דלג" כדי לדלג (3 שניות קנס).':'דילוג עולה 3 שניות.'}</div>
  </div>`;
  const c=$('#controls'); c.innerHTML='';
  const go=document.createElement('button'); go.className='big'; go.textContent='התחילו';
  go.onclick=()=>{
    if(SET.answer==='voice' && Mic.available()) Mic.start();  // must run inside the click
    beep(1,.01,'sine',.0001);
    countdown();
  };
  c.appendChild(go);
}

function renderClocks(){
  const box=$('#clocks');
  if(!box.children.length || box.dataset.k!==D.p.map(p=>p.id).join()){
    box.dataset.k=D.p.map(p=>p.id).join(); box.innerHTML='';
    D.p.forEach((p,i)=>{
      const c=document.createElement('div'); c.className='clock'; c.style.color=p.color;
      c.innerHTML=`<div class="who" style="color:var(--text)"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.human?'':' 🤖'}</div><div class="t" style="color:inherit"></div><div class="bar"><i></i></div>`;
      box.appendChild(c);
    });
  }
  [...box.children].forEach((c,i)=>{
    const ms=Math.max(0,D.t[i]);
    c.querySelector('.t').textContent = ms<10000 ? (ms/1000).toFixed(1) : String(Math.ceil(ms/1000));
    c.querySelector('.bar i').style.transform=`scaleX(${ms/D.T})`;
    c.classList.toggle('act',D.running && D.active===i);
    c.classList.toggle('low',ms<5000);
    c.querySelector('.t').style.color = (D.running&&D.active===i) ? '' : 'var(--text)';
  });
}

async function countdown(){
  const c=$('#controls'); c.innerHTML=''; renderControls(true);
  const st=$('#stage');
  for(const n of [3,2,1]){ st.innerHTML=`<div class="cd">${n}</div>`; SFX.tick(); await sleep(650); if(!D||D.ended) return; }
  SFX.go();
  D.running=true; D.last=performance.now();
  nextQuestion();
  D.raf=requestAnimationFrame(tick);
}

function tick(now){
  if(!D||!D.running) return;
  const dt=Math.min(250,now-D.last); D.last=now;
  const before=D.t[D.active];
  D.t[D.active]-=dt;
  if(before>3000 && D.t[D.active]<=3000) {} // room for a warning sound
  if(D.t[D.active]<=0){ D.t[D.active]=0; renderClocks(); return endDuel(1-D.active); }
  renderClocks();
  D.raf=requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange',()=>{ if(D&&D.running) D.last=performance.now() });

const cur=()=>D.p[D.active];
function lum(h){const n=parseInt(h,16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}

function nextQuestion(){
  if(!D||!D.running) return;
  D.lock=false; D.item=drawItem(D.cat);
  const p=cur();
  $('#turn').innerHTML=`התור של <b style="color:${p.color}">${esc(p.name)}</b>`;
  const st=$('#stage');
  const ask=D.cat.ask?`<div class="ask">${esc(D.cat.ask)}</div>`:'';
  if(D.cat.kind==='logo'){ const [hex,d]=LOGOS[D.item.p]; const light=lum(hex)>.75;
    st.innerHTML=`${ask}<div class="logo-card${light?' dark':''}"><svg viewBox="0 0 24 24" role="img" aria-label="לוגו"><path fill="#${hex}" d="${d}"/></svg></div>`; }
  else st.innerHTML = D.cat.kind==='pic' ? `${ask}<div class="pic">${D.item.p}</div>` : `${ask}<div class="txt" dir="auto">${esc(D.item.p)}</div>`;
  renderClocks();
  renderControls();
  clearTimeout(D.botTimer);
  if(!p.human){
    const cfg=DIFF[SET.diff]||DIFF.normal;
    const delay=cfg.think*(.45+Math.random()*1.0);
    D.botTimer=setTimeout(()=>{
      if(!D||!D.running||D.lock) return;
      if(Math.random()<cfg.acc){ $('#feed').className='feed ok'; $('#feed').textContent=`${p.name}: ${D.item.a[0]} ✓`; correct(); }
      else pass();
    },delay);
  }
}

function renderControls(disabled){
  const c=$('#controls'); c.innerHTML='';
  if(!D) return;
  const p=cur(); const humanTurn = p.human && D.running && !disabled;
  if(D.running && !p.human){
    c.innerHTML=`<div class="thinking">🤖 ${esc(p.name)} חושב/ת…</div>`;
  }else if(SET.answer==='choices'){
    const g=document.createElement('div'); g.className='opts';
    (D.item?options(D.cat,D.item):['','','','']).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o; b.disabled=!humanTurn;
      b.onclick=()=>{
        if(D.lock) return;
        if(D.item.a[0]===o){ b.classList.add('right'); correct(); }
        else { b.classList.add('wrong'); g.querySelectorAll('.opt').forEach(x=>{ if(x.textContent===D.item.a[0]) x.classList.add('right') }); pass(); }
      };
      g.appendChild(b);
    });
    c.appendChild(g);
    const sk=document.createElement('button'); sk.className='ghost'; sk.textContent='דלג'; sk.disabled=!humanTurn; sk.onclick=()=>pass();
    c.appendChild(sk);
  }else{
    const h=document.createElement('div'); h.className='hostbtns'+(SET.answer==='voice'&&Mic.available()?' slim':'');
    h.innerHTML=`<button class="b-ok">✓ נכון</button><button class="b-pass">דלג</button>`;
    h.children[0].disabled=!humanTurn; h.children[1].disabled=!humanTurn;
    h.children[0].onclick=()=>correct(); h.children[1].onclick=()=>pass();
    c.appendChild(h);
  }
  if(SET.answer==='voice'){
    const m=document.createElement('button'); m.className='mic'; m.id='micPill';
    m.onclick=()=>{ if(Mic.available() && Mic.state!=='on') Mic.start() };
    c.appendChild(m); renderMic();
  }
}
function renderMic(){
  const m=$('#micPill'); if(!m) return;
  m.classList.toggle('on',Mic.state==='on');
  if(!Mic.available()){
    if(Mic.inClaude){
      m.outerHTML=`<a class="mic" id="micPill" href="${SITE_URL}" target="_blank" rel="noopener">🎤 כאן אין מיקרופון. לחצו לפתיחת המשחק בדפדפן ושם עונים בקול</a>`;
    }else{
      m.textContent= Mic.denied ? 'המיקרופון חסום: אשרו גישה למיקרופון בהגדרות הדפדפן לאתר הזה' : 'זיהוי דיבור לא זמין בדפדפן הזה (נסו Chrome או Safari)'; m.disabled=true;
    }
  }
  else if(Mic.state==='on'){ m.textContent='מקשיב… אמרו את התשובה'; m.disabled=false; }
  else if(Mic.state==='starting'){ m.textContent='🎤 מפעיל מיקרופון…'; m.disabled=false; }
  else { m.textContent='🎤 המיקרופון כבוי. לחצו להפעלה'; m.disabled=false; }
}

function onSpeech(key,alts,isFinal){
  if(!D||!D.running) return;
  const show0=alts[0]||'';
  if(!D.lock && !$('#feed').classList.contains('ok')) $('#feed').textContent = show0 ? `"${show0.trim()}"` : '';
  if(D.lock || !cur().human) return;
  const used=Mic.consumed.get(key)||0;
  for(const alt of alts){
    const n=norm(alt); const fresh=n.slice(used).trim();
    if(!fresh) continue;
    if(matches(fresh,D.item.a)){ Mic.consumed.set(key,n.length); $('#feed').className='feed ok'; $('#feed').textContent=`✓ ${D.item.a[0]}`; return correct(); }
  }
  for(const alt of alts){
    const n=norm(alt); const fresh=n.slice(used).trim();
    if(PASS_RE.test(fresh)){ Mic.consumed.set(key,n.length); return pass(); }
  }
}

function correct(){
  if(!D||!D.running||D.lock) return;
  clearTimeout(D.botTimer);
  SFX.ok();
  const fb=$('#feed'); if(!fb.classList.contains('ok')){ fb.className='feed ok'; fb.textContent=`✓ ${D.item.a[0]}`; }
  setTimeout(()=>{ if(fb.classList.contains('ok')){ fb.className='feed'; fb.textContent=''; } },1200);
  D.active=1-D.active;
  nextQuestion();
}

function pass(){
  if(!D||!D.running||D.lock) return;
  clearTimeout(D.botTimer);
  D.lock=true; SFX.pass();
  const st=$('#stage');
  const r=document.createElement('div'); r.className='reveal';
  r.innerHTML=`<small>התשובה</small>${esc(D.item.a[0])}<small>3 שניות קנס, השעון ממשיך</small>`;
  st.appendChild(r);
  renderControls(true);
  D.lockTimer=setTimeout(()=>{ if(D&&D.running) nextQuestion() },3000);
}

function endDuel(winnerIdx){
  if(!D||D.ended) return;
  D.running=false; D.ended=true;
  cancelAnimationFrame(D.raf); clearTimeout(D.botTimer); clearTimeout(D.lockTimer);
  Mic.stop();
  const w=D.p[winnerIdx], l=D.p[1-winnerIdx];
  renderClocks();
  (w.human?SFX.win:SFX.lose)();
  $('#turn').textContent='';
  $('#stage').innerHTML=`<div class="reveal good" style="position:static;width:100%"><small>הזמן של ${esc(l.name)} נגמר</small>${esc(w.name)} ניצח/ה<small>${esc(D.item?('התשובה האחרונה: '+D.item.a[0]):'')}</small></div>`;
  $('#controls').innerHTML='';
  const c=$('#controls'); const b=document.createElement('button'); b.className='big'; b.textContent='חזרה ללוח';
  b.onclick=()=>finishDuel(w,l); c.appendChild(b);
}
function finishDuel(w,l){
  D=null; show('board');
  setActions([]); setStatus(`<b>${esc(w.name)}</b> לוקח/ת את השטח של <b>${esc(l.name)}</b>`);
  resolve(w,l);
  setTimeout(()=>afterDuel(w,l),900);
}

$('#duelExit').onclick=()=>{
  const wasRunning=D&&D.running;
  if(wasRunning){ D.running=false; cancelAnimationFrame(D.raf); clearTimeout(D.botTimer); }
  modal({title:'לעזוב את הדו־קרב?',text:'הדו־קרב יבוטל וחוזרים ללוח בלי מנצח.',buttons:[
    {label:'להמשיך לשחק',fn:()=>{ if(wasRunning&&D){ D.running=true; D.last=performance.now(); D.raf=requestAnimationFrame(tick); if(!D.lock) nextQuestion(); } }},
    {label:'חזרה ללוח',cls:'ghost',fn:()=>{ if(D){clearTimeout(D.lockTimer);D.ended=true} Mic.stop(); D=null; show('board'); nextTurn(); }},
  ]});
};

/* boot */
buildMiniGrid();
renderHome();
show('home');
</script>

</body></html>
