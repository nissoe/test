<title>טריטוריה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1324">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone app over a living "arena floor" canvas. Glowing territory tiles; duels take the whole stage. Single dark look by choice. */
:root{
  --ink:#0b1324;          /* arena floor */
  --ink-2:#111c33;
  --panel:#16233d;
  --panel-2:#1c2c4b;
  --line:#2a3d62;
  --text:#eef3fb;
  --muted:#93a6c6;
  --amber:#ffb547;        /* accent: active clock, primary action */
  --amber-2:#ff8a3d;
  --good:#38e09a;
  --bad:#ff5468;
  --glow:rgba(255,181,71,.55);
  --font-d:'Karantina','Secular One','Arial Narrow',system-ui,sans-serif;
  --font-b:'Rubik','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-b);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:30}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,70,.55) 100%)}
#vignette.on{animation:vig 1s ease-in-out infinite}
@keyframes vig{0%,100%{opacity:.35}50%{opacity:.9}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#fff}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#ver{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);text-align:center;font-size:10.5px;color:var(--muted);opacity:.75;pointer-events:none;z-index:15;font-variant-numeric:tabular-nums;letter-spacing:.3px}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-bottom:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px;animation:scrIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- shared bits ---------- */
.logo{font-family:var(--font-d);font-weight:700;line-height:.85;letter-spacing:.5px;margin:0;
  background:linear-gradient(180deg,#fff 0%,#ffe1ad 55%,var(--amber) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,181,71,.35))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px}
.topbar .logo{font-size:38px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(22,35,61,.75);border:1px solid var(--line);font-size:18px;backdrop-filter:blur(6px)}
.pill{font-size:13px;color:var(--muted);background:rgba(22,35,61,.75);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center}
.big{position:relative;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:19px;color:#231403;overflow:hidden;
  background:linear-gradient(180deg,#ffd27e,var(--amber) 45%,var(--amber-2));box-shadow:0 8px 24px rgba(255,138,61,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.big:active{transform:scale(.97)}
.big:disabled{opacity:.4;filter:grayscale(.6)}
.big:disabled::after{display:none}
.ghost{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(22,35,61,.8);font-size:16px;font-weight:500;width:100%}
.ghost:active{transform:scale(.98)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:64px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:15px;transition:all .15s}
.seg button.on{background:linear-gradient(180deg,#ffd27e,var(--amber));color:#231403;border-color:var(--amber);font-weight:700;box-shadow:0 0 16px var(--glow)}
.field{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid rgba(42,61,98,.7)}
.flabel{font-size:13px;color:var(--muted);letter-spacing:.3px}
.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--panel))}
.chip.off{opacity:.42}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.card{background:linear-gradient(180deg,rgba(28,44,75,.92),rgba(22,35,61,.92));border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
h2.title{font-family:var(--font-d);font-size:46px;line-height:1;margin:0}

/* ---------- home ---------- */
.home-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-block:6px 10px}
.home-hero .logo{font-size:min(23vw,104px)}
.home-hero .tag{color:var(--muted);line-height:1.5;margin:0;max-width:34ch}
.hero-wrap{width:min(46vw,190px);animation:float 4s ease-in-out infinite}
.hero-art{display:block;width:100%;height:auto;overflow:visible}
.menu{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;width:100%;min-height:70px;padding:10px 14px;border-radius:16px;
  background:rgba(22,35,61,.82);border:1px solid var(--line);text-align:start;backdrop-filter:blur(6px);transition:transform .12s,border-color .2s}
.mrow:active{transform:scale(.98)}
.mrow:hover{border-color:color-mix(in srgb,var(--amber) 50%,var(--line))}
.mrow .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--panel-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.mrow .mt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mrow b{font-size:17px;display:flex;align-items:center;gap:8px}
.mrow small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .chev{color:var(--muted);font-size:24px;line-height:1}
.mtag{font-size:11px;font-weight:700;color:#231403;background:var(--amber);border-radius:999px;padding:2px 8px}
.foot-links{display:flex;justify-content:center;gap:16px;padding-block:14px 4px}
.foot-links button{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- setup ---------- */
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.pl .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .g{font-size:12px;color:var(--muted)}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av-grid button{aspect-ratio:1;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:26px}
.av-grid button.on{border-color:var(--amber);box-shadow:0 0 14px var(--glow)}
.sticky-foot{padding-block:12px 4px;position:sticky;bottom:0;background:linear-gradient(to top,var(--ink) 70%,transparent)}

/* ---------- board ---------- */
.board-stage{position:relative;display:flex;justify-content:center;padding-block:6px 4px}
.board{position:relative;display:grid;width:100%;max-width:min(100%,58vh);direction:ltr;border-radius:18px;padding:5px;overflow:hidden;
  background:linear-gradient(180deg,#0e1830,#0a1122);box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px var(--line),inset 0 0 40px rgba(0,0,0,.6)}
.tile{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:filter .25s,opacity .25s,background-color .5s;padding:2px;overflow:visible;
  background-image:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,0) 40%,rgba(0,0,0,.30))}
.tile>*{position:relative;z-index:1}
.tile .av{font-size:clamp(20px,8vw,40px);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.tile .nm{font-size:clamp(10px,2.9vw,13px);font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cn{font-size:clamp(9px,2.3vw,11px);opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;background:rgba(0,0,0,.25);border-radius:999px;padding:1px 6px}
.board.small .tile .cn{display:none}
.board.small .tile .av{font-size:clamp(16px,6vw,28px)}
.tile.dim{filter:saturate(.2) brightness(.45)}
.tile.hl{filter:brightness(1.3);z-index:2}
.tile.hl{box-shadow:none}
.board .edges{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;z-index:3;overflow:visible}
.tile.tgt{cursor:pointer;animation:tgt 1s ease-in-out infinite;z-index:1}
@keyframes tgt{50%{filter:brightness(1.45)}}
.tile.cap{animation:cap .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes cap{0%{transform:scale(1) rotateY(0);filter:brightness(1)}45%{transform:scale(.6) rotateY(90deg);filter:brightness(2.2)}100%{transform:scale(1) rotateY(0);filter:brightness(1)}}
.spot{position:absolute;pointer-events:none;border-radius:50%;width:160px;height:160px;margin:-80px 0 0 -80px;
  background:radial-gradient(circle,rgba(255,240,200,.55),rgba(255,200,120,.18) 40%,transparent 70%);mix-blend-mode:screen;transition:left .12s ease-out,top .12s ease-out;z-index:4;opacity:0}
.spot.on{opacity:1}
.status{min-height:56px;display:grid;place-items:center;text-align:center;font-size:18px;line-height:1.4;padding-block:12px 8px;text-wrap:balance}
.status b{color:var(--amber)}
.actions{display:flex;flex-direction:column;gap:8px}
.tgt-list{display:flex;flex-direction:column;gap:8px}
.tgt-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(22,35,61,.85);border:1px solid var(--line);text-align:start;transition:transform .12s}
.tgt-btn:active{transform:scale(.98)}
.tgt-btn .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex:none}
.tgt-btn b{flex:1}
.roster{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid rgba(42,61,98,.7);margin-top:12px}
.roster .chip{font-size:13px;padding:4px 9px 4px 6px}
.roster .chip.out{opacity:.3;text-decoration:line-through}

/* ---------- duel ---------- */
.duel-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat-badge{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;padding:6px 12px 6px 14px;border-radius:999px;background:rgba(22,35,61,.85);border:1px solid var(--line)}
.cat-badge .ci{font-size:22px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px 6px}
.clock{position:relative;border-radius:18px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--line);padding:8px 12px 10px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,opacity .25s,transform .25s,box-shadow .25s}
.clock .who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}
.clock .who .av{font-size:22px}
.clock .who span:last-child{overflow:hidden;text-overflow:ellipsis}
.clock .t{font-family:var(--font-d);font-weight:700;font-size:62px;line-height:.95;font-variant-numeric:tabular-nums;color:var(--text)}
.clock .bar{position:absolute;inset:auto 0 0 0;height:5px;background:rgba(0,0,0,.35)}
.clock .bar i{display:block;height:100%;transform-origin:right;transition:transform .1s linear}
.clock.act{transform:translateY(-2px)}
.clock.act .t{color:#fff;text-shadow:0 0 18px var(--pc)}
.clock:not(.act){opacity:.55;transform:scale(.97)}
.clock.low.act .t{color:var(--bad);animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
.turn{text-align:center;font-size:14px;color:var(--muted);min-height:22px}
.turn b{font-weight:800}
.stage{flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;gap:10px;perspective:900px}
.stage .ask{font-size:15px;color:var(--muted)}
.qcard{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:qIn .38s cubic-bezier(.2,.9,.3,1.25) both;max-width:100%}
@keyframes qIn{from{opacity:0;transform:rotateY(-70deg) scale(.7)}}
.qcard.out-ok{animation:qOk .3s ease-in forwards}
@keyframes qOk{to{opacity:0;transform:translateY(-40px) scale(1.15)}}
.qcard .pic{font-size:min(40vw,190px);line-height:1.05;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.qcard .txt{font-size:clamp(22px,6.4vw,32px);font-weight:800;line-height:1.35;max-width:22ch;text-wrap:balance}
.flag-btn{position:absolute;top:-6px;left:-6px;width:34px;height:34px;border-radius:50%;background:rgba(11,19,36,.75);border:1px solid var(--line);font-size:14px;z-index:3;color:var(--muted)}
.ph-wrap{display:flex;align-items:center;justify-content:center;max-height:44vh}
.ph{max-width:100%;max-height:44vh;border-radius:18px;object-fit:contain;box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.08)}
.ph.sil{filter:brightness(0) invert(1) drop-shadow(0 0 18px rgba(255,255,255,.35));box-shadow:none;max-height:36vh;width:min(68vw,300px)}
.ph.gray{filter:grayscale(1) contrast(1.6) blur(3px);max-height:36vh;width:min(68vw,300px)}
.ph.map{background:#fff;width:min(76vw,340px)}
.logo-card{width:min(60vw,240px);aspect-ratio:1;max-width:100%;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:14%;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.logo-card.dark{background:#1d2433}
.logo-card svg{width:100%;height:100%}
.qcard .pic.sil{filter:brightness(0) invert(1) drop-shadow(0 0 22px rgba(255,255,255,.55))}
.ph.blurin{animation:blurIn 9s cubic-bezier(.3,0,.6,1) forwards}
@keyframes blurIn{from{filter:blur(28px) saturate(.6)}to{filter:blur(0) saturate(1)}}
.react-btn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:16;width:46px;height:46px;border-radius:50%;font-size:24px;background:rgba(22,35,61,.9);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.react-bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:16;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:999px;background:rgba(22,35,61,.95);border:1px solid var(--line)}
.react-bar button{width:40px;height:40px;font-size:24px;border-radius:50%}
.floaty{position:fixed;bottom:80px;font-size:44px;z-index:29;pointer-events:none;animation:floaty 2.6s ease-out forwards;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
@keyframes floaty{0%{transform:translateY(0) scale(.4);opacity:0}15%{transform:translateY(-40px) scale(1.15);opacity:1}100%{transform:translateY(-62vh) scale(.9);opacity:0}}
.sound-btn{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;font-size:min(20vw,84px);background:radial-gradient(circle at 35% 30%,var(--panel-2),var(--panel));border:2px solid var(--amber);box-shadow:0 0 40px var(--glow)}
.sound-btn.playing{animation:beat 1s infinite}
.final-banner{font-family:var(--font-d);font-size:64px;line-height:1;background:linear-gradient(180deg,#fff,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px var(--glow))}
.score-pips{display:flex;gap:6px;justify-content:center}
.score-pips i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.league-row{display:grid;grid-template-columns:28px 36px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(22,35,61,.85);border:1px solid var(--line)}
.league-row.first{border-color:var(--amber);box-shadow:0 0 18px var(--glow)}
.league-row b.num{font-family:var(--font-d);font-size:28px;color:var(--amber);text-align:center}
.vcard{width:100%;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
body.big #app{zoom:1.14}
body.big .sheet{zoom:1.1}
.loading{color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.loading::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cd{font-family:var(--font-d);font-size:170px;font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;animation:cd .65s ease-out both;filter:drop-shadow(0 0 30px var(--glow))}
@keyframes cd{from{transform:scale(2.4);opacity:0}30%{opacity:1}to{transform:scale(.9);opacity:.9}}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.vs .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.vs .side .disc{width:min(28vw,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:min(15vw,64px);box-shadow:0 0 0 4px rgba(255,255,255,.15),0 0 40px var(--pc)}
.vs .side b{font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .side.l{animation:inL .5s cubic-bezier(.2,.9,.3,1.2) both}
.vs .side.r{animation:inR .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes inL{from{transform:translateX(-120%);opacity:0}}
@keyframes inR{from{transform:translateX(120%);opacity:0}}
.vs .x{font-family:var(--font-d);font-size:64px;font-weight:700;color:var(--amber);animation:slam .45s .35s cubic-bezier(.2,.9,.3,1.6) both;text-shadow:0 0 24px var(--glow)}
@keyframes slam{from{transform:scale(3) rotate(-20deg);opacity:0}}
.intro-cat{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(22,35,61,.9);border:1px solid var(--amber);font-weight:700;animation:drop .5s .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:20px;z-index:4;
  background:color-mix(in srgb,var(--bad) 25%,rgba(11,19,36,.92));font-size:30px;font-weight:800;padding:16px;animation:scrIn .2s}
.reveal small{font-size:14px;font-weight:400;color:var(--muted)}
.rv-img{max-height:26vh;max-width:70%;object-fit:contain}
.feed{min-height:28px;text-align:center;color:var(--muted);font-size:15px;padding-block:4px}
.feed.ok{color:var(--good);font-weight:800;animation:pop .3s}
@keyframes pop{from{transform:scale(1.4)}}
.controls{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mic{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);padding:9px;border-radius:999px;border:1px dashed var(--line);text-align:center;text-decoration:none}
a.mic{color:var(--amber);border-color:var(--amber)}
.mic.on{color:var(--good);border-style:solid;border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.mic .eq{display:none;gap:2px;align-items:flex-end;height:14px}
.mic.on .eq{display:inline-flex}
.mic .eq i{width:3px;background:var(--good);border-radius:2px;animation:eq .8s ease-in-out infinite}

.type-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.type-row .inp{font-size:20px;padding:14px;text-align:center;border-width:2px}
.type-row .inp:focus{border-color:var(--amber);box-shadow:0 0 16px var(--glow);outline:none}

.pw-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pw{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;
  background:linear-gradient(180deg,#3a3f8f,#232a63);border:1px solid #7f8cff;box-shadow:0 0 14px rgba(127,140,255,.45);animation:pwIn .4s cubic-bezier(.2,.9,.3,1.4) both}

@keyframes pwIn{from{transform:scale(.4);opacity:0}}
.clock.frozen{border-color:#7fdcff!important;box-shadow:0 0 30px #7fdcff!important}

.clock.frozen::after{content:"❄️";position:absolute;top:6px;left:10px;font-size:20px;animation:float 1.5s ease-in-out infinite}
.clock.bombed{border-color:#ff8a3d!important;box-shadow:0 0 30px #ff6a1d!important}
.clock.bombed::after{content:"💣";position:absolute;top:6px;left:10px;font-size:20px;animation:beat .5s infinite}
.pw-mini{font-size:12px;letter-spacing:1px}
.shield-fx{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;z-index:6;pointer-events:none;animation:shieldFx 1.2s ease-out forwards;filter:drop-shadow(0 0 30px #7fdcff)}

.result h3{font-family:var(--font-d);font-size:54px;margin:0;line-height:1}
.replay{display:flex;gap:6px;overflow-x:auto;width:100%;padding:6px 2px;scrollbar-width:none}

.li small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
/*__DATA__*/

/* =====================================================================
   HELPERS
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pick=(a,r=Math.random)=>a[r()*a.length|0];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={
  get(k,d){try{const v=localStorage.getItem('terr.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('terr.'+k,JSON.stringify(v))}catch(e){}}
};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const FINALS={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){return String(s).toLowerCase().replace(/[֑-ׇ]/g,'').replace(/[ךםןףץ]/g,c=>FINALS[c]).replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim()}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i),c=new Array(n+1);
  for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));[p,c]=[c,p]}return p[n]}
const stripPrefix=w=>w.length>3&&/^[הוש]/.test(w)?w.slice(1):w;
function matches(text,answers){
  const t=norm(text); if(!t) return false;
  const words=t.split(' '), tj=t.replace(/ /g,'');
  for(const raw of answers){
    const v=norm(raw); if(!v) continue;
    const vars=new Set([v]); if(v.length>3&&v[0]==='ה') vars.add(v.slice(1));
    for(const a of vars){
      if((' '+t+' ').includes(' '+a+' ')) return true;
      const aj=a.replace(/ /g,'');
      if(aj.length>=4&&tj.includes(aj)) return true;
      const n=a.split(' ').length, tol=aj.length<=3?0:aj.length<=5?1:2;
      for(let i=0;i+n<=words.length;i++){
        const win=words.slice(i,i+n), c1=win.join(''), c2=stripPrefix(win[0])+win.slice(1).join('');
        if(lev(c1,aj)<=tol||lev(c2,aj)<=tol) return true;
      }
    }
  }
  return false;
}
const PASS_RE=/(^| )(דלג|דילוג|פאס|פס|תעביר|תעבירי|הבא|לא יודע|לא יודעת)( |$)/;

function lum(h){const n=parseInt(h,16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const G_=(p,m,f)=>p&&p.g==='f'?f:m;   // gendered Hebrew verb

/* =====================================================================
   AUDIO: synthesized effects + a generative music loop
   ===================================================================== */
const SND={
  ctx:null, master:null, fx:null, mus:null, muted:store.get('muted',false), music:store.get('music',true), mood:null, timer:0, step:0,
  init(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }

  },
  setMuted(m){ this.muted=m; store.set('muted',m); if(this.master) this.master.gain.setTargetAtTime(m?0:1,this.ctx.currentTime,.05); },
  setMusic(on){ this.music=on; store.set('music',on); this.setMood(this.mood); },
  tone(f,d,{type='sine',vol=.18,at=0,to=null,dest=null,attack=.005}={}){
    if(!this.ctx) return; const t=this.ctx.currentTime+at, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);

  noise(d,{vol=.2,at=0,freq=2000,q=.8,type='bandpass',to=null}={}){
    if(!this.ctx) return; const t=this.ctx.currentTime+at, len=Math.ceil(this.ctx.sampleRate*d);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=buf; const f=this.ctx.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); if(to) f.frequency.exponentialRampToValueAtTime(to,t+d); f.Q.value=q;

  },
  /* ---- effects ---- */
  click(){this.tone(900,.05,{type:'triangle',vol:.08})},
  tick(i=0){this.tone(1100+i*30,.04,{type:'square',vol:.035})},
  ok(){this.tone(660,.12,{vol:.2});this.tone(990,.18,{vol:.2,at:.08});this.noise(.15,{vol:.05,freq:6000,at:.02})},
  pass(){this.tone(220,.3,{type:'sawtooth',vol:.07,to:140})},
  whoosh(){this.noise(.35,{vol:.18,freq:400,to:3000,q:1.2})},
  slam(){this.tone(80,.5,{type:'sine',vol:.5,to:40});this.noise(.4,{vol:.25,freq:900,q:.5,type:'lowpass'})},
  heart(){this.tone(60,.15,{vol:.45,to:45});this.tone(55,.15,{vol:.35,to:40,at:.18})},
  roll(d){ if(!this.ctx) return; for(let t=0;t<d;t+=.045) this.noise(.05,{vol:.05+.12*(t/d),freq:1800,at:t,q:2}); },
  cymbal(){this.noise(1.1,{vol:.22,freq:7000,type:'highpass',q:.3})},
  go(){this.tone(523,.12,{type:'triangle',vol:.2});this.tone(784,.3,{type:'triangle',vol:.22,at:.1})},
  capture(i){this.tone(330*Math.pow(1.06,i),.12,{type:'triangle',vol:.12});},
  lose(){this.tone(392,.25,{type:'sawtooth',vol:.08});this.tone(311,.3,{type:'sawtooth',vol:.08,at:.22});this.tone(233,.6,{type:'sawtooth',vol:.08,at:.46})},
  win(){[523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.25,{type:'triangle',vol:.17,at:i*.1}));this.cymbal()},
  badge(){[880,1175,1568].forEach((f,i)=>this.tone(f,.2,{type:'sine',vol:.14,at:i*.07}))},
  /* ---- music ---- */
  setMood(m){
    this.mood=m; if(!this.ctx){ this.pending=m; return; }
    clearInterval(this.timer);
    const on=m && this.music;
    this.mus.gain.setTargetAtTime(on?(m==='duel'?.16:.12):0,this.ctx.currentTime,.4);
    if(!on) return;
    const bpm=m==='duel'?132:92, stepDur=60/bpm/2; let next=this.ctx.currentTime+.05; this.step=0;
    const prog=m==='duel'?[[57,60,64],[57,60,64],[53,57,60],[55,59,62]]:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
    const mtof=n=>440*Math.pow(2,(n-69)/12);
    this.timer=setInterval(()=>{
      while(next<this.ctx.currentTime+.25){
        const bar=Math.floor(this.step/8)%4, s=this.step%8, ch=prog[bar], at=next-this.ctx.currentTime;
        if(s%4===0) this.tone(mtof(ch[0]-24),stepDur*3.5,{type:'triangle',vol:.22,at,dest:this.mus});

        this.tone(mtof(ch[arp]+12),stepDur*1.6,{type:'sine',vol:m==='duel'?.07:.06,at,dest:this.mus,attack:.01});

  },
  noiseTo(at,vol){ if(!this.ctx) return; const t=this.ctx.currentTime+at,len=Math.ceil(this.ctx.sampleRate*.08),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),c=buf.getChannelData(0);for(let i=0;i<len;i++)c[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource();s.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=5000;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+.08);s.connect(f).connect(g).connect(this.mus);s.start(t);s.stop(t+.1)}
};
document.addEventListener('pointerdown',()=>SND.init(),{passive:true});
SND.duck=function(on){ if(!this.ctx||!this.mus) return; const base=this.mood&&this.music?(this.mood==='duel'?.16:.12):0; this.mus.gain.setTargetAtTime(on?base*.22:base,this.ctx.currentTime,.12); };
/* =====================================================================
   NARRATOR: pre-recorded Hebrew clips (Azure, voice "Avri")
   ===================================================================== */
const NARR={
  on:store.get('narr',true), cur:null, last:{}, busyUntil:0, token:0,
  has(ev){ return typeof VOICE!=='undefined'&&VOICE[ev]&&VOICE[ev].length },
  say(ev,{soft=false,force=false}={}){ if(!this.on||!this.has(ev)) return; if(G&&G.auto&&!force) return; if(soft&&this.busy()) return;
    const list=VOICE[ev]; let fn=pick(list); if(list.length>1){ let g=0; while(fn===this.last[ev]&&g++<5) fn=pick(list); } this.last[ev]=fn; this.play('voice/'+fn); },
  seq(evs,gap=120){ if(!this.on) return; const t=++this.token; const next=i=>{ if(i>=evs.length||t!==this.token) return; const ev=evs[i]; if(!this.has(ev)) return next(i+1);
      const list=VOICE[ev], fn=pick(list); this.play('voice/'+fn,()=>setTimeout(()=>next(i+1),gap),true); }; next(0); },

      const a=new Audio(src); this.cur=a; this.busyUntil=Date.now()+6000; SND.duck(true);

document.addEventListener('visibilitychange',()=>{ if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend(); else SND.ctx.resume(); });

/* =====================================================================
   VISUAL FX: arena background + particles
   ===================================================================== */
const BG={
  c:$('#bg'), x:null, w:0, h:0, motes:[], t:0, tint:[255,181,71], raf:0,
  init(){
    this.x=this.c.getContext('2d'); this.resize(); addEventListener('resize',()=>this.resize());

  },

  run(){ if(this.running) return; this.running=true; const f=()=>{ const x=this.x; x.clearRect(0,0,innerWidth,innerHeight);

  },

    }

let G=null, D=null;
function newGame(override){
  if(!SET.cats) SET.cats=CATS.filter(c=>!c.mine).map(c=>c.id);
  const s=SET; let players;
  if(override) players=override;
  else if(s.mode==='cpu'){
    const bots=shuffle(BOT_NAMES.slice()).slice(0,s.size-1), used=[s.me.av];
    players=[{name:s.me.name||'אני',av:s.me.av,g:s.me.g,time:s.me.time||0,human:true},...bots.map(([n,g])=>{ const av=pick(AVATARS.filter(a=>!used.includes(a))); used.push(av); return {name:n,av,g,human:false}; })];
  } else players=s.friends.map(f=>({...f,human:true}));
  const n=players.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), total=rows*cols;
  let pool=s.cats.filter(id=>catById(id)&&allCatIds().includes(id)&&!(override&&catById(id).mine)); if(!pool.length) pool=allCatIds().filter(id=>!catById(id).mine);
  if(s.kids&&!(ON&&ON.pub)){ const k=pool.filter(id=>KIDS_CATS.includes(id)); pool=k.length?k:KIDS_CATS.filter(id=>allCatIds().includes(id)); }
  const cats=shuffle(pool.slice());
  shuffle(players);
  players=players.map((p,i)=>({...p,id:i,color:COLORS[i%COLORS.length],cat:cats[i%cats.length],alive:true,pw:SET.powers?[pick(PW_KEYS)]:[]}));
  const tiles=new Array(total).fill(-1), order=shuffle([...Array(total).keys()]);
  players.forEach((p,i)=>tiles[order[i]]=p.id);
  let guard=0; while(tiles.includes(-1)&&guard++<100) tiles.forEach((o,i)=>{ if(o!==-1) return; const nb=adjTiles(i,rows,cols).map(j=>tiles[j]).filter(x=>x!==-1); if(nb.length) tiles[i]=pick(nb); });
  G={players,tiles,rows,cols,used:{},auto:false,hl:null,targets:null,attacker:null,gs:{dw:{},best:{},ok:{}},final:null}; if(ON){ ON.over=null; ON.prompt=null; ON.pending=null; ON.ready=new Set(); }
  STATS.games++; saveStats(); checkAch();
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{}) }catch(e){}
  go('board'); NARR.say('welcome'); nextTurn();
}
function adjTiles(i,rows,cols){ const r=Math.floor(i/cols),c=i%cols,o=[]; if(r>0)o.push(i-cols); if(r<rows-1)o.push(i+cols); if(c>0)o.push(i-1); if(c<cols-1)o.push(i+1); return o; }
const alive=()=>G.players.filter(p=>p.alive);
const humansAlive=()=>alive().some(p=>p.human);
function neighbors(pid){ const s=new Set(); G.tiles.forEach((o,i)=>{ if(o!==pid) return; adjTiles(i,G.rows,G.cols).forEach(j=>{ if(G.tiles[j]!==pid) s.add(G.tiles[j]) }) }); return [...s].map(id=>G.players[id]); }
function anchorTile(pid){ const own=G.tiles.map((o,i)=>o===pid?i:-1).filter(i=>i>=0); if(!own.length) return -1;
  const cr=own.reduce((s,i)=>s+Math.floor(i/G.cols),0)/own.length, cc=own.reduce((s,i)=>s+i%G.cols,0)/own.length; let best=own[0],bd=1e9;
  own.forEach(i=>{const d=(Math.floor(i/G.cols)-cr)**2+(i%G.cols-cc)**2; if(d<bd){bd=d;best=i}}); return best; }
const countTiles=pid=>G.tiles.filter(o=>o===pid).length;

SCREENS.board=(s)=>{
  SND.setMood('board'); BG.setTint([255,181,71]); $('#vignette').classList.remove('on'); $('#vignette').style.opacity=0;
  s.innerHTML=`<div class="topbar"><div class="logo">טריטוריה</div><div class="row"><span class="pill" id="aliveCount"></span><button class="iconbtn" id="menuBtn" aria-label="תפריט">☰</button></div></div>
    <div class="scroll" style="flex:1;min-height:0">
      <div class="board-stage"><div class="board" id="board"></div><div class="spot" id="spot"></div></div>
      <div class="status" id="bstatus"></div><div class="actions" id="bactions"></div><div class="roster" id="roster"></div>
    </div>`;
  $('#menuBtn').onclick=()=>ON?modal({title:'תפריט',text:`חדר ${ON.code}`,buttons:[{label:'להמשיך לשחק',fn:()=>{}},{label:ON.role==='host'?'סגירת החדר ויציאה':'יציאה מהחדר',cls:'ghost',fn:()=>leaveRoom()}]}):modal({title:'תפריט',buttons:[
    {label:'להמשיך לשחק',fn:()=>{}},
    {label:'משחק חדש עם אותן הגדרות',cls:'ghost',fn:()=>newGame()},
    {label:'הגדרות',cls:'ghost',fn:()=>openSettings()},
    {label:'למסך הראשי',cls:'ghost',fn:()=>{G.auto=false;go('home')}}]});
  renderBoard();
};
function renderBoard(){
  const b=$('#board'); if(!b) return; b.innerHTML='';
  b.style.gridTemplateColumns=`repeat(${G.cols},1fr)`; b.classList.toggle('small',G.cols>=4);
  const anchors=new Map(); G.players.forEach(p=>{ if(p.alive) anchors.set(anchorTile(p.id),p) });
  G.tiles.forEach((o,i)=>{
    const p=G.players[o], t=document.createElement('div'); t.className='tile'; t.dataset.i=i; t.style.backgroundColor=p.color;
    const r=Math.floor(i/G.cols), c=i%G.cols, W=3, same=j=>G.tiles[j]===o;
    const sT=r>0&&same(i-G.cols), sL=c>0&&same(i-1);
    t.style.backgroundSize=`${G.cols*100}% ${G.rows*100}%`;
    t.style.backgroundPosition=`${G.cols>1?c/(G.cols-1)*100:0}% ${G.rows>1?r/(G.rows-1)*100:0}%`;
    if(sL) t.style.marginLeft='-1px'; if(sT) t.style.marginTop='-1px';
    if(anchors.has(i)){ const cat=catById(p.cat); t.classList.add('anchor'); t.innerHTML=`<span class="av">${p.av}</span><span class="nm">${esc(p.name)}</span><span class="cn">${cat.icon} ${esc(cat.name)}</span>`; }
    if(G.hl===o) t.classList.add('hl');
    if(G.targets){ if(G.targets.has(o)){ t.classList.add('tgt'); t.onclick=()=>{ if(G.client){ if(G.pick) G.pick(p.id); return; } if(G.attacker) attack(G.attacker,p) }; } else if(o!==G.hl) t.classList.add('dim'); }
    b.appendChild(t);
  });
  const segs=[], hls=[];
  const own=(r,c)=>(r<0||c<0||r>=G.rows||c>=G.cols)?-1:G.tiles[r*G.cols+c];
  for(let r=0;r<=G.rows;r++) for(let c=0;c<G.cols;c++){ const A=own(r-1,c),B=own(r,c); if(A!==B){ if(A!==-1&&B!==-1) segs.push(`M${c} ${r}H${c+1}`); if(G.hl!=null&&(A===G.hl||B===G.hl)) hls.push(`M${c} ${r}H${c+1}`); } }
  for(let c=0;c<=G.cols;c++) for(let r=0;r<G.rows;r++){ const A=own(r,c-1),B=own(r,c); if(A!==B){ if(A!==-1&&B!==-1) segs.push(`M${c} ${r}V${r+1}`); if(G.hl!=null&&(A===G.hl||B===G.hl)) hls.push(`M${c} ${r}V${r+1}`); } }
  const sv=document.createElementNS('http://www.w3.org/2000/svg','svg'); sv.setAttribute('class','edges'); sv.setAttribute('viewBox',`0 0 ${G.cols} ${G.rows}`); sv.setAttribute('preserveAspectRatio','none');
  sv.innerHTML=`<path d="${segs.join('')}" stroke="#0b1324" stroke-width="6" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>`+
    (hls.length?`<path d="${hls.join('')}" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px rgba(255,255,255,.8))"/>`:'');
  b.appendChild(sv);
  $('#aliveCount').textContent=`נשארו ${alive().length}`;
  pushState();
  const ro=$('#roster'); ro.innerHTML='';

  let lo=0,hi=n; const lv=SET.kids&&!(ON&&ON.pub)?'easy':SET.qdiff;

  const h=document.createElement('div'); h.className='hostbtns'+(SET.answer!=='host'?' slim':''); h.innerHTML=SET.answer==='choices'?`<button class="b-pass" style="grid-column:1/-1">דלג</button>`:`<button class="b-ok">✓ נכון</button><button class="b-pass">דלג</button>`;
  [...h.children].forEach(b=>{ b.disabled=!en; b.onclick=()=>b.classList.contains('b-ok')?dailyOk():dailyPass(); }); c.appendChild(h);
  if(SET.answer==='voice'){ const m=document.createElement('button'); m.className='mic'; m.id='micPill'; m.onclick=()=>{ if(Mic.denied&&!Mic.inClaude) Mic.denied=false; if(Mic.available()&&Mic.state!=='on') Mic.start(); }; c.appendChild(m); renderMic(); }
}
function dailySpeech(key,alts){
  const Y=DAILY; const fb=$('#dyFeed'); if(fb&&!fb.classList.contains('ok')) fb.textContent=alts[0]?`"${alts[0].trim()}"`:'';
  if(Y.lock||Y.loading) return; const item=Y.qs[Y.i][1]; const used=Mic.consumed.get(key)||0;
  for(const alt of alts){ const n=norm(alt), f=n.slice(used).trim(); if(f&&matches(f,item.a)){ Mic.consumed.set(key,n.length); return dailyOk(); } }
  for(const alt of alts){ const n=norm(alt), f=n.slice(used).trim(); if(PASS_RE.test(f)){ Mic.consumed.set(key,n.length); return dailyPass(); } }
}
function dailyOk(){ const Y=DAILY; if(!Y.running||Y.lock||Y.loading) return; Y.score++; Y.hist.push(true); SND.ok(); buzz(20);
  $('#dyScore').textContent=Y.score+' נקודות'; const fb=$('#dyFeed'); fb.className='feed'; void fb.offsetWidth; fb.className='feed ok'; fb.textContent='✓ '+Y.qs[Y.i][1].a[0];
  FX.elBurst($('#dyStage .qcard'),'#38e09a',24,6); Y.i++; setTimeout(dailyNext,150); }
function dailyPass(){ const Y=DAILY; if(!Y.running||Y.lock||Y.loading) return; Y.lock=true; Y.hist.push(false); SND.pass(); shakeEl($('#dyStage'));
  const r=document.createElement('div'); r.className='reveal'; r.innerHTML=`<small>התשובה</small>${esc(Y.qs[Y.i][1].a[0])}`; $('#dyStage').appendChild(r); dailyControls();
  setTimeout(()=>{ if(DAILY===Y&&Y.running){ Y.i++; dailyNext(); } },1600); }
function dailyEnd(){
  const Y=DAILY; Y.running=false; cancelAnimationFrame(Y.raf); Mic.stop(); NARR.say('dailyend'); $('#vignette').classList.remove('on'); SND.setMood(null);
  if(!Y.practice){ STATS.daily[todayKey()]=Y.score; saveStats(); checkAch(); dailySubmit(Y.score); }
  SND.win(); FX.confetti(Y.score>=10?200:80);
  $('#dyStage').innerHTML=`<div class="result"><div class="big-num">${Y.score}</div><h3>${Y.score>=20?'מדהים!':Y.score>=12?'יפה מאוד!':'כל הכבוד!'}</h3><p class="hint">${Y.practice?'סיבוב אימון, לא נשמר':'תשובות נכונות ב־60 שניות'}</p></div>`;
  const c=$('#dyCtl'); c.innerHTML=''; const b=document.createElement('button'); b.className='big'; b.textContent='שיתוף התוצאה'; b.onclick=()=>shareDaily(Y.score); c.appendChild(b);
  const h=document.createElement('button'); h.className='ghost'; h.textContent='למסך הראשי'; h.onclick=()=>{DAILY=null;go('home')}; c.appendChild(h);
}

SCREENS.stats=(s)=>{
  s.classList.add('scroll');
  const topCats=Object.entries(STATS.catCorrect).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>{const c=catById(id);return c?`<div class="li"><span style="font-size:26px">${c.icon}</span><div><b>${esc(c.name)}</b><small>${n} תשובות נכונות</small></div></div>`:''}).join('');
  s.innerHTML=`<div class="topbar"><button class="iconbtn" id="back" aria-label="חזרה">→</button><div class="logo" style="font-size:34px">הישגים</div><span style="width:40px"></span></div>
    <div class="stat-grid"><div class="stat"><b>${STATS.games}</b><small>משחקים</small></div><div class="stat"><b>${STATS.wins}</b><small>ניצחונות</small></div><div class="stat"><b>${STATS.duelWins}/${STATS.duels}</b><small>דו־קרבות</small></div>
      <div class="stat"><b>${STATS.correct}</b><small>תשובות נכונות</small></div><div class="stat"><b>${STATS.bestStreak}</b><small>רצף שיא</small></div><div class="stat"><b>${Math.max(0,...Object.values(STATS.daily))}</b><small>שיא יומי</small></div></div>
    ${topCats?`<div class="field"><span class="flabel">הקטגוריות הכי חזקות שלך</span><div class="list">${topCats}</div></div>`:''}
    <div class="field"><span class="flabel">הישגים (${STATS.ach.length}/${ACH.length})</span><div class="list">${ACH.map(a=>`<div class="ach ${STATS.ach.includes(a.id)?'':'locked'}"><span class="ai">${a.ic}</span><div><b>${a.t}</b><small>${a.d}</small></div></div>`).join('')}</div></div>`;
  $('#back').onclick=()=>go('home');
};

/* =====================================================================
   MY CATEGORIES: photos from the phone

SCREENS.mycats=(s)=>{
  s.classList.add('scroll');
  s.innerHTML=`<div class="topbar"><button class="iconbtn" id="back" aria-label="חזרה">→</button><div class="logo" style="font-size:34px">הקטגוריות שלי</div><span style="width:40px"></span></div>
    <p class="hint">צרו קטגוריה עם תמונות מהטלפון: חברים, משפחה, הקבוצה שלכם. התמונות נשמרות רק במכשיר הזה.</p>
    <div class="list" id="mcList" style="padding-block:12px"></div>
    ${Mic.inClaude?'':`<div class="row" style="padding-bottom:10px"><input class="inp" id="mcCode" inputmode="numeric" maxlength="6" placeholder="קוד קטגוריה ששלחו לכם" style="text-align:center;letter-spacing:4px"><button class="ghost" style="width:auto;white-space:nowrap" id="mcImport">הוספה</button></div>`}
    <div class="sticky-foot"><button class="big" id="mcNew">קטגוריה חדשה</button></div>`;
  if($('#mcImport')) $('#mcImport').onclick=()=>importSharedCat($('#mcCode').value.trim());
  $('#back').onclick=()=>go('home');
  const list=$('#mcList');
  list.innerHTML=MYCATS.length?MYCATS.map((c,i)=>`<button class="li" data-i="${i}" style="text-align:start"><span style="font-size:28px">${c.icon}</span><div><b>${esc(c.name)}</b><small>${c.items.length} תמונות${c.items.length<4?' · צריך לפחות 4 בשביל משחק':''}</small></div><span>←</span></button>`).join(''):'<p class="hint" style="text-align:center;padding:30px 0">עוד אין קטגוריות. צרו את הראשונה.</p>';
  list.querySelectorAll('.li').forEach(b=>b.onclick=()=>go('mycat',MYCATS[+b.dataset.i].id));
  $('#mcNew').onclick=()=>{
    const n=document.createElement('div'); n.style.cssText='display:flex;flex-direction:column;gap:10px';
    n.innerHTML=`<input class="inp" id="ncName" maxlength="24" placeholder="שם הקטגוריה, למשל: החברים מהכיתה"><div class="av-grid" id="ncIc">${['📸','👨‍👩‍👧','🎓','⚽','🏫','🐶','🎉','🏖️','🍽️','🎬','🎵','💼'].map((a,i)=>`<button data-a="${a}" class="${i?'':'on'}">${a}</button>`).join('')}</div>`;
    let ic='📸'; n.querySelector('#ncIc').onclick=e=>{const b=e.target.closest('button'); if(!b) return; ic=b.dataset.a; n.querySelectorAll('#ncIc button').forEach(x=>x.classList.toggle('on',x===b))};
    modal({title:'קטגוריה חדשה',node:n,buttons:[{label:'יצירה',fn:async()=>{ const name=n.querySelector('#ncName').value.trim()||'הקטגוריה שלי'; const c={id:'my-'+Date.now(),name,icon:ic,items:[]}; MYCATS.push(c); await IDB.put(c); STATS.created=true; saveStats(); checkAch(); go('mycat',c.id); }},{label:'ביטול',cls:'ghost',fn:()=>{}}]});
  };
};
SCREENS.mycat=(s,id)=>{
  const c=MYCATS.find(x=>x.id===id); if(!c) return go('mycats');
  s.classList.add('scroll');
  s.innerHTML=`<div class="topbar"><button class="iconbtn" id="back" aria-label="חזרה">→</button><div class="logo" style="font-size:30px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.icon} ${esc(c.name)}</div><button class="iconbtn" id="mcDel" aria-label="מחיקת הקטגוריה">🗑️</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <b>הוספת תמונה</b>
      <label class="ghost" style="text-align:center;cursor:pointer">📷 בחירת תמונה או צילום<input type="file" accept="image/*" id="mcFile" hidden></label>
      <img id="mcPrev" alt="" hidden style="max-height:200px;object-fit:contain;border-radius:12px">
      <input class="inp" id="mcAns" placeholder="התשובה, למשל: דנה" maxlength="40">
      <input class="inp" id="mcAlt" placeholder="תשובות נוספות שמתקבלות, מופרדות בפסיק (לא חובה)" maxlength="80">
      <button class="big" id="mcAdd" disabled>הוספה לקטגוריה</button>
    </div>
    <div class="list" id="mcItems" style="padding-block:14px"></div>`;
  $('#back').onclick=()=>{ syncMyCats(); go('mycats'); };
  if(!Mic.inClaude&&c.items.length){ const sh=document.createElement('button'); sh.className='ghost'; sh.textContent='📤 שיתוף הקטגוריה עם המשפחה'; sh.onclick=()=>shareCat(c); s.insertBefore(sh,s.children[1]); }
  $('#mcDel').onclick=()=>modal({title:'למחוק את הקטגוריה?',text:'כל התמונות בה יימחקו מהמכשיר.',buttons:[{label:'מחיקה',fn:async()=>{ MYCATS=MYCATS.filter(x=>x!==c); await IDB.del(c.id); syncMyCats(); go('mycats'); }},{label:'ביטול',cls:'ghost',fn:()=>{}}]});
  let data=null;
  const upd=()=>{ $('#mcAdd').disabled=!(data&&$('#mcAns').value.trim()); };
  $('#mcFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,560/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=im.width*k|0; cv.height=im.height*k|0; cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); data=cv.toDataURL('image/jpeg',.82); $('#mcPrev').src=data; $('#mcPrev').hidden=false; upd(); }; im.src=r.result; }; r.readAsDataURL(f); };
  $('#mcAns').oninput=upd;
  $('#mcAdd').onclick=async()=>{ const a=[$('#mcAns').value.trim(),...$('#mcAlt').value.split(',').map(x=>x.trim()).filter(Boolean)]; c.items.push({img:data,a}); await IDB.put(c); toast('✅','התמונה נוספה',`${c.items.length} תמונות בקטגוריה`); SND.ok(); go('mycat',c.id); };
  $('#mcItems').innerHTML=c.items.map((it,i)=>`<div class="li"><img class="th" src="${it.img}" alt=""><div><b>${esc(it.a[0])}</b><small>${esc(it.a.slice(1).join(', '))}</small></div><button class="iconbtn" data-i="${i}" aria-label="מחיקה">✕</button></div>`).join('')||'<p class="hint" style="text-align:center">עוד אין תמונות.</p>';
  $('#mcItems').querySelectorAll('button[data-i]').forEach(b=>b.onclick=async()=>{ c.items.splice(+b.dataset.i,1); await IDB.put(c); go('mycat',c.id); });
};

SCREENS.credits=(s)=>{
  s.classList.add('scroll');
  const cats=CATS.filter(c=>IMG_KINDS.has(c.kind)&&!c.mine);
  s.innerHTML=`<div class="topbar"><button class="iconbtn" id="back" aria-label="חזרה">→</button><div class="logo" style="font-size:34px">קרדיטים</div><span style="width:40px"></span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6">
      <p style="margin:0">התמונות לקוחות מוויקיפדיה ומוויקישיתוף. הזכויות שמורות ליוצרים, לפי הרישיון של כל תמונה. לחצו על קטגוריה כדי לראות את הצלם והרישיון של כל תמונה.</p>
      <p style="margin:0;color:var(--muted)">לוגואים: Simple Icons (CC0). סמלי קבוצות ולוגואים הם סימני מסחר של בעליהם ומוצגים לצורך זיהוי בלבד. אימוג'י: גופן המערכת של המכשיר.</p>
    </div>
    <div class="chips" id="crCats" style="padding-block:14px">${cats.map(c=>`<button class="chip" data-c="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
    <div id="crList"></div>`;
  $('#back').onclick=()=>go('home');
  s.querySelectorAll('#crCats .chip').forEach(b=>b.onclick=()=>{ s.querySelectorAll('#crCats .chip').forEach(x=>x.classList.toggle('on',x===b)); const c=catById(b.dataset.c);
    $('#crList').innerHTML=c.items.map(it=>{ const m=it.p.match(/\/(commons|en)\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^/]+)/); const file=m?decodeURIComponent(m[2]):''; const cr=(typeof CREDITS!=='undefined'&&CREDITS[file])||null; const isC=m&&m[1]==='commons';
      return `<div class="credit"><b>${esc(it.a[0])}</b> · ${isC?`<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(file)}" target="_blank" rel="noopener">ויקישיתוף</a>${cr?` · ${esc(cr[0]||'יוצר לא ידוע')} · ${esc(cr[1]||'')}`:''}`:'ויקיפדיה האנגלית, שימוש הוגן'}</div>`; }).join(''); });
};
