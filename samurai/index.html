<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1428">
<title>קרב הסמוראים — אבן, נייר ומספריים</title>
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קרב הסמוראים">
<meta name="description" content="קרב הסמוראים — אבן, נייר ומספריים על לוח בתלת-ממד. 50 שלבים, 10 צבאות לפתיחה, לוחות מיוחדים, שני שחקנים ובליץ.">
<style>
:root{--me:#1f7bff;--ai:#ff2e3c;--gold:#ffc83a;--ink:#fbf4e8;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1428;overscroll-behavior:none}
body{font-family:'Fredoka','Rubik',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:5}
.ui *{pointer-events:auto}
.top{padding:calc(var(--st) + 10px) 12px 0;background:linear-gradient(rgba(15,10,25,.75),rgba(15,10,25,0));padding-bottom:26px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:21px;font-weight:900;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
h1 small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:1px;margin-top:3px}
.ibtn{width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.2);background:rgba(20,14,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font-size:18px;display:grid;place-items:center;font-family:inherit;font-weight:700}
.ibtn:active{transform:scale(.92)}
.pills{margin-top:10px}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(20,14,32,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:13px;transition:box-shadow .3s}
.pill i{width:11px;height:11px;border-radius:50%;display:block}
.pill.me i{background:var(--me)} .pill.ai i{background:var(--ai)}
.pill span{font-weight:500;opacity:.8}
.pill.on{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(242,193,78,.45)}
.msg{margin-top:10px;text-align:center;font-size:15px;font-weight:500;min-height:22px;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none}
.msg b{color:var(--gold)}
.spacer{flex:1;pointer-events:none}
.bottom{padding:24px 12px calc(var(--sb) + 14px);background:linear-gradient(rgba(15,10,25,0),rgba(15,10,25,.7));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:700;font-size:16px;padding:13px 20px;border-radius:15px;border:none;color:#1b1424;background:var(--gold);box-shadow:0 4px 0 #b4871f,0 8px 20px rgba(0,0,0,.35);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4871f}
.btn.ghost{background:rgba(20,14,32,.6);color:var(--ink);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 0 rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* duel banner */
.banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:8;text-align:center;pointer-events:none;width:92%}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner h2,.banner p{background:none}
.banner .bx{display:inline-block;padding:10px 22px 12px;border-radius:20px}
.banner h2{margin:0;font-size:38px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #5a3a0a,0 0 24px rgba(242,193,78,.5)}
.banner p{margin:6px 0 0;font-size:19px;font-weight:700;text-shadow:0 2px 8px #000}
.pick{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 22px);display:none;justify-content:center;gap:14px;z-index:9}
.pick.show{display:flex;animation:up .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.pick button{width:88px;height:88px;border-radius:24px;border:4px solid var(--me);background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #1a3a8a,0 10px 24px rgba(0,0,0,.4)}
.pick button:active{transform:translateY(4px);box-shadow:0 2px 0 #1a3a8a}
.pick button img{width:64%;height:64%}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:9;font-size:44px;font-weight:900;color:#ff6a50;text-shadow:0 4px 0 #3a0a05,0 0 30px rgba(255,90,60,.6);transition:.3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.gold{color:var(--gold);text-shadow:0 4px 0 #5a3a0a,0 0 26px rgba(242,193,78,.55)}
/* cards */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;padding:16px;justify-content:center;background:rgba(8,5,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.show{display:flex}
.card{width:100%;max-width:520px;background:linear-gradient(170deg,#2c2442,#18122a);border:1px solid rgba(255,255,255,.15);border-radius:26px;padding:20px;max-height:88vh;overflow:auto;animation:sheet .4s cubic-bezier(.2,1.4,.4,1);box-shadow:0 30px 70px rgba(0,0,0,.6)}
@keyframes sheet{from{transform:scale(.8);opacity:0}}
.card .grab{display:none}
.card h2{margin:0 0 8px;color:var(--gold);font-weight:900;font-size:24px}
.card p,.card li{line-height:1.6;font-size:15px;opacity:.92}
.card ul{padding-inline-start:20px;margin:6px 0 12px}
.legend{display:flex;gap:10px;justify-content:space-between;margin:12px 0}
.legend div{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:4px;flex:1}
.legend span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
.legend img{width:72%;height:72%}
.big{font-size:56px;text-align:center;margin:0}
.center{text-align:center}
.card .bottom{background:none;padding:10px 0 0}
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at top,#3a2a52,#140f20);font-weight:700;transition:opacity .6s}
#loading .sp{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading.hide{opacity:0;pointer-events:none}

.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t b" "p p" "m m";align-items:center;column-gap:10px}
.top .t{grid-area:t} .top .btns{grid-area:b;display:flex;gap:6px} .top .pills{grid-area:p;display:flex;justify-content:space-between;gap:8px;margin-top:10px} .top .msg{grid-area:m}
#fsBtn{display:none}
.fs-ok #fsBtn{display:grid}
@media (orientation:landscape) and (max-height:540px){
  .top{grid-template-columns:auto 1fr auto;grid-template-areas:"t p b" "m m m";padding:calc(var(--st) + 6px) calc(env(safe-area-inset-right,0px) + 12px) 10px calc(env(safe-area-inset-left,0px) + 12px)}
  h1{font-size:17px} h1 small{font-size:10px;margin-top:2px}
  .top .pills{margin-top:0;justify-content:center;gap:10px}
  .pill{padding:5px 11px;font-size:12px}
  .ibtn{width:36px;height:36px;font-size:16px;border-radius:11px}
  .msg{margin-top:4px;font-size:13px;min-height:18px}
  .bottom{justify-content:flex-start;padding:10px calc(env(safe-area-inset-right,0px) + 12px) calc(var(--sb) + 8px) calc(env(safe-area-inset-left,0px) + 12px);background:none}
  .btn{font-size:14px;padding:9px 14px;min-height:40px;border-radius:12px}
  .banner h2{font-size:30px} .banner p{font-size:16px}
  .pick button{width:70px;height:70px;border-radius:20px}
  .pick{bottom:calc(var(--sb) + 12px)}
  .toast{font-size:34px}
  .card{max-height:92vh;padding:14px 18px} .ov{padding:8px}
  .card p,.card li{font-size:13.5px;line-height:1.45}
  .legend span{width:40px;height:40px}
}
#rotate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px;
  background:radial-gradient(ellipse at top,#3a2a52,#120d1d)}
#rotate .ph{width:70px;height:120px;border:5px solid var(--ink);border-radius:16px;position:relative;animation:rot 2.2s ease-in-out infinite}
#rotate .ph::after{content:"";position:absolute;bottom:7px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:var(--ink)}
@keyframes rot{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate h2{margin:0;font-size:26px;font-weight:900;color:var(--gold)}
#rotate p{margin:0;opacity:.85;font-size:16px;line-height:1.5}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }

body.duel .msg, body.duel .pills{opacity:0;transition:opacity .3s}
body.duel .banner{top:19%}
.msg,.pills{transition:opacity .3s}
@media (orientation:landscape) and (max-height:540px){ body.duel .banner h2{font-size:28px} }

/* ===== game skin ===== */
h1,.banner h2,.toast,.card h2,#splash h1,#rotate h2,.big-title{font-family:'Suez One','Fredoka',serif;font-weight:400;letter-spacing:.5px}
h1{font-size:23px;background:linear-gradient(#fff6c8,#ffc83a 55%,#f08a12);-webkit-background-clip:text;background-clip:text;color:transparent;
   -webkit-text-stroke:1px rgba(80,30,0,.55);filter:drop-shadow(0 2px 0 #4a1d00) drop-shadow(0 3px 6px rgba(0,0,0,.5));text-shadow:none}
h1 small{font-family:'Fredoka';font-weight:600;color:#ffe9b8;-webkit-text-fill-color:#ffe9b8;-webkit-text-stroke:0;letter-spacing:2px}
.banner h2{font-size:46px;color:#ffd23f;-webkit-text-stroke:1px #5a2400;paint-order:stroke fill;text-shadow:0 4px 0 #4a1d00,0 6px 14px rgba(0,0,0,.55),0 0 26px rgba(255,170,0,.5)}
.banner p{font-weight:600;font-size:20px;color:#fff;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.7)}
.banner .bx{background:none;border:none;padding:14px 34px 18px}
.toast{font-size:52px;-webkit-text-stroke:2px #4a0500}
.toast.gold{-webkit-text-stroke:2px #5a2400}
.btn{font-family:'Fredoka';font-weight:700;letter-spacing:.3px;color:#3a1600;background:linear-gradient(#ffe680,#ffb820 55%,#f08c00);
     border:2px solid #7a3a00;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,70,0,.5),0 4px 0 #7a3a00,0 8px 18px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 1px 0 #7a3a00}
.btn.ghost{color:#fff;background:linear-gradient(#5b4ad6,#3a2a9e);border:2px solid #1e1460;text-shadow:0 1px 0 #000;
     box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #1e1460,0 8px 18px rgba(0,0,0,.4)}
.ibtn{background:linear-gradient(#5b4ad6,#3a2a9e);border:2px solid #1e1460;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #1e1460}
.pill{font-family:'Fredoka';font-weight:600;background:linear-gradient(rgba(40,24,90,.85),rgba(20,10,50,.85));border:2px solid rgba(255,255,255,.2)}
.pill.me{border-color:#1f7bff} .pill.ai{border-color:#ff2e3c}
.pill i{box-shadow:0 0 8px currentColor}
.msg{font-weight:600}
.card{background:linear-gradient(170deg,#3b2a9e,#1c1250);border:2px solid #ffc83a;box-shadow:0 0 0 4px rgba(30,20,80,.8),0 30px 70px rgba(0,0,0,.6)}
.card h2{font-size:30px;color:#ffc83a;text-shadow:0 3px 0 #4a1d00}
.pick button{border-width:4px;background:linear-gradient(#fff,#e9f0ff)}
#rotate{z-index:40}
#rotate h2{font-size:30px}
/* splash */
#splash{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:radial-gradient(ellipse at center,rgba(30,10,60,.15),rgba(15,5,35,.75));transition:opacity .5s;padding:20px}
#splash.hide{opacity:0;pointer-events:none}
body.pre .ui{opacity:0;pointer-events:none} .ui{transition:opacity .5s}
#splash h1{font-size:clamp(46px,11vw,92px);line-height:1;margin:0;-webkit-text-stroke:2px #5a2400;filter:drop-shadow(0 6px 0 #4a1d00) drop-shadow(0 0 30px rgba(255,170,0,.5));animation:float 3s ease-in-out infinite}
#splash .sub{font-family:'Fredoka';font-weight:700;font-size:clamp(16px,3.6vw,24px);color:#fff;letter-spacing:3px;text-shadow:0 2px 0 #000,0 0 12px #ff2e9a}
#splash .go{margin-top:18px;font-size:24px;padding:16px 38px;border-radius:20px;animation:pulseBtn 1.4s ease-in-out infinite}
#splash .note{font-size:13px;opacity:.75;margin-top:6px;font-weight:500}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
@media (orientation:landscape) and (max-height:540px){ #splash h1{font-size:64px} #splash .go{padding:12px 30px;font-size:21px;margin-top:10px} .banner h2{font-size:34px} .toast{font-size:40px} }

/* ===== menus ===== */
#menu{position:fixed;inset:0;z-index:44;display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 10px) calc(env(safe-area-inset-right,0px) + 14px) calc(var(--sb) + 10px) calc(env(safe-area-inset-left,0px) + 14px);background:radial-gradient(ellipse at center,rgba(25,10,60,.35),rgba(10,4,30,.85))}
#menu.show{display:flex}
.mwrap{width:min(780px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;animation:sheet .35s cubic-bezier(.2,1.4,.4,1);padding:4px 2px 10px;scrollbar-width:none}
.mwrap::-webkit-scrollbar{display:none}
.mtitle{font-size:clamp(38px,8vw,64px)!important;margin:0 0 4px!important;-webkit-text-stroke:1.5px #5a2400!important}
.msub{font-family:'Suez One',serif;font-weight:400;font-size:30px;margin:0;color:#ffd23f;text-shadow:0 3px 0 #4a1d00}
.msub small{font-family:'Fredoka';font-size:16px;color:#fff;text-shadow:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.mbtn{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;text-align:right;font-family:'Fredoka';color:#fff;background:linear-gradient(#5b4ad6,#3a2a9e);border:2px solid #1e1460;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 #1e1460,0 8px 16px rgba(0,0,0,.35);font-size:19px;font-weight:700;width:100%}
.mbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 #1e1460}
.mbtn.gold{color:#3a1600;background:linear-gradient(#ffe680,#ffb820 55%,#f08c00);border-color:#7a3a00;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 #7a3a00,0 8px 16px rgba(0,0,0,.35)}
.mbtn .ic{font-size:30px;line-height:1} .mbtn small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px}
.mbtn.sm{font-size:16px;padding:9px 12px}
.link{background:none;border:none;color:#ffe9b8;font:600 15px 'Fredoka';text-decoration:underline;padding:6px}
.sect{width:100%;background:rgba(30,20,80,.6);border:2px solid rgba(255,200,58,.35);border-radius:18px;padding:10px 14px}
.sect h3{margin:0 0 8px;font:600 15px 'Fredoka';color:#ffd96a}
.sect h3 small{color:#fff;opacity:.7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;font:600 15px 'Fredoka'}
.chip.on{background:linear-gradient(#ffe680,#ffb820);color:#3a1600;border-color:#7a3a00}
.chip.lock{opacity:.5}
.mrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;width:100%}
.btn.big{font-size:19px;padding:13px 26px}
.btn.back{margin-top:2px}
.btn.danger{background:linear-gradient(#a33,#711);border-color:#400}
.mp{margin:2px 0;text-align:center;font-weight:500;line-height:1.5}
.mp.dim{opacity:.7;font-size:14px} .mp.err{color:#ff8a7a;font-weight:700}
.lvls{display:flex;flex-direction:column;gap:8px;width:100%}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;text-align:right;color:#fff;background:linear-gradient(90deg,rgba(91,74,214,.9),rgba(58,42,158,.9));border:2px solid #ffc83a;font-family:'Fredoka';box-shadow:0 4px 0 #1e1460}
.lvl.lock{filter:grayscale(.8);opacity:.6;border-color:#555}
.lvl .ln{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ffc83a;color:#3a1600;font:400 20px 'Suez One';flex:none}
.lvl .lt{flex:1} .lvl b{font-size:17px} .lvl small{display:block;opacity:.8;font-size:12.5px}
.lvl .ls{font-size:15px;letter-spacing:1px;white-space:nowrap}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#fff;font:600 13px 'Fredoka'}
.skin i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.skin.on{border-color:#ffc83a;background:rgba(255,200,58,.2)} .skin.lock{opacity:.5} .skin small{opacity:.8;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%}
.stat{background:rgba(30,20,80,.65);border:2px solid rgba(255,200,58,.35);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:400 28px 'Suez One';color:#ffd23f} .stat span{font-size:13px;opacity:.85}
.code{font:400 64px 'Suez One';letter-spacing:12px;color:#ffd23f;text-shadow:0 4px 0 #4a1d00;direction:ltr}
.codein{font:700 24px 'Fredoka';letter-spacing:6px;text-align:center;width:120px;padding:8px;border-radius:14px;border:2px solid #ffc83a;background:#1c1250;color:#fff;direction:ltr}
.joinbox{display:flex;gap:6px;align-items:center}
.olist{display:flex;flex-direction:column;gap:6px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite}
.stars{font-size:34px;margin:0} .unlock{color:#ffd23f;font-weight:700}
/* pass screen */
#pass{position:fixed;inset:0;z-index:43;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--tc,#1f7bff) 45%,#120a2a),#0a0618);padding:20px}
#pass.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.pbox{text-align:center;max-width:520px}
.pbox h2{font:400 34px 'Suez One';color:#fff;margin:10px 0 6px;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.pbox p{margin:0 0 16px;font-weight:500;opacity:.9}
.pdot{width:64px;height:64px;border-radius:50%;margin:0 auto;background:var(--tc);box-shadow:0 0 30px var(--tc),inset 0 -6px 0 rgba(0,0,0,.25)}
.pick.inl{position:static;display:flex;justify-content:center}
/* blitz timer */
.timer{position:fixed;left:50%;top:calc(var(--st) + 92px);transform:translateX(-50%) scale(.6);opacity:0;z-index:7;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;pointer-events:none;transition:opacity .2s,transform .25s;
  background:conic-gradient(var(--gold) calc(var(--p,1)*360deg),rgba(255,255,255,.12) 0);box-shadow:0 4px 12px rgba(0,0,0,.4)}

function buildSamurai(owner){ const fid=FACTIONS[factionFor(owner)]?factionFor(owner):'samurai'; return buildFaction(owner,fid); }
const DS=THREE.DoubleSide;
const sph=(r,w=16,h=12)=>new THREE.SphereGeometry(r,w,h);
const half=(r)=>new THREE.SphereGeometry(r,18,8,0,Math.PI*2,0,Math.PI/2);
const cyl=(a,b,h,s=14,open=false)=>new THREE.CylinderGeometry(a,b,h,s,1,open);
const box=(x,y,z)=>new THREE.BoxGeometry(x,y,z);
const cap=(r,l)=>new THREE.CapsuleGeometry(r,l,4,10);

/* humanoid skeleton: hips → legs(knees) · chest → arms(elbows→hands) · neck → head */
function humanoid(o){
  const L=o.leg||1, A=o.arm||1, W=o.wide||1;
  const root=new THREE.Group(), body=new THREE.Group(); root.add(body);
  const hipY=.4*L;
  const hips=new THREE.Group(); hips.position.y=hipY; body.add(hips);
  const U={root,body,hips};
  // legs
  for(const s of [-1,1]){
    const leg=new THREE.Group(); leg.position.set(s*.075*W,0,0); hips.add(leg);
    const knee=new THREE.Group(); knee.position.y=-.2*L; leg.add(knee);
    if(o.thigh) mesh(cap(o.thighR||.047,.13*L),o.thigh,0,-.1*L,0,leg);
    if(o.shin) mesh(cap(o.shinR||.041,.12*L),o.shin,0,-.09*L,0,knee);
    if(o.foot) mesh(box(.075,.045,.14),o.foot,0,-.18*L,.03,knee);
    U[s<0?'legL':'legR']=leg; U[s<0?'kneeL':'kneeR']=knee;
  }
  if(o.pelvis) { const pv=mesh(sph(.11*W,14,10),o.pelvis,0,.0,0,hips); pv.scale.set(1,.65,.8); }
  // torso
  const chest=new THREE.Group(); chest.position.y=0; hips.add(chest); U.chest=chest;
  if(o.belly) mesh(cyl(.12*W,.115*W,.14,14),o.belly,0,.08,0,chest);
  if(o.torso) { const t=mesh(cyl(.165*W,.125*W,.2,14),o.torso,0,.22,0,chest); }
  const shY=.3;
  // arms
  for(const s of [-1,1]){
    const arm=new THREE.Group(); arm.position.set(s*.2*W,shY,0); chest.add(arm);
    const elbow=new THREE.Group(); elbow.position.y=-.17*A; arm.add(elbow);
    const hand=new THREE.Group(); hand.position.y=-.16*A; elbow.add(hand);
    if(o.upper) mesh(cap(o.upperR||.04,.1*A),o.upper,0,-.085*A,0,arm);
    if(o.fore) mesh(cap(o.foreR||.035,.1*A),o.fore,0,-.075*A,0,elbow);
    if(o.hand) mesh(sph(.043,10,8),o.hand,0,0,0,hand);
    elbow.rotation.x=-.25;
    U[s<0?'armL':'armR']=arm; U[s<0?'elbowL':'elbowR']=elbow; U[s<0?'handL':'handR']=hand;
  }
  if(o.neck) mesh(cyl(.04,.045,.08,10),o.neck,0,.35,0,chest);
  const head=new THREE.Group(); head.position.y=.46; chest.add(head); U.head=head;
  const kat=new THREE.Group(); kat.rotation.x=1.15; U.handR.add(kat); U.kat=kat;
  const banner=new THREE.Group(); chest.add(banner); U.banner=banner;
  return U;
}
function finishRig(U,scale=1.08){
  U.root.scale.setScalar(scale);
  const icon=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthTest:false,depthWrite:false}));
  icon.raycast=()=>{}; icon.renderOrder=20; icon.position.y=1.3; icon.scale.setScalar(.5); icon.visible=false; U.root.add(icon);
  const fear=new THREE.Sprite(new THREE.SpriteMaterial({map:fearTex(),transparent:true,depthTest:false,depthWrite:false}));
  fear.raycast=()=>{}; fear.renderOrder=21; fear.position.set(.32,1.05,0); fear.scale.setScalar(.44); fear.visible=false; U.root.add(fear);
  const mats=new Set(); U.root.traverse(o=>{ if(o.material&&!o.isSprite) mats.add(o.material); });
  return Object.assign(U,{icon,fear,mats:[...mats]});
}
function buildFaction(owner,fid){ const U=FACTIONS[fid].build(teamColors(owner)); return finishRig(U); }

function safeRect(){
  const h=innerHeight; let top=0,bot=h;
  const m=$('msg').getBoundingClientRect(); top=m.bottom+4;
  const bs=[...$('controls').children]; if(bs.length){ bot=Math.min(...bs.map(b=>b.getBoundingClientRect().top))-6; }
  if(innerWidth>innerHeight && innerHeight<=540) bot=h-6; // landscape phone: controls sit in a corner
  return {top:Math.min(top,h*.45), bot:Math.max(bot,h*.55)};
}
const fitPts=[]; for(const x of [-3.95,3.95]) for(const y of [-.45,1.25]) for(const z of [-3.45,3.45]) fitPts.push(new THREE.Vector3(x,y,z));
function boundsAt(pos,tgt){
  camera.position.copy(pos); camera.lookAt(tgt); camera.updateMatrixWorld();
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; const v=new THREE.Vector3();
  for(const p of fitPts){ v.copy(p).project(camera); x0=Math.min(x0,v.x);x1=Math.max(x1,v.x);y0=Math.min(y0,v.y);y1=Math.max(y1,v.y); }
  return {x0,x1,y0,y1};
}
function fitCamera(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  const portrait=w<h; camera.fov= portrait?54:36; camera.updateProjectionMatrix();
  const dir=new THREE.Vector3(0, portrait?.86:1.02, (typeof viewer!=='undefined'&&viewer==='ai')?-1:1).normalize();
  const sr=safeRect(); const yt=1-2*sr.top/h, yb=1-2*sr.bot/h, xm=.97;
  camera.clearViewOffset();
  const tgt=new THREE.Vector3(0,.3,0); let lo=3,hi=80;
  for(let k=0;k<26;k++){ const mid=(lo+hi)/2; const bb=boundsAt(tgt.clone().addScaledVector(dir,mid),tgt);
    const ok=bb.x0>=-xm&&bb.x1<=xm&&(bb.y1-bb.y0)<=(yt-yb); if(ok) hi=mid; else lo=mid; }
  const d=hi; const bb=boundsAt(tgt.clone().addScaledVector(dir,d),tgt);
  const delta=(yt+yb)/2-(bb.y0+bb.y1)/2;
  camera.setViewOffset(w,h,0,delta*h/2,w,h);
  cam.defTgt.copy(tgt); cam.defPos.copy(tgt).addScaledVector(dir,d);
  if(!busyCam){ cam.pos.copy(cam.defPos); cam.tgt.copy(cam.defTgt); }
}

function loop(){
  const SP=window.__speed||1; const rdt=Math.min(clock.getDelta(),.05)*SP, dt=rdt*timeScale; time+=dt;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(tw.e(k)); if(k>=1){ tweens.splice(i,1); tw.res(); } }
  // idle anims
  for(const p of pieces){ if(!p.alive||!p.o) continue; const o=p.o;
    o.banner.rotation.y=Math.sin(time*2.6+p.id)*.3;
    if(!p.anim){ o.body.position.y=Math.sin(time*2.2+p.id*1.3)*.008; o.head.rotation.y=Math.sin(time*.7+p.id)*.12; o.body.position.x=p.scared?Math.sin(time*47+p.id)*.035:0; o.fear.visible=!!p.scared; if(p.scared){ o.fear.position.y=1.02+Math.abs(Math.sin(time*4+p.id))*.08; }
      o.root.position.y = (selected===p||swapSel===p) ? Math.abs(Math.sin(time*5.5))*.13 : 0; } }
  if(selRing.visible){ const s=1+Math.sin(time*6)*.06; selRing.scale.set(s,s,s); }
  for(const row of tiles) for(const t of row){ if(t.userData.ring.visible){ t.userData.ring.material.opacity=.6+Math.sin(time*7)*.35; } if(t.userData.dot.visible){ const s=1+Math.sin(time*5)*.15; t.userData.dot.scale.set(s,s,s);} }
  // petals
  for(let i=0;i<PETALS;i++){ const d=petalData[i]; d.y-=d.vy*rdt*petalSpeed; d.x+=Math.sin(time*.8+d.ph)*rdt*.5+rdt*.25*petalSpeed; if(d.y<-.3){ d.y=8+Math.random()*2; d.x=(Math.random()-.5)*22; }
    dummy.position.set(d.x,d.y,d.z); dummy.rotation.set(time*d.rs+d.ph,time*d.rs*.7,d.ph); dummy.updateMatrix(); petals.setMatrixAt(i,dummy.matrix); }
  petals.instanceMatrix.needsUpdate=true;
  // sparks
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.t+=dt; s.v.y-=6*dt; s.m.position.addScaledVector(s.v,dt); s.m.material.opacity=1-s.t/s.life; if(s.t>=s.life){ scene.remove(s.m); s.m.material.dispose(); sparks.splice(i,1);} }
  if(boardAnim) boardAnim(time);
  flash.intensity*=Math.pow(.02,rdt);
  lanternLights.forEach((l,i)=>l.intensity=(3.2+Math.sin(time*9+i*2)*.25+Math.sin(time*23+i)*.15)*lanternMul);
  for(let i=inks.length-1;i>=0;i--){ const k=inks[i]; k.t+=rdt; if(k.t>7){ const a=Math.max(0,1-(k.t-7)/2); k.g.children.forEach(m=>m.material.opacity=.85*a); if(a<=0){ scene.remove(k.g); inks.splice(i,1); } } }
  // camera
  if(cam.orbit){ const a=time*.25, r=Math.hypot(cam.defPos.x,cam.defPos.z-cam.defTgt.z); cam.pos.set(Math.sin(a)*r, cam.defPos.y, cam.defTgt.z+Math.cos(a)*r); }
  camera.position.copy(cam.pos);
  if(shake>0){ camera.position.x+=(Math.random()-.5)*shake; camera.position.y+=(Math.random()-.5)*shake; shake*=Math.pow(.004,rdt); if(shake<.002) shake=0; }
  camera.lookAt(cam.tgt);
  renderer.render(scene,camera);
}

function updateIcon(p,pop){

    o.icon.material.map=iconTex(type,p.owner,mark); o.icon.material.needsUpdate=true;
    const changed=!!o.icon.userData.key || pop; o.icon.userData.key=key; o.icon.visible=true;

function randomSetupFor(owner,traps=1){
  const mine=pieces.filter(p=>p.owner===owner); mine.forEach(p=>p.type='?');
  const backR=owner==='me'?5:0, frontR=owner==='me'?4:1;
  const back=mine.filter(p=>p.r===backR); const f=rnd(back); f.type='flag';
  for(let k=0;k<traps;k++){
    const near=mine.filter(p=>p.type==='?'&&Math.abs(p.r-f.r)+Math.abs(p.c-f.c)===1);
    const any=mine.filter(p=>p.type==='?');
    (Math.random()<.7&&near.length?rnd(near):rnd(any)).type='trap';
  }
  const b=bag(mine.filter(p=>p.type==='?').length); mine.forEach(p=>{ if(p.type==='?') p.type=b.pop(); });
}

const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const nb=(r,c)=>DIRS.map(([a,b])=>[r+a,c+b]).filter(([a,b])=>a>=0&&a<ROWS&&b>=0&&b<COLS);
function legal(p){ if(!p.alive||!isFighter(p.type)) return []; const out=[];
  for(const [dr,dc] of DIRS){ const r=p.r+dr,c=p.c+dc; if(r<0||r>=ROWS||c<0||c>=COLS||isBlocked(r,c)) continue; const t=board[r][c]; if(t&&t.owner===p.owner) continue; out.push([r,c]); } return out; }

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downAt=null;
canvas.addEventListener('pointerdown',e=>{ downAt={x:e.clientX,y:e.clientY}; ac(); });
canvas.addEventListener('pointerup',e=>{ if(!downAt) return; const d=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y); downAt=null; if(d>28) return; pick(e.clientX,e.clientY); });
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), _gv=new THREE.Vector3();
function toScreen(v){ const p=v.clone().project(camera); return {x:(p.x+1)/2*innerWidth, y:(1-p.y)/2*innerHeight}; }
function cellPx(){ const a=toScreen(cellPos(2,3)), b=toScreen(cellPos(2,4)); return Math.max(30,Math.hypot(a.x-b.x,a.y-b.y)); }
function groundCell(){ if(!ray.ray.intersectPlane(groundPlane,_gv)) return null; const r=Math.round(_gv.z+2.5), c=Math.round(_gv.x+3); return (r>=0&&r<ROWS&&c>=0&&c<COLS)?[r,c]:null; }
function pick(x,y){
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  let cands=[];
  if(phase==='play'){
    if(turn!==viewer||ctrl(turn)!=='local') return;
    pieces.forEach(p=>{ if(p.alive&&p.owner===viewer) cands.push([p.r,p.c]); });
    if(selected) legal(selected).forEach(t=>cands.push(t));
  } else if(phase.startsWith('setup')){
    pieces.forEach(p=>{ if(p.alive&&p.owner===viewer) cands.push([p.r,p.c]); });
  } else return;
  const cp=cellPx(), g=groundCell();
  let hitCell=null;
  const objs=[]; pieces.forEach(p=>{ if(p.alive) objs.push(p.o.root); });
  for(const h of ray.intersectObjects(objs,true)){ const pid=h.object.userData.pid; if(pid){ const p=pieces.find(q=>q.id===pid); if(p&&p.alive){ hitCell=[p.r,p.c]; break; } } }
  let best=null, bs=1e9;
  for(const [r,c] of cands){
    const occ=board[r][c]; const pt=cellPos(r,c); pt.y= occ? .42 : .02;
    const sc=toScreen(pt); let d=Math.hypot(sc.x-x,sc.y-y);
    if(g&&g[0]===r&&g[1]===c) d-=cp*.45;
    if(hitCell&&hitCell[0]===r&&hitCell[1]===c) d-=cp*.3;
    if(selected&&!(occ&&occ.owner===viewer)) d-=cp*.15;
    if(d<bs){ bs=d; best=[r,c]; }
  }
  if(best && bs<cp*1.0) onCell(...best);
}

/* ---------- AI (three levels) ---------- */
const known=n=>n&&n.owner==='me'&&n.alive&&n.revealed&&isFighter(n.type);
const threat=(r,c,p)=>nb(r,c).some(([a,b])=>{const n=board[a][b];return known(n)&&beats(n.type,p.type);});
const prey=(r,c,p)=>nb(r,c).some(([a,b])=>{const n=board[a][b];return known(n)&&beats(p.type,n.type);});
const dist=(a,b,c,d)=>Math.abs(a-c)+Math.abs(b-d);
function aiTurn(){
  const D=diff; const flag=pieces.find(p=>p.owner==='ai'&&p.type==='flag');
  const intruders=flag?pieces.filter(q=>q.alive&&q.owner==='me'&&isFighter(q.type)&&dist(q.r,q.c,flag.r,flag.c)<=2):[];
  const hunt=pieces.filter(q=>q.alive&&q.owner==='me'&&!q.moved&&!q.revealed&&q.r===5);
  let best=null,bs=-1e9;
  for(const p of pieces){ if(p.owner!=='ai'||!p.alive) continue; const th=isFighter(p.type)&&threat(p.r,p.c,p);
    for(const [r,c] of legal(p)){ const t=board[r][c];
      let s;
      if(D==='easy'||D==='easy2'){
        s=Math.random()*(D==='easy'?40:24)+(r-p.r)*4;
        if(t){ if(t.revealed){ if(t.type==='trap') s-=80; else if(beats(p.type,t.type)) s+=30; else if(beats(t.type,p.type)) s-=(D==='easy'?10:30); } else s+=8; }
      } else {
        s=Math.random()*(D==='hard'?4:9);
        if(t){ if(t.revealed){ if(t.type==='trap') s-=500; else if(beats(p.type,t.type)) s+=130; else if(beats(t.type,p.type)) s-=95; else s+=12; }
               else { s+=34+r*7; if(p.revealed) s-=6;
                 if(D==='hard'){ if(!t.moved&&t.r===5) s+=26; if(!t.moved) s+=6; if(flag&&dist(t.r,t.c,flag.r,flag.c)<=2) s+=55; } } }
        else { s+=(r-p.r)*11; if(threat(r,c,p)) s-=65; if(prey(r,c,p)) s+=22; if(th&&!threat(r,c,p)) s+=45;
               if(flag&&dist(p.r,p.c,flag.r,flag.c)===1&&!th) s-=10;
               if(D==='hard'){
                 if(p.revealed){ const cnt=nb(r,c).filter(([a,b])=>{const n=board[a][b];return n&&n.owner==='me'&&n.alive&&!n.revealed;}).length; s-=14*cnt; }
                 for(const q of intruders){ if(dist(r,c,q.r,q.c)<dist(p.r,p.c,q.r,q.c)) s+= (beats(p.type,q.type)?26:10); }
                 if(hunt.length){ const dNow=Math.min(...hunt.map(q=>dist(p.r,p.c,q.r,q.c))), dNew=Math.min(...hunt.map(q=>dist(r,c,q.r,q.c))); if(dNew<dNow) s+=6; }
               } }
      }
      if(s>bs){bs=s;best={p,r,c};} } }
  if(!best) return endGame('me');
  doMove(best.p,best.r,best.c);
}

/* ---------- end ---------- */
function endGame(w){
  if(phase==='over') return;
  phase='over'; selected=null; stopTimer();
  if(mode!=='online') pieces.forEach(p=>p.revealed=true);
  else net.fin();
  pieces.forEach(p=>p.o.icon.userData.key=''); updateAll();
  const localWin = mode==='hotseat'? true : (w===viewer);
  localWin?sfx.win():sfx.lose(); if(localWin) setTimeout(sfx.gong,500);
  const title = mode==='hotseat' ? `🏆 ${nameOf(w)} ניצח!` : (localWin?'🏆 ניצחון!':'הפסד…');
  bannerShow(title, localWin?'הדגל נכבש':''); setMsg(mode==='hotseat'?`<b>${nameOf(w)} ניצח!</b>`:(localWin?'<b>ניצחון!</b>':'הפסדת הפעם'));
  cam.orbit=true;
  if(localWin) for(let i=0;i<6;i++) setTimeout(()=>burst(new THREE.Vector3((Math.random()-.5)*6,1.5+Math.random(),(Math.random()-.5)*4),[0xffd36a,0xff8ab0,0x8ab8ff][i%3],30,3.5,1.4),i*220);
  // stats & stars
  const st=save.stats; const prevStars=totalStars(); let starsWon=0;
  const prevF=FACTION_ORDER.filter(factionUnlocked), prevB=Object.keys(BOARDS).filter(boardUnlocked), prevT=Object.keys(THEMES).filter(themeUnlocked);
  if(mode==='hotseat') st.hotseat++;
  else { st.games++; if(localWin){ st.wins++; st.streak++; st.best=Math.max(st.best,st.streak); if(!st.fastest||myMoves<st.fastest) st.fastest=myMoves; } else { st.losses++; st.streak=0; } }
  if(mode==='online'){ st.online++; if(localWin) st.onlineWins++; }
  if(mode==='campaign'&&localWin){ const left=pieces.filter(p=>p.alive&&p.owner==='me'&&isFighter(p.type)).length; starsWon=left>=8?3:left>=4?2:1; save.stars[level]=Math.max(save.stars[level]||0,starsWon); }
  persist();
  const newSkins=SKINS.filter(s=>s.need>prevStars&&s.need<=totalStars());
  const newF=FACTION_ORDER.filter(f=>factionUnlocked(f)&&!prevF.includes(f)), newB=Object.keys(BOARDS).filter(b=>boardUnlocked(b)&&!prevB.includes(b)), newT=Object.keys(THEMES).filter(t=>themeUnlocked(t)&&!prevT.includes(t));
  setControls([{t:'תפריט',ghost:true,f:()=>{ bannerHide(); toMenu(); }}]);
  setTimeout(()=>{ bannerHide();
    const stars = mode==='campaign'&&localWin ? `<p class="center stars">${'⭐'.repeat(starsWon)}${'☆'.repeat(3-starsWon)}</p>` : '';
    let unlock = newSkins.length ? `<p class="center unlock">🎨 סקין חדש: <b>${newSkins.map(s=>s.name).join(', ')}</b></p>` : '';
    if(newF.length) unlock = `<div class="unl"><span>${FACTIONS[newF[0]].emoji}</span><div><small>צבא חדש נפתח!</small><b>${FACTIONS[newF[0]].name}</b></div></div>` + unlock;
    if(newB.length||newT.length) unlock += `<p class="center unlock">🗺️ ${[...newB.map(b=>'לוח: '+BOARDS[b].name),...newT.map(t=>'זירה: '+THEMES[t].name)].join(' · ')}</p>`;
    if(newF.length) setTimeout(()=>{ sfx.gong(); for(let i=0;i<8;i++) setTimeout(()=>burst(new THREE.Vector3((Math.random()-.5)*6,1.6+Math.random(),(Math.random()-.5)*4),[0xffd36a,0xff8ab0,0x8ab8ff,0x8affc0][i%4],34,4,1.5),i*160); },200);
    const btns=[];
    if(mode==='campaign'&&localWin&&level<LEVELS.length) btns.push(`<button class="btn" id="eNext">לשלב הבא ➜</button>`);
    if(mode==='online') btns.push(`<button class="btn" id="eRe">משחק חוזר</button>`);
    else btns.push(`<button class="btn ${mode==='campaign'&&localWin&&level<LEVELS.length?'ghost':''}" id="eAgain">שחק שוב</button>`);
    if(newF.length) btns.unshift(`<button class="btn" id="eTry">${FACTIONS[newF[0]].emoji} שחק איתם!</button>`);
    btns.push(`<button class="btn ghost" id="eLook">הצץ בלוח</button>`,`<button class="btn ghost" id="eMenu">תפריט</button>`);
    showCard(`<p class="big">${localWin?'🏆':'🏯'}</p><h2 class="center">${mode==='hotseat'?nameOf(w)+' ניצח!':(localWin?'ניצחת!':'הפסדת…')}</h2>${stars}
      <p class="center">${mode==='campaign'&&localWin?`ניצחת את ${LEVELS[level-1].name}!`:(localWin?'הסמוראים שלך כבשו את הדגל.':'נסה אסטרטגיה אחרת — אפשר לנצח!')}</p>${unlock}
      <div class="bottom">${btns.join('')}</div>`,()=>{
        const b=id=>$(id);
        if(b('eNext')) b('eNext').onclick=()=>{ closeCard(); playLevel(level+1); };
        if(b('eTry')) b('eTry').onclick=()=>{ save.faction=newF[0]; persist(); closeCard(); if(level<LEVELS.length) playLevel(level+1); else replay(); };
        if(b('eAgain')) b('eAgain').onclick=()=>{ closeCard(); replay(); };
        if(b('eRe')) b('eRe').onclick=()=>{ closeCard(); net.rematch(); };
        b('eLook').onclick=closeCard; b('eMenu').onclick=()=>{ closeCard(); toMenu(); };
      });
  },2300);
}

function play(o){ lastStart=o; startGame(o); }
function playLevel(n){ const L=LEVELS[n-1]; play({mode:'campaign',level:n,diff:L.diff,theme:L.theme,blitz:!!L.blitz,board:L.board,enemy:L.faction}); }

function refreshSkins(){ texCache.clear(); pieces.forEach(p=>{ if(p.owner!=='me') return; const T=teamColors('me'); const pos=p.o.root.position.clone(), rot=p.o.root.rotation.y; scene.remove(p.o.root); p.o=buildSamurai('me'); p.o.root.position.copy(pos); p.o.root.rotation.y=rot; p.o.root.traverse(o=>o.userData.pid=p.id); scene.add(p.o.root); }); updateAll(); }

const net={ inited:false, lobby:null, user:null, room:null, role:null, code:null, gameNo:0, first:'me', state:{}, opp:null, oppName:null, waiters:[], offLobby:null, offRoom:null, lostT:null, myName:null,
  async init(){
    if(this.inited) return this.lobby; this.inited=true;
    const use=n=>{ try{ return (window.claude&&window.claude.use)?Promise.race([window.claude.use(n),sleep(11000).then(()=>null)]):Promise.resolve(null); }catch(e){ return Promise.resolve(null); } };
    [this.lobby,this.user]=await Promise.all([use('room'),use('user')]);
    return this.lobby;
  },
  async names(ids){ const out={}; try{ if(this.user&&this.user.profiles&&ids.length){ const ps=await this.user.profiles(ids); for(const id of ids) out[id]=(ps&&ps[id]&&ps[id].name)||''; } }catch(e){} return out; },
  set(patch){ Object.assign(this.state,patch); if(this.room) this.room.presence(patch).catch(()=>{}); },
  async open(code,role){
    this.role=role; this.code=code; this.gameNo=0; this.opp=null; this.oppName=null; this.waiters=[];
    this.room=await this.lobby.join('g-'+code);
    this.state={}; this.set({role, g:0, ready:false, moves:[], rv:{}, fin:null, stuck:null, rematch:null, at:Date.now(), first: role==='host'?(Math.random()<.5?'me':'ai'):null, blitz: role==='host'?!!save.blitz:null});
    this.offRoom=this.room.onPeers(()=>this.onPeers());
  },
  onPeers(){
    if(!this.room) return;
    const ps=this.room.peers().filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.role);
    const want=this.role==='host'?'guest':'host';
    const cands=ps.filter(p=>p.presence.role===want).sort((a,b)=>(a.presence.at||0)-(b.presence.at||0));
    if(this.role==='guest'){ const rivals=ps.filter(p=>p.presence.role==='guest'&&(p.presence.at||0)<this.state.at); if(rivals.length&&!this.opp){ this.leave(); onlineMenu('החדר הזה כבר מלא — נסה קוד אחר'); return; } }
    const o=cands[0]||null;
    if(o&&this.opp&&o.peer!==this.opp.peer&&phase!=='menu'&&this.started){ /* a different opponent appeared mid-game: ignore */ return; }
    const had=!!this.opp; this.opp=o;
    if(o&&o.by&&!this.oppName){ this.names([o.by]).then(n=>{ this.oppName=n[o.by]||null; updateHUD(); }); }
    if(o){ clearTimeout(this.lostT); this.lostT=null; if(this.lostShown){ this.lostShown=false; bannerHide(); } }
    if(!o&&had&&this.started&&phase!=='over'&&!this.lostT){ bannerShow('📡','היריב התנתק… ממתין שיחזור'); this.lostShown=true; this.lostT=setTimeout(()=>{ if(!this.opp) showCard(`<h2 class="center">היריב עזב</h2><p class="center">החיבור ליריב אבד.</p><div class="bottom"><button class="btn" id="lm">לתפריט</button></div>`,()=>{ $('lm').onclick=()=>{ closeCard(); toMenu(); }; }); },40000); }
    if(o&&!this.started){ this.begin(); }
    this.pump();
  },
  begin(){
    const host=this.role==='host'?this.state:this.opp.presence;
    if(this.role==='guest'&&host.g!==this.gameNo) return;
    this.started=true; this.first=host.first||'me';
    try{ this.lobby.presence({open:null}).catch(()=>{}); }catch(e){}
    startGame({mode:'online',viewer:this.role==='host'?'me':'ai',blitz:!!host.blitz,theme:'sunset'});
    sfx.gong();
  },
  pump(){
    const o=this.opp&&this.opp.presence; if(!o||mode!=='online') return;
    // rematch
    if(phase==='over'&&this.state.rematch===this.gameNo+1&&o.rematch===this.gameNo+1){ this.newRound(); return; }
    if(o.g!==this.gameNo) return;
    for(let i=this.waiters.length-1;i>=0;i--){ const w=this.waiters[i]; const v=o.rv&&o.rv[w.key]; if(v){ this.waiters.splice(i,1); w.res(v); } }
    if(phase==='waiting'&&this.state.ready&&o.ready){ const host=this.role==='host'?this.state:o; startBattle(host.first||'me'); return; }
    if(phase==='play'&&o.stuck===this.gameNo){ endGame(viewer); return; }
    if(phase==='play'&&!busy&&ctrl(turn)==='remote'){ const m=(o.moves||[]).find(m=>m.n===moveCount); if(m){ const p=board[m.f[0]]&&board[m.f[0]][m.f[1]]; if(p&&p.owner===turn) doMove(p,m.t[0],m.t[1]); } }
    if(phase==='over'&&o.fin&&o.fin.g===this.gameNo&&!this.finApplied){ this.finApplied=true; for(const [r,c,t] of o.fin.t){ const p=board[r][c]; if(p&&p.owner!==viewer){ p.type=t; p.revealed=true; } } pieces.forEach(p=>p.o.icon.userData.key=''); updateAll(); }
  },
  sendMove(n,f,t){ const moves=(this.state.moves||[]).filter(m=>m.n>n-30).concat([{n,f,t}]); this.set({moves}); },
  reveal(key,type){ const rv=Object.assign({},this.state.rv); rv[key]=type; const ks=Object.keys(rv); if(ks.length>30) delete rv[ks[0]]; this.set({rv}); },
  awaitReveal(key){ return new Promise(res=>{ this.waiters.push({key,res}); this.pump(); }); },
  fin(){ this.finApplied=false; const t=pieces.filter(p=>p.alive&&p.owner===viewer).map(p=>[p.r,p.c,p.type]); this.set({fin:{g:this.gameNo,t}}); setTimeout(()=>this.pump(),50); },
  rematch(){ this.set({rematch:this.gameNo+1}); setMsg('ממתין שהיריב יסכים למשחק חוזר…'); toast('ממתין ליריב…',1200,true); this.pump(); },
  newRound(){
    this.gameNo++; this.finApplied=false;
    const prevFirst=this.role==='host'?this.state.first:(this.opp.presence.first||'me');
    this.set({g:this.gameNo, ready:false, moves:[], rv:{}, fin:null, stuck:null, first: this.role==='host'?other(prevFirst):null});
    this.started=false; setTimeout(()=>{ if(this.role==='host'||(this.opp&&this.opp.presence.g===this.gameNo)) this.begin(); else this.waitHost(); },120);
  },
  waitHost(){ const t=setInterval(()=>{ if(!this.room){ clearInterval(t); return; } if(this.opp&&this.opp.presence.g===this.gameNo){ clearInterval(t); this.begin(); } },200); },
  leave(){ try{ this.offRoom&&this.offRoom(); }catch(e){} try{ this.room&&this.room.leave(); }catch(e){} try{ this.lobby&&this.lobby.presence({open:null}); }catch(e){}
    clearTimeout(this.lostT); this.room=null; this.opp=null; this.started=false; this.waiters=[]; this.lostShown=false; }
};

    <div class="sect"><h3>משחק חדש</h3><div class="chips" id="cBlitz">${chip('0','קלאסי',!save.blitz)}${chip('1','⏱ בליץ',save.blitz)}</div></div>
    <div class="sect"><h3>משחקים פתוחים</h3><div id="oList" class="olist"></div></div>

    <button class="btn ghost back" id="bk">חזרה</button>`,(m)=>{
      bindChips(m,'#cBlitz',v=>{ save.blitz=v==='1'; persist(); m.querySelectorAll('#cBlitz .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v)); });
      $('oNew').onclick=()=>createOnline(); $('oJoin').onclick=()=>{ const c=($('oCode').value||'').replace(/[^0-9]/g,''); if(c.length!==4){ toast('הקלד קוד בן 4 ספרות',1000); return; } joinCode(c); };

async function createOnline(){

async function joinCode(code){
  showMenu(`<h2 class="msub">🌐 מצטרף למשחק ${code}…</h2><div class="spin"></div><button class="btn ghost back" id="bk">ביטול</button>`,()=>{ $('bk').onclick=()=>{ net.leave(); onlineMenu(); }; });
  try{ await net.open(code,'guest'); }catch(e){ onlineMenu('לא הצלחתי להצטרף — בדוק את הקוד'); return; }
  setTimeout(()=>{ if(net.room&&!net.opp&&!net.started){ net.leave(); onlineMenu(`לא נמצא משחק עם הקוד ${code}`); } },9000);
}
