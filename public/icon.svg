<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a8e"/><stop offset="1" stop-color="#0a0720"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".55" stop-color="#ffc23d"/><stop offset="1" stop-color="#e88a00"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6f6ff"/><stop offset=".55" stop-color="#20d9ff"/><stop offset="1" stop-color="#0a8fd0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#8f7dff" stop-opacity=".55"/><stop offset="1" stop-color="#8f7dff" stop-opacity="0"/></radialGradient>
    <g id="eyes"><circle r="17" fill="#130d26"/><circle r="14" fill="#fff"/><circle r="8" fill="#130d26"/><circle cx="3" cy="-3" r="2.6" fill="#fff"/></g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- link arc between the twins -->
  <path d="M150 150 C 150 60, 362 60, 362 150" stroke="#20d9ff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>
  <circle cx="256" cy="84" r="26" fill="#0b0820" stroke="#20d9ff" stroke-width="6"/>
  <text x="256" y="96" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">⇄</text>
  <!-- twin left -->
  <rect x="82" y="140" width="136" height="112" rx="30" fill="url(#c)"/>
  <rect x="94" y="148" width="112" height="16" rx="8" fill="#fff" opacity=".45"/>
  <use href="#eyes" x="130" y="200"/><use href="#eyes" x="172" y="200"/>
  <!-- twin right -->
  <rect x="294" y="140" width="136" height="112" rx="30" fill="url(#c)"/>
  <rect x="306" y="148" width="112" height="16" rx="8" fill="#fff" opacity=".45"/>
  <use href="#eyes" x="336" y="200"/><use href="#eyes" x="378" y="200"/>
  <!-- gold hero -->
  <rect x="96" y="292" width="296" height="124" rx="34" fill="url(#g)"/>
  <rect x="112" y="300" width="264" height="18" rx="9" fill="#fff" opacity=".5"/>
  <use href="#eyes" x="258" y="362"/><use href="#eyes" x="304" y="362"/>
  <!-- exit -->
  <rect x="418" y="284" width="18" height="140" rx="9" fill="#ffd36b"/>
  <rect x="436" y="300" width="60" height="108" rx="10" fill="#ffe08a" opacity=".55"/>
</svg>
