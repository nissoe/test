<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>האי של ליאם</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="האי של ליאם">
<meta name="theme-color" content="#3cbcff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Varela+Round&display=swap">
<style>
/* Layout: one fixed 1280×720 "toy box" stage, scaled to fit and rotated to landscape on portrait screens.
   Single bright world by design (a kids' island), so no dark variant: every color is set explicitly. */
:root{
  --sky:#8fd6ff; --sky-2:#e6f7ff;
  --grass:#74c95a; --grass-d:#3e9b35;
  --sand:#ffe39a; --sea:#2ea7ea; --sea-d:#1683c4;
  --sun:#ffc93c; --sun-d:#e9a400;
  --coral:#ff6b6b; --coral-d:#d94848;
  --grape:#8b5cf6; --grape-d:#6a3fd6;
  --mint:#2fd39a; --mint-d:#18a674;
  --ink:#2b2350; --ink-soft:#5d567f;
  --paper:#fffdf6; --paper-d:#e9e1cc;
  --font-display:'Rubik','Varela Round',system-ui,sans-serif;
  --font-body:'Varela Round','Rubik',system-ui,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
body{color:var(--ink);font-family:var(--font-body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#root{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--sky),var(--sky-2))}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:visible;direction:rtl}
.screen{position:absolute;inset:0;z-index:0}
/* each screen's background is painted far past the 16:9 stage, so phones with longer screens show no empty bands */
.screen::before{content:"";position:absolute;top:-700px;bottom:-700px;left:-1000px;right:-1000px;background:var(--sbg,#8fd6ff);z-index:-1;pointer-events:none}
.emo{font-family:var(--emoji);line-height:1}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--grape);outline-offset:4px}

/* toy buttons: chunky bottom edge like a plastic block */
.toy{border:none;border-radius:28px;background:var(--c,#fff);box-shadow:0 8px 0 var(--cd,var(--paper-d)),0 14px 26px rgba(43,35,80,.16);transition:transform .09s,box-shadow .09s;position:relative}
.toy:active,.toy.press{transform:translateY(6px);box-shadow:0 2px 0 var(--cd,var(--paper-d)),0 6px 12px rgba(43,35,80,.16)}
.round{width:84px;height:84px;border-radius:50%;font-size:42px;display:grid;place-items:center;padding:0}

/* speech bubble */
.bubble{position:absolute;background:#fff;border-radius:26px;padding:14px 22px;font:700 26px/1.25 var(--font-display);color:var(--ink);box-shadow:0 6px 0 var(--paper-d),0 10px 24px rgba(43,35,80,.15);max-width:420px;opacity:0;transform:scale(.85);transform-origin:var(--origin,left bottom);transition:opacity .25s,transform .25s;pointer-events:none;z-index:30}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;width:26px;height:26px;background:#fff;transform:rotate(45deg);left:var(--tail-x,40px);bottom:-10px;border-radius:4px}

/* Dudu */
.dudu{position:absolute;pointer-events:none}
.dudu svg{width:100%;height:100%;overflow:visible}
.dudu .d-body{animation:bob 2.6s ease-in-out infinite;transform-origin:100px 210px}
.dudu .d-eyes{animation:blink 4.5s infinite;transform-origin:100px 82px}
.dudu .d-arm{transform-origin:150px 158px;animation:wave 1.6s ease-in-out infinite}
.dudu.talk .d-head{animation:nod .35s ease-in-out infinite alternate;transform-origin:100px 140px}
.dudu.talk .d-mouth{transform:scaleY(1.8);transform-origin:100px 117px}
.dudu.dance .d-body{animation:dance .5s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes nod{to{transform:rotate(3deg) translateY(-2px)}}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-14px)}}

/* fx layer */
#fx{position:absolute;inset:0;pointer-events:none;z-index:90}
.spark{position:absolute;font-size:34px;font-family:var(--emoji)}

/* ---------- splash ---------- */
#scr-splash{--sbg:radial-gradient(circle 1100px at 50% 900px,#9af3ff 0,#3cbcff 420px,#4f63ff 1000px)}
#scr-map{--sbg:linear-gradient(#36b0ff 700px,#8fdcff 1060px,#d4f4ff 1255px,#4cc0f5 1262px,#1683c4 1420px)}
.sp-burst{position:absolute;left:-260px;top:-660px;width:1800px;height:1800px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.17) 0 9deg,transparent 9deg 18deg);animation:spin 60s linear infinite;-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
.sp-layer{position:absolute;inset:0;pointer-events:none}
.sp-layer > svg{position:absolute;left:-450px;top:0;width:2180px;height:720px}
.tw{position:absolute;color:#fff;font:900 26px/1 var(--font-display);animation:twinkle 2.2s ease-in-out infinite;text-shadow:0 0 12px #fff}
@keyframes twinkle{0%,100%{opacity:.15;scale:.5}50%{opacity:1;scale:1.15}}
.spb{position:absolute;top:740px;width:96px;height:150px;border:none;background:none;padding:0;pointer-events:auto;animation:spRise linear infinite}
.spb .in{position:absolute;inset:0;animation:spSway 3s ease-in-out infinite alternate}
.spb svg{width:100%;height:100%;overflow:visible}
.spb span{position:absolute;left:0;right:0;top:26px;text-align:center;font:900 46px/1 var(--font-display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.spb.popped .in{visibility:hidden}
@keyframes spRise{from{transform:translateY(0)}to{transform:translateY(-1000px)}}
@keyframes spSway{from{transform:rotate(-7deg) translateX(-10px)}to{transform:rotate(7deg) translateX(10px)}}
.peek{position:absolute;animation:peek 5s ease-in-out infinite}
@keyframes peek{0%,15%,85%,100%{transform:translateY(80px)}30%,70%{transform:translateY(0)}45%{transform:translateY(-8px) rotate(-6deg)}55%{transform:translateY(-4px) rotate(5deg)}}
.title-big{position:absolute;left:0;right:0;top:54px;text-align:center;font:900 128px/1 var(--font-display);-webkit-text-stroke:14px #fff;paint-order:stroke fill;filter:drop-shadow(0 9px 0 rgba(43,35,80,.35)) drop-shadow(0 20px 24px rgba(43,35,80,.25));letter-spacing:2px;z-index:5}
.title-big span{display:inline-block;animation:hop 1.9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-22px) rotate(-5deg)}36%{transform:translateY(0) rotate(0)}}
.sp-sub{position:absolute;left:0;right:0;top:206px;text-align:center;font:800 32px var(--font-display);color:#fff;text-shadow:0 3px 0 rgba(43,35,80,.35);z-index:5}
.play-ring{position:absolute;left:520px;top:330px;width:240px;height:240px;border-radius:50%;background:conic-gradient(#ff5d8f,#ffb020,#ffe14d,#2fd39a,#3b9bff,#a06cff,#ff5d8f);animation:spin 3s linear infinite;box-shadow:0 0 50px rgba(255,255,255,.7);z-index:6}
.play-glow{position:absolute;left:490px;top:300px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 68%);animation:pulse 1.4s ease-in-out infinite;z-index:5;pointer-events:none}
#btnPlay{position:absolute;left:538px;top:348px;width:204px;height:204px;border-radius:50%;--c:#ff4f7b;--cd:#c92f58;font-size:100px;color:#fff;display:grid;place-items:center;padding:0;z-index:7;animation:pulse 1.4s ease-in-out infinite;text-shadow:0 5px 0 rgba(0,0,0,.18);overflow:hidden}
#btnPlay::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.splash-dudu{left:950px;top:370px;width:270px;height:300px;z-index:6;pointer-events:auto!important;cursor:pointer}
.splash-dudu .d-body{animation:dance .55s ease-in-out infinite alternate}
.splash-dudu.jump{animation:djump .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes djump{40%{transform:translateY(-90px) rotate(-10deg)}}
#spBubble{left:690px;top:320px;--tail-x:230px;z-index:8;max-width:300px}
.wipe{position:absolute;width:40px;height:40px;border-radius:50%;margin:-20px 0 0 -20px;background:radial-gradient(circle,#ffe14d 0 30%,#ff5d8f 31% 55%,#a06cff 56%);z-index:99;pointer-events:none}
.station.enter{animation:stIn .7s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes stIn{from{scale:0;rotate:-20deg}}
.map-sky{position:absolute;inset:0;background:linear-gradient(#36b0ff,#8fdcff 50%,#d4f4ff)}

/* ---------- map ---------- */
#world{position:absolute;inset:0;transition:filter 1.2s}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:12%;bottom:20%}
.cloud::after{width:40%;height:120%;right:14%;bottom:25%}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1600px)}}
.sun{position:absolute;left:60px;top:40px;width:120px;height:120px}
.sun .rays{position:absolute;inset:-34px;background:repeating-conic-gradient(var(--sun) 0 10deg,transparent 10deg 30deg);border-radius:50%;animation:spin 24s linear infinite;-webkit-mask:radial-gradient(circle,transparent 50%,#000 51%);mask:radial-gradient(circle,transparent 50%,#000 51%)}
.sun .core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,var(--sun) 60%,var(--sun-d));box-shadow:0 0 40px #ffe27a}
.sun .face{position:absolute;inset:0;display:grid;place-items:center;font:900 40px var(--font-display);color:var(--sun-d)}
@keyframes spin{to{transform:rotate(360deg)}}
.map-title{position:absolute;left:0;right:0;top:16px;text-align:center;font:900 66px/1 var(--font-display);color:#fff;-webkit-text-stroke:9px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(43,35,80,.3));pointer-events:none}
.map-title span{display:inline-block}
.station{position:absolute;width:196px;height:190px;border:none;background:none;padding:0;transform:translate(-50%,-50%)}
.station .plate{position:absolute;left:18px;top:20px;width:160px;height:130px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff 0,#fff8df 60%,#f1e3b8 100%);box-shadow:0 10px 0 #d6c48f,0 18px 26px rgba(43,35,80,.2);transition:transform .15s}
.station .icon{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:96px;font-family:var(--emoji);filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));animation:idle 3s ease-in-out infinite}
.station .chip{position:absolute;font:900 28px/1 var(--font-display);color:#fff;background:var(--c);border-radius:14px;padding:6px 10px;box-shadow:0 4px 0 var(--cd);top:6px;left:132px;transform:rotate(8deg)}
.station .label{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);white-space:nowrap;font:800 22px/1 var(--font-display);color:#fff;background:var(--c);padding:9px 16px;border-radius:18px;box-shadow:0 5px 0 var(--cd)}
.station:active .plate{transform:scale(.94)}
@keyframes idle{50%{transform:translateY(-8px) rotate(2deg)}}
.decor{position:absolute;font-family:var(--emoji);line-height:1;transform:translate(-50%,-50%);pointer-events:none}
.decor.new{animation:popin .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.decor.fly{animation:flutter 6s ease-in-out infinite}
@keyframes flutter{0%,100%{margin:0}25%{margin:-30px 0 0 60px}50%{margin:10px 0 0 120px}75%{margin:-20px 0 0 50px}}
.decor.across{animation:across 16s linear infinite}
@keyframes across{from{margin-left:-500px}to{margin-left:1300px}}
.decor.jump{animation:jumpfish 3.2s ease-in-out infinite}
@keyframes jumpfish{0%,60%,100%{margin-top:30px;opacity:0}70%{opacity:1}80%{margin-top:-70px}90%{margin-top:0;opacity:1}}
.decor.sail{animation:sail 18s ease-in-out infinite alternate}
@keyframes sail{from{margin-left:-160px}to{margin-left:160px}}
.decor.floaty{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{margin-top:-26px}}
.decor.hopper{animation:hopper 1.4s ease-in-out infinite}
@keyframes hopper{0%,100%{margin-top:0}50%{margin-top:-24px}}
.decor.sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{rotate:6deg}}
#rainbow{position:absolute;left:140px;top:110px;width:1000px;height:500px;opacity:0;transition:opacity 1.5s}
#rainbow.on{opacity:.85}
.corner-btn{position:absolute;z-index:20}
#btnAlbum{left:1160px;top:20px;width:100px;height:96px;--c:#fff;font-size:50px;display:grid;place-items:center;padding:0}
#btnAlbum .count{position:absolute;top:-10px;left:-10px;min-width:42px;height:42px;border-radius:21px;background:var(--coral);color:#fff;font:900 24px/42px var(--font-display);text-align:center;box-shadow:0 3px 0 var(--coral-d)}
.gear{left:18px;top:18px;width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.55);font-size:30px;display:grid;place-items:center;padding:0}
.gear svg{position:absolute;inset:-4px;width:72px;height:72px;transform:rotate(-90deg)}
.gear circle{fill:none;stroke:var(--grape);stroke-width:6;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201}
.gear.hold circle{transition:stroke-dashoffset 1.8s linear;stroke-dashoffset:0}

/* zone picker */
.overlay{position:absolute;top:-700px;bottom:-700px;left:-1000px;right:-1000px;background:rgba(43,35,80,.45);display:grid;place-items:center;z-index:50;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.zone-panel{position:relative;background:var(--paper);border-radius:44px;padding:36px 44px 44px;box-shadow:0 14px 0 var(--paper-d),0 30px 60px rgba(0,0,0,.25);animation:rise .35s cubic-bezier(.3,1.4,.5,1);min-width:620px}
@keyframes rise{from{transform:translateY(60px) scale(.9);opacity:0}}
.zone-title{text-align:center;font:900 48px var(--font-display);color:var(--zc,var(--grape));margin:0 0 26px}
.zone-cards{display:flex;gap:30px;justify-content:center}
.game-card{width:240px;height:250px;--c:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.game-card .big{font-size:110px;font-family:var(--emoji);line-height:1}
.game-card .name{font:800 25px/1.15 var(--font-display);text-align:center}
.close-x{position:absolute;top:-24px;right:-24px;width:72px;height:72px;font-size:34px;--c:var(--coral);--cd:var(--coral-d);color:#fff}

/* ---------- game chrome ---------- */
#scr-game{--sbg:var(--zbg,#e6f7ff)}
#scr-game::after{content:"";position:absolute;top:-700px;bottom:-700px;left:-1000px;right:-1000px;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.38) 3px,transparent 3.5px),radial-gradient(rgba(255,255,255,.22) 6px,transparent 6.5px);background-size:44px 44px,130px 130px;background-position:0 0,22px 60px;pointer-events:none}
.topbar{position:absolute;left:0;top:0;width:1280px;height:100px;z-index:20}
#btnHome{position:absolute;left:1180px;top:10px;--c:#fff}
#btnRepeat{position:absolute;left:1080px;top:10px;--c:#fff;font-size:38px}
#stars{position:absolute;left:440px;width:400px;top:22px;display:flex;justify-content:center;gap:12px;direction:ltr}
#stars i{width:48px;height:48px;font-style:normal;font-size:40px;display:grid;place-items:center;font-family:var(--emoji);filter:grayscale(1) opacity(.35);transition:filter .3s,transform .3s}
#stars i.on{filter:none;transform:scale(1.15)}
.mini-dudu{left:6px;top:0;width:96px;height:106px}
#scr-game .bubble{left:110px;top:16px;--tail-x:-8px;--origin:left center}
#scr-game .bubble::after{bottom:auto;top:22px;left:-9px}
#area{position:absolute;left:0;top:100px;width:1280px;height:620px}

/* shared game pieces */
.card{position:absolute;background:var(--paper);border-radius:36px;box-shadow:0 10px 0 var(--paper-d),0 18px 30px rgba(43,35,80,.14)}
.opt{position:absolute;width:150px;height:150px;--c:#fff;font:900 76px/1 var(--font-display);display:grid;place-items:center;padding:0;color:var(--ink)}
.opt.emo{font-size:84px}
.opt.dim{opacity:.4}
.opt.hint{animation:hintglow 1s ease-in-out infinite}
@keyframes hintglow{50%{box-shadow:0 8px 0 var(--mint-d),0 0 0 12px rgba(47,211,154,.55)}}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-14px 0}40%{translate:12px 0}60%{translate:-8px 0}80%{translate:5px 0}}
.boing{animation:boing .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{scale:1}40%{scale:1.3}100%{scale:1}}

/* trace */
.trace-paper{position:absolute;background:var(--paper);border-radius:40px;box-shadow:0 10px 0 var(--paper-d),0 18px 30px rgba(43,35,80,.14);background-image:linear-gradient(rgba(139,92,246,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(139,92,246,.07) 2px,transparent 2px);background-size:56px 56px;background-position:center}
.trace-paper svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.t-track{fill:none;stroke:#ece6ff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.t-dots{fill:none;stroke:#a79bdc;stroke-width:1.7;stroke-dasharray:.1 3.6;stroke-linecap:round;stroke-linejoin:round}
.t-prog{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.t-ink{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.35}
.t-start{animation:tpulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tpulse{50%{transform:scale(1.25)}}
.trace-paper.won .t-prog{animation:rainbowStroke 1.2s linear infinite}
@keyframes rainbowStroke{0%{stroke:#ff6b6b}25%{stroke:#ffc93c}50%{stroke:#2fd39a}75%{stroke:#3b82f6}100%{stroke:#ff6b6b}}
.word-card{left:930px;top:60px;width:310px;height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.word-card .pic{font-size:150px;font-family:var(--emoji);line-height:1}
.word-card .w{font:900 54px/1 var(--font-display)}
.word-card .w b{color:var(--coral)}
.word-card .dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:260px;font-size:44px;font-family:var(--emoji)}
.side-btn{position:absolute;left:60px;width:110px;height:110px;font-size:52px;display:grid;place-items:center;padding:0;--c:#fff}

/* letter hunt */
.lb{position:absolute;width:150px;height:150px;border-radius:50%;border:none;display:grid;place-items:center;font:900 84px/1 var(--font-display);color:#fff;background:radial-gradient(circle at 24% 20%,rgba(255,255,255,.6) 0 7%,transparent 8%),var(--c);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12),0 12px 24px rgba(43,35,80,.18);animation:float 3.4s ease-in-out infinite;text-shadow:0 4px 0 rgba(0,0,0,.18);padding:0}
@keyframes float{50%{translate:0 -16px}}
.hint-card{position:absolute;left:30px;top:20px;width:150px;height:150px;display:grid;place-items:center;font:900 90px var(--font-display);opacity:0;transition:opacity .3s}
.hint-card.on{opacity:1}

/* connect */
.cbox{position:absolute;border-radius:30px;background:#fff;box-shadow:0 8px 0 var(--paper-d),0 14px 24px rgba(43,35,80,.12);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;direction:ltr;transition:background .3s}
.cbox span{font-family:var(--emoji);line-height:1}
.cnum{position:absolute;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:900 60px/1 var(--font-display);box-shadow:0 8px 0 var(--cd),0 14px 24px rgba(43,35,80,.14);text-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .15s}
.cbox.sel,.cnum.sel{outline:6px solid var(--sun);outline-offset:4px}
.cbox.done{background:#eafff5}
.cnum.done{filter:saturate(.7)}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.anchor-dot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--ink);border:5px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* count */

/* differences + find */

/* ---------- landscape stage fit ---------- */
let M = {rot:false,s:1,offX:0,offY:0,tx:0,ty:0};
function fit(){
  const root = $('#root'); const vw = root.clientWidth, vh = root.clientHeight;
  const rot = vh > vw * 1.05;
  const EW = rot ? vh : vw, EH = rot ? vw : vh;
  const s = Math.min(EW/W, EH/H);
  const offX = (EW - W*s)/2, offY = (EH - H*s)/2;
  if(!rot){ M = {rot:false,s,offX,offY}; stage.style.transform = `matrix(${s},0,0,${s},${offX},${offY})`; }
  else if(dirEff() > 0){ const tx = vw - offY, ty = offX; M = {rot:1,s,tx,ty}; stage.style.transform = `matrix(0,${s},${-s},0,${tx},${ty})`; }
  else { const tx = offY, ty = vh - offX; M = {rot:-1,s,tx,ty}; stage.style.transform = `matrix(0,${-s},${s},0,${tx},${ty})`; }
}
function toStage(cx, cy){
  if(M.rot===1) return {x:(cy-M.ty)/M.s, y:(M.tx-cx)/M.s};
  if(M.rot===-1) return {x:(M.ty-cy)/M.s, y:(cx-M.tx)/M.s};
  return {x:(cx-M.offX)/M.s, y:(cy-M.offY)/M.s};
}
/* which way to turn the game when the phone is upright (rotation lock on) but held sideways */
let sensorDir = 1;
const dirEff = () => S.rotMode==='auto' ? sensorDir : (+S.rotMode || 1);
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let motionOn = false, candDir = 0, candT = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity; if(!a || a.x==null) return;
  // gravity in device axes (x to the right, y up the screen); Android reports the opposite sign of iOS
  const gx = IS_IOS ? a.x : -a.x, gy = IS_IOS ? a.y : -a.y;
  let d = 0;
  if(Math.abs(gx) > 5.5 && Math.abs(gx) > Math.abs(gy)*1.2) d = gx > 0 ? -1 : 1;
  if(!d){ candDir = 0; return; }
  if(d !== candDir){ candDir = d; candT = performance.now(); return; }
  if(d !== sensorDir && performance.now()-candT > 350){
    sensorDir = d;
    if(S.rotMode==='auto' && M.rot){ fit(); stage.animate([{opacity:0},{opacity:1}], {duration:280}); }
  }
}
function startMotion(){
  if(motionOn) return;
  motionOn = true; addEventListener('devicemotion', onMotion);
  // iPhone asks once for motion access; elsewhere events simply arrive
  try{ if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function') DeviceMotionEvent.requestPermission().catch(()=>{}); }catch(e){}
}

    if(!rq) return;
    const r = rq.call(de, {navigationUI:'hide'});
    if(r && r.then) r.then(lockLandscape).catch(()=>{}); else lockLandscape();

}

function tone(f, dur=.15, type='sine', vol=.18, when=0, f2=null){
  if(!S.sounds) return; const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);

  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}

function speakOne(t, lang){

/* ---------- parent's recorded voice: clips stored on this device, matched by the sentence text ---------- */
const REC = (()=>{
  let db = null, cur = null, el = null, lastErr = '', lastHow = '';
  const map = new Map(), bufs = new Map(), urls = new Map();
  const norm = (t, lang) => (lang||'he') + ':' + stripNiqqud(String(t)).replace(/[!?.,:;'"׳״…]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const open = () => new Promise(res=>{ try{ const r = indexedDB.open('liam-voice', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('rec'); r.onsuccess = ()=>{ db = r.result; res(true); }; r.onerror = ()=>res(false); }catch(e){ res(false); } });
  const ready = open();
  async function load(){
    if(!await ready) return;
    try{
      const req = db.transaction('rec').objectStore('rec').openCursor();
      req.onsuccess = ()=>{ const c = req.result; if(!c) return;
        const v = c.value; map.set(c.key, (v && v.b) ? new Blob([v.b], {type:v.t||'audio/mp4'}) : v); c.continue(); };
    }catch(e){}
  }
  // stored as raw bytes: Blobs in IndexedDB are unreliable on some iPhones
  async function put(key, blob){
    map.set(key, blob); bufs.delete(key); urls.delete(key);
    try{
      const data = await blob.arrayBuffer();
      if(!await ready) throw new Error('no db');
      await new Promise((res, rej)=>{ const tx = db.transaction('rec','readwrite'); tx.objectStore('rec').put({t:blob.type, b:data}, key); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error); });
    }catch(e){ lastErr = 'ההקלטה נשמעת עכשיו, אבל לא נשמרה בזיכרון של הטלפון'; }
  }
  function del(key){ map.delete(key); bufs.delete(key); urls.delete(key); try{ db.transaction('rec','readwrite').objectStore('rec').delete(key); }catch(e){} }
  async function buffer(key){
    if(bufs.has(key)) return bufs.get(key);
    const a = ac(); if(!a || !map.has(key)) return null;
    const data = await map.get(key).arrayBuffer();
    const b = await new Promise((res, rej)=>{ try{ const pr = a.decodeAudioData(data, res, rej); if(pr && pr.catch) pr.catch(rej); }catch(e){ rej(e); } });
    const d = b.getChannelData(0); let st = 0, en = d.length-1; const th = .025;
    while(st < d.length && Math.abs(d[st]) < th) st++;
    while(en > st && Math.abs(d[en]) < th) en--;
    const pad = Math.floor(b.sampleRate*.05);
    const o = {b, start:Math.max(0, st-pad)/b.sampleRate, end:Math.min(d.length, en+pad)/b.sampleRate};
    if(o.end - o.start < .1){ o.start = 0; o.end = b.duration; }
    bufs.set(key, o); return o;
  }
  async function playWeb(key){
    const a = ac(); if(!a) return false;
    if(a.state !== 'running'){ try{ await Promise.race([a.resume(), sleep(300)]); }catch(e){} }
    if(a.state !== 'running') return false;
    const o = await buffer(key); if(!o) return false;
    stop();
    return new Promise(res=>{
      const src = a.createBufferSource(), g = a.createGain(); g.gain.value = 1.5;
      src.buffer = o.b; src.connect(g); g.connect(a.destination);
      const dur = Math.max(.05, o.end - o.start);
      let done = false; const fin = ()=>{ if(done) return; done = true; if(cur && cur.src===src) cur = null; res(true); };
      src.onended = fin; setTimeout(fin, dur*1000 + 600);
      cur = {src, stop:()=>{ try{ src.stop(); }catch(e){} fin(); }};
      src.start(0, o.start, dur);
    });
  }
  // fallback: a plain audio element (unlocked by the first tap)
  function audioEl(){ if(!el){ el = new Audio(); el.preload = 'auto'; el.setAttribute('playsinline',''); } return el; }
  function unlock(){ const a = audioEl(); if(a.dataset.ok) return; a.dataset.ok = 1; try{ a.src = silentWav(); const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{ a.dataset.ok = ''; }); }catch(e){ a.dataset.ok = ''; } }
  function silentWav(){ const n = 800, buf = new ArrayBuffer(44+n*2), v = new DataView(buf); const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf], {type:'audio/wav'})); }
  async function playEl(key){
    let o = null; try{ o = await buffer(key); }catch(e){}
    const a = audioEl(); if(!urls.has(key)) urls.set(key, URL.createObjectURL(map.get(key)));
    stop();
    return new Promise(res=>{
      let done = false, endT = null;
      const fin = ok=>{ if(done) return; done = true; clearTimeout(endT); a.onended = null; a.onerror = null; a.onloadedmetadata = null; if(cur && cur.el) cur = null; res(ok); };
      a.onended = ()=>fin(true); a.onerror = ()=>fin(false);
      cur = {el:a, stop:()=>{ try{ a.pause(); }catch(e){} fin(true); }};
      const go = ()=>{
        try{ if(o && o.start > .02) a.currentTime = o.start; }catch(e){}
        const pr = a.play(); if(pr && pr.catch) pr.catch(()=>fin(false));
        if(o) endT = setTimeout(()=>{ try{ a.pause(); }catch(e){} fin(true); }, (o.end - o.start)*1000 + 150);
      };

    const order = IS_IOS ? [['element', playEl], ['web', playWeb]] : [['web', playWeb], ['element', playEl]];

    }

  }
  function stop(){ if(cur){ const c = cur; cur = null; c.stop(); } }
  return {norm, load, put, del, play, stop, unlock, has:k=>map.has(k), size:()=>map.size, info:()=>({lastErr, lastHow, ctx: AC ? AC.state : 'none', db: !!db})};
})();

function sayList(list, bubble=true){
  const tok = ++speakToken;

  try{ speechSynthesis.cancel(); }catch(e){}

    for(const [t,lang] of list){

const area = $('#area');
function startGame(gid){
  const g = GAMES[gid];
  stopSpeech(); show('scr-game');
  const zone = Object.values(ZONES).find(z=>z.games.includes(gid));
  $('#scr-game').style.setProperty('--zbg', zone.bg);
  const ctx = {
    id:gid, g, q:0, total:g.rounds, mist:0, qMist:0, token:1, area, lastPrompt:null, data:{},
  };
  current = ctx;
  $('#stars').innerHTML = Array.from({length:ctx.total},()=>'<i>⭐</i>').join('');
  ctx.alive = tok => current===ctx && ctx.token===tok;
  ctx.prompt = list => { ctx.lastPrompt = list; return sayList(list); };
  ctx.right = (pt, words) => {
    sfx.ding(); if(pt) burst(pt.x, pt.y);
    if(words!==false){ if(Array.isArray(words)) sayList(words); else say(words || (Math.random()<.3 ? `כל הכבוד ${S.childName}!` : pick(PRAISE))); }
  };
  ctx.wrong = (node, words) => {
    ctx.mist++; ctx.qMist++; sfx.oops();
    if(node) retrigger(node,'shake');
    if(words!==false){ if(Array.isArray(words)) sayList(words); else say(words || pick(OOPS)); }
  };
  ctx.solved = (delay=1100) => {
    const tok = ctx.token;
    const star = $('#stars').children[ctx.q]; if(star){ star.classList.add('on'); retrigger(star,'boing'); }
    ctx.q++;
    setTimeout(()=>{
      if(!ctx.alive(tok)) return;
      if(ctx.q >= ctx.total) finishGame(ctx);
      else nextQ(ctx);
    }, delay);
  };
  if(g.init) g.init(ctx);
  nextQ(ctx);
}
function nextQ(ctx){
  if(timeUp()){ showSleep(); return; }
  ctx.token++; ctx.qMist=0; area.innerHTML='';
  ctx.g.question(ctx, ctx.token);
}

function finishGame(ctx){
  const st = P.stats[ctx.id] = P.stats[ctx.id] || {rounds:0, qs:0, mist:0};
  st.rounds++; st.qs += ctx.total; st.mist += ctx.mist;
  const skill = ctx.g.skill;
  let lvMsg = '';
  if(skill && S.autoLevel){
    if(ctx.mist===0 && P.lv[skill] < LV_LEN[skill]-1){ P.lv[skill]++; lvMsg='up'; }
    else if(ctx.mist >= ctx.total*1.5 && P.lv[skill] > 0){ P.lv[skill]--; }
  }
  const pool = STICKERS.filter(s=>!P.stickers.includes(s));
  const sticker = pool.length ? pick(pool) : pick(STICKERS);
  P.stickers.push(sticker); save();
  celebrate(ctx, sticker, lvMsg);
}
function celebrate(ctx, sticker, lvMsg){
  current = null; sfx.win();
  const o = h(`<div class="overlay" id="celebrate"><canvas width="1280" height="720"></canvas>
     <div class="cele-box">

     </div>
     <div class="dudu dance" style="left:1060px;top:1120px;width:220px;height:250px;position:absolute">${duduSVG()}</div></div>`);

}
function confetti(cv){
  const c = cv.getContext('2d'); const cols=['#ff6b6b','#ffc93c','#2fd39a','#3b82f6','#a855f7','#f472b6'];
  const ps = Array.from({length:160},()=>({x:Math.random()*W, y:-20-Math.random()*400, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:8+Math.random()*10, h:6+Math.random()*8, c:pick(cols)}));
  const t0 = performance.now();
  (function loop(t){
    if(!cv.isConnected) return;
    c.clearRect(0,0,W,H);
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=.03; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); }
    if(t-t0 < 4500) requestAnimationFrame(loop); else c.clearRect(0,0,W,H);
  })(t0);
}

      else { b.classList.add('dim'); ctx.wrong(b); if(ctx.qMist>=2) btns.find((x,i)=>defs[i].ok).classList.add('hint'); }

function distinctOptions(answer, lo, hi, n=3){
  const set = new Set([answer]); let guard=0;
  while(set.size<n && guard++<200){ const d = answer + pick([-3,-2,-1,1,2,3]); if(d>=lo && d<=hi) set.add(d); }
  while(set.size<n) set.add(rnd(lo,hi));
  return shuffle([...set]);
}
/* lay out n emoji inside a box, auto-sized */
function emojiGrid(n, boxW, boxH, maxSize=70){
  let best = {size:0}; for(let cols=1; cols<=Math.min(n,10); cols++){ const rows=Math.ceil(n/cols); const size=Math.min((boxW-20)/cols*.86, (boxH-20)/rows*.86, maxSize); if(size>best.size) best={size,cols,rows}; }
  if(n>10){ const cols=10, rows=Math.ceil(n/10); best={cols,rows,size:Math.min((boxW-20)/cols*.86,(boxH-20)/rows*.86,maxSize)}; }
  return best;
}

GAMES.trace = {
  name:'כותבים אותיות ומספרים', icon:'✏️', rounds:4,
  init(ctx){
    let pool = [];
    if(S.traceSets.he) pool.push(...HE.map(x=>({...x,kind:'he'})));
    if(S.traceSets.en) pool.push(...EN.map(x=>({...x,kind:'en'})));

    if(!pool.length) pool = HE.map(x=>({...x,kind:'he'}));
    ctx.data.queue = shuffle(pool).slice(0, ctx.total);
  },
  question(ctx, tok){
    const item = ctx.data.queue[ctx.q];
    const tol = {easy:12, medium:9, precise:6.5}[S.traceTol] || 9;
    const BOX = 560, VB0 = -5, VBS = 110;
    const paper = h(`<div class="trace-paper" style="left:330px;top:22px;width:${BOX}px;height:${BOX}px"><svg viewBox="${VB0} ${VB0} ${VBS} ${VBS}"></svg></div>`);
    area.appendChild(paper);
    const svg = paper.querySelector('svg');
    const gTrack=svgEl('g',{},svg), gDots=svgEl('g',{},svg), gProg=svgEl('g',{},svg), gInk=svgEl('g',{},svg), gUI=svgEl('g',{},svg);
    const strokes = item.s.map((d,i)=>{
      svgEl('path',{d,class:'t-track'},gTrack); svgEl('path',{d,class:'t-dots'},gDots);
      const prog = svgEl('path',{d,class:'t-prog',stroke:STROKE_COLORS[i%STROKE_COLORS.length]},gProg);
      const len = prog.getTotalLength(); const N = Math.max(2, Math.ceil(len/1.2)); const pts=[];
      for(let k=0;k<=N;k++){ const p=prog.getPointAtLength(len*k/N); pts.push([p.x,p.y]); }
      prog.style.strokeDasharray = `${len} ${len+20}`; prog.style.strokeDashoffset = len; prog.style.opacity = 0;
      return {prog,len,N,pts,idx:0};
    });
    // UI: start dot, direction arrow, demo dot
    const arrow = svgEl('path',{d:'M-3 -3.4 L3.6 0 L-3 3.4 Z',fill:'#2b2350',opacity:.55},gUI);
    const start = svgEl('g',{},gUI);
    const startC = svgEl('circle',{r:6,fill:'#2fd39a',stroke:'#fff','stroke-width':2,class:'t-start'},start);
    const startN = svgEl('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':6.5,'font-weight':900,fill:'#fff','font-family':'Rubik, sans-serif'},start);
    const demo = svgEl('circle',{r:3.2,fill:'#ffc93c',stroke:'#fff','stroke-width':1.2,opacity:0},gUI);
    let cur = 0, drawing = false, last = null, ink = null, lastTouch = 0, finished = false, nagged = 0;
    const startHint = ()=>{
      const st = strokes[cur]; if(!st) return;
      const p = st.pts[st.idx]; start.setAttribute('transform',`translate(${p[0]} ${p[1]})`);
      startN.textContent = st.idx===0 ? (cur+1) : ''; start.style.display = finished?'none':'';
      const j = Math.min(st.N, st.idx+6), q = st.pts[j], ang = Math.atan2(q[1]-p[1], q[0]-p[0])*180/Math.PI;
      const ax = p[0]+Math.cos(ang*Math.PI/180)*10, ay = p[1]+Math.sin(ang*Math.PI/180)*10;
      arrow.setAttribute('transform',`translate(${ax} ${ay}) rotate(${ang})`); arrow.style.display = finished?'none':'';
    };
    startHint();
    const toU = e => { const l = localPt(e, paper); return [l.x*VBS/BOX+VB0, l.y*VBS/BOX+VB0]; };
    const dist = (a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
    function advanceAt(u){
      const st = strokes[cur]; if(!st) return;
      let best=-1; const lim = Math.min(st.N, st.idx + Math.ceil(14/1.2));
      for(let j=st.idx; j<=lim; j++) if(dist(u, st.pts[j]) < tol) best=j;
      if(best > st.idx){
        const before = st.idx; st.idx = best;
        st.prog.style.opacity = 1; st.prog.style.strokeDashoffset = st.len*(1 - st.idx/st.N);
        if(Math.floor(before/7)!==Math.floor(best/7)) sfx.tick(st.idx/st.N);
        if(st.idx >= st.N-1) completeStroke();
        else startHint();
      }
    }
    function advance(u){
      if(last){ const d = dist(last,u), steps = Math.ceil(d/1.5); for(let k=1;k<=steps;k++){ if(!drawing) break; advanceAt([last[0]+(u[0]-last[0])*k/steps, last[1]+(u[1]-last[1])*k/steps]); } }
      else advanceAt(u);
      last = u;
    }
    function completeStroke(){
      const st = strokes[cur]; st.prog.style.strokeDashoffset = 0; st.idx = st.N;
      drawing = false; last = null; gInk.innerHTML = ''; ink = null;
      sfx.stroke(); cur++;
      if(cur >= strokes.length){ finished = true; startHint(); winLetter(); }
      else { startHint(); const p = strokes[cur].pts[0]; const c = stagePos(paper); burst(c.x+(p[0]-VB0)*BOX/VBS, c.y+(p[1]-VB0)*BOX/VBS, ['✨'], 5); }
    }
    async function winLetter(){
      paper.classList.add('won'); demo.setAttribute('opacity',0);
      const c = centerOf(paper); burst(c.x, c.y, ['⭐','🌟','✨','🎉'], 22); sfx.win();
      $('.word-card .pic', area)?.classList.add('boing');
      const wl = item.kind==='he' ? [['כל הכבוד!','he'],[item.name,'he'],[`כמו ${item.word}`,'he']]

               : [['כל הכבוד!','he'],['כתבת את המספר','he'],[item.ch,'he']];
      await sayList(wl);
      if(ctx.alive(tok)) ctx.solved(500);
    }
    paper.addEventListener('pointerdown', e=>{
      if(finished || !ctx.alive(tok)) return;
      e.preventDefault(); try{ paper.setPointerCapture(e.pointerId); }catch(_){}
      lastTouch = performance.now(); demo.setAttribute('opacity',0);
      const u = toU(e), st = strokes[cur];
      ink = svgEl('polyline',{class:'t-ink',stroke:STROKE_COLORS[cur%STROKE_COLORS.length],points:`${u[0]},${u[1]}`},gInk);
      if(dist(u, st.pts[st.idx]) < tol*1.8){ drawing = true; last = null; advance(u); }
      else { drawing = false; retrigger(startC,'t-start'); if(performance.now()-nagged > 6000){ nagged = performance.now(); say('מתחילים בנקודה הירוקה'); } }
    });
    paper.addEventListener('pointermove', e=>{
      if(finished || !ink) return;
      lastTouch = performance.now();
      const u = toU(e);
      ink.setAttribute('points', ink.getAttribute('points')+` ${u[0].toFixed(1)},${u[1].toFixed(1)}`);
      const st = strokes[cur];
      if(!drawing && dist(u, st.pts[st.idx]) < tol*1.4){ drawing = true; last = null; }
      if(drawing) advance(u);
    });
    const up = ()=>{ drawing=false; last=null; ink=null; setTimeout(()=>{ if(!drawing) gInk.innerHTML=''; }, 600); lastTouch = performance.now(); };
    paper.addEventListener('pointerup', up); paper.addEventListener('pointercancel', up);
    // idle demo: a little sun dot runs along the current stroke to show the direction
    (function demoLoop(){
      if(!ctx.alive(tok) || finished) return;
      const idle = performance.now() - lastTouch;
      const st = strokes[cur];
      if(st && idle > 2200 && !drawing){
        const phase = ((idle-2200) % 2600)/1600;
        if(phase <= 1){ const from = st.idx/st.N, f = from + (1-from)*phase; const p = st.prog.getPointAtLength(st.len*f); demo.setAttribute('cx',p.x); demo.setAttribute('cy',p.y); demo.setAttribute('opacity',.95); }
        else demo.setAttribute('opacity',0);
      }
      requestAnimationFrame(demoLoop);
    })();
    // side card
    let cardInner;
    if(item.kind==='he') cardInner = `<div class="pic">${item.emoji}</div><div class="w"><b>${item.word[0]}</b>${item.word.slice(1)}</div>`;
    else if(item.kind==='en') cardInner = `<div class="pic">${item.emoji}</div><div class="w" style="direction:ltr"><b>${item.word[0]}</b>${item.word.slice(1)}</div>`;
    else { const n=+item.ch; cardInner = `<div class="dots">${n===0?'<span style="font-size:110px">🍽️</span>':Array(n).fill('🍎').join('')}</div><div class="w">${n===0?'אפס':item.ch}</div>`; }
    area.appendChild(h(`<div class="card word-card">${cardInner}</div>`));
    const again = h(`<button class="toy side-btn" style="top:200px" aria-label="להתחיל מחדש">🔁</button>`);
    again.addEventListener('click', ()=>{ if(!ctx.alive(tok)) return; sfx.tap(); area.innerHTML=''; ctx.token++; ctx.g.question(ctx, ctx.token); });
    area.appendChild(again);
    const first = ctx.q===0 ? [['שים את האצבע על הנקודה הירוקה, ותמשיך עם הקו','he']] : [];
    if(item.kind==='he') ctx.prompt([['בוא נכתוב את האות','he'],[item.name,'he'],...first]);

  }

      box.innerHTML = Array(v).fill(0).map(()=>`<span style="font-size:${g.size}px;width:${(540/g.cols)|0}px;text-align:center">${emo[i]}</span>`).join('');
      area.appendChild(box);
      const ad = h(`<div class="anchor-dot" style="left:640px;top:${y+boxH/2}px"></div>`); area.appendChild(ad);
      right.push({v, el:box, side:'R', ax:640, ay:y+boxH/2, rect:[620,y,600,boxH]});
    });
    const cols = [['#ff6b6b','#d94848'],['#3b82f6','#1d5fd6'],['#2fbf71','#1e9456'],['#a855f7','#7e22ce']];
    nums.forEach((v,i)=>{
      const y = top0 + i*rowH + (boxH-numD)/2, x = 220;
      const n = h(`<div class="cnum" style="left:${x}px;top:${y}px;width:${numD}px;height:${numD}px;--c:${cols[i][0]};--cd:${cols[i][1]}">${v}</div>`);
      area.appendChild(n);
      const ad = h(`<div class="anchor-dot" style="left:${x+numD+22}px;top:${y+numD/2}px"></div>`); area.appendChild(ad);
      left.push({v, el:n, side:'L', ax:x+numD+22, ay:y+numD/2, rect:[x-40,y-10,numD+110,numD+20]});
    });
    const all = [...left, ...right]; let sel = null, drag = null, done = 0;
    const hit = (pt, side)=> all.find(n=>n.side===side && !n.done && pt.x>=n.rect[0] && pt.x<=n.rect[0]+n.rect[2] && pt.y>=n.rect[1] && pt.y<=n.rect[1]+n.rect[3]);
    const colorFor = v => cols[nums.indexOf(v)][0];
    function connect(a, b){
      const [L, R] = a.side==='L' ? [a,b] : [b,a];
      if(L.v===R.v){
        L.done = R.done = true; L.el.classList.add('done'); R.el.classList.add('done');
        svgEl('line',{x1:L.ax,y1:L.ay,x2:R.ax,y2:R.ay,stroke:colorFor(L.v),'stroke-width':12,'stroke-linecap':'round'},svg);
        done++;
        ctx.right({x:(L.ax+R.ax)/2, y:100+(L.ay+R.ay)/2}, done===vals.length ? false : [[String(L.v),'he'],[pick(PRAISE),'he']]);
        if(done===vals.length){ sayList([[String(L.v),'he'],['כל הכבוד, חיברת את הכול!','he']]); ctx.solved(1600); }
      } else {
        const ln = svgEl('line',{x1:L.ax,y1:L.ay,x2:R.ax,y2:R.ay,stroke:'#ff6b6b','stroke-width':10,'stroke-linecap':'round','stroke-dasharray':'4 16'},svg);
        setTimeout(()=>ln.remove(), 600);
        ctx.wrong(R.el, [['הממ... בוא נספור שוב.','he'],[pick(OOPS),'he']]);
      }
    }
    const clearSel = ()=>{ if(sel){ sel.el.classList.remove('sel'); sel=null; } };
    all.forEach(n=>{
      n.el.addEventListener('pointerdown', e=>{
        if(!ctx.alive(tok) || n.done) return; e.preventDefault();
        try{ n.el.setPointerCapture(e.pointerId); }catch(_){}
        const p = localPt(e, area);
        drag = {from:n, sx:p.x, sy:p.y, moved:false, line: svgEl('line',{x1:n.ax,y1:n.ay,x2:p.x,y2:p.y,stroke:'#2b2350','stroke-width':9,'stroke-linecap':'round',opacity:.55},svg)};
        sfx.tap();
      });
      n.el.addEventListener('pointermove', e=>{
        if(!drag || drag.from!==n) return;
        const p = localPt(e, area); drag.line.setAttribute('x2',p.x); drag.line.setAttribute('y2',p.y);
        if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>14) drag.moved = true;
      });
      const end = e=>{
        if(!drag || drag.from!==n) return;
        const p = localPt(e, area); drag.line.remove(); const d = drag; drag = null;
        if(!d.moved){
          if(sel && sel!==n && sel.side!==n.side){ const s=sel; clearSel(); connect(s, n); }
          else { clearSel(); sel = n; n.el.classList.add('sel'); if(n.side==='R') say(`כמה יש כאן?`); else say(String(n.v)); }
          return;
        }
        clearSel();
        const t = hit(p, n.side==='L'?'R':'L');
        if(t) connect(n, t);
      };
      n.el.addEventListener('pointerup', end); n.el.addEventListener('pointercancel', ()=>{ if(drag){ drag.line.remove(); drag=null; } });
    });
    ctx.prompt([[ctx.q===0 ? 'סופרים כמה יש, ומותחים קו למספר הנכון' : 'עוד פעם! חבר כל קבוצה למספר שלה','he']]);
  }
};

GAMES.balloons = {

  const BASE = {house:.85,tree:.8,pine:.85,bush:.8,flower:.85,mushroom:.75,fence:.9,pond:.9,cat:.8,dog:.8,duck:.75,bird:.75,butterfly:.8,ladybug:.85,snail:.85,mouse:.85,bunny:.8,sun:.8,cloud:1,balloon:.9,kite:.85,car:.85,sailboat:.75,umbrella:.85,bucket:.85,crab:.8,ball:.9,palm:.95,sandcastle:.85,grass:1,star:.9,fish:.8};

  /* backgrounds */
  const BG = {
    meadow:(W,H,u)=>`<defs><linearGradient id="sk${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6ff"/><stop offset="1" stop-color="#dff5ff"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sk${u})"/>
      <path d="M-10 ${H*.5} Q${W*.18} ${H*.3} ${W*.42} ${H*.46} Q${W*.62} ${H*.32} ${W*.82} ${H*.44} Q${W*.92} ${H*.38} ${W+10} ${H*.42} V${H} H-10Z" fill="#b5e48c" ${S3}/>
      <path d="M-10 ${H*.58} Q${W*.3} ${H*.5} ${W*.6} ${H*.57} Q${W*.82} ${H*.62} ${W+10} ${H*.54} V${H+10} H-10Z" fill="#8fd16a" ${S3}/>`,
    forest:(W,H,u)=>{ let trees=''; for(let x=-20;x<W+40;x+=46){ const h=60+((x*37)%40); trees+=`<path d="M${x-30} ${H*.5} L${x} ${H*.5-h} L${x+30} ${H*.5}Z" fill="#7cc47f"/>`; }
      return `<defs><linearGradient id="sk${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7e3ff"/><stop offset="1" stop-color="#e8f9ee"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sk${u})"/>${trees}
      <path d="M-10 ${H*.5} H${W+10} V${H+10} H-10Z" fill="#9bd27a" ${S3}/><path d="M-10 ${H*.6} Q${W*.4} ${H*.54} ${W+10} ${H*.62} V${H+10} H-10Z" fill="#86c66a" ${S3}/>
      <path d="M${W*.45} ${H+10} Q${W*.5} ${H*.8} ${W*.62} ${H*.62} L${W*.68} ${H*.62} Q${W*.6} ${H*.8} ${W*.62} ${H+10}Z" fill="#e9c98f" ${S3}/>`; },
    beach:(W,H,u)=>`<defs><linearGradient id="sk${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86d4ff"/><stop offset="1" stop-color="#e3f6ff"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sk${u})"/>
      <rect x="-10" y="${H*.4}" width="${W+20}" height="${H*.3}" fill="#45bdf0" ${S3}/>
      ${Array.from({length:Math.ceil(W/90)},(_,i)=>`<path d="M${i*90+10} ${H*(.47+(i%3)*.04)} q12 -8 24 0 q12 8 24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`).join('')}
      <path d="M-10 ${H*.62} Q${W*.25} ${H*.57} ${W*.5} ${H*.61} Q${W*.75} ${H*.65} ${W+10} ${H*.59} V${H+10} H-10Z" fill="#ffe3a3" ${S3}/>
      ${Array.from({length:Math.ceil(W/60)},(_,i)=>`<circle cx="${(i*61+23)%W}" cy="${H*(.7+((i*7)%10)/40)}" r="2.5" fill="#e6c27a"/>`).join('')}`,
  };
  const SPEC = {
    meadow:[['sun',1,'sun'],['cloud',[2,3],'sky'],['bird',[1,2],'sky'],['house',1,'ground',[.58,.66]],['tree',[1,2],'ground',[.6,.72]],['pond',1,'ground',[.86,.94]],['fence',1,'ground',[.62,.74]],['bush',[1,2],'ground'],['dog',1,'ground'],['cat',1,'ground'],['mushroom',[1,2],'ground'],['flower',[4,6],'ground'],['butterfly',[1,2],'air'],['ladybug',[0,1],'ground'],['snail',[0,1],'ground']],
    forest:[['sun',1,'sun'],['cloud',[1,2],'sky'],['bird',[1,2],'sky'],['pine',[2,3],'ground',[.58,.72]],['tree',1,'ground',[.6,.7]],['bush',[2,3],'ground'],['bunny',1,'ground'],['mushroom',[2,3],'ground'],['flower',[3,5],'ground'],['butterfly',[1,2],'air'],['snail',[0,1],'ground'],['ladybug',[0,1],'ground'],['mouse',[0,1],'ground']],
    beach:[['sun',1,'sun'],['cloud',[1,2],'sky'],['bird',[1,2],'sky'],['kite',1,'air'],['sailboat',1,'sea'],['fish',[1,2],'seaair'],['palm',1,'ground',[.66,.76]],['umbrella',1,'ground',[.7,.82]],['sandcastle',1,'ground'],['bucket',1,'ground'],['ball',1,'ground'],['crab',[1,2],'ground'],['star',[0,1],'ground']],
  };
  const FIND = {
    meadow:[['mouse','עכברים'],['ladybug','פרות משה רבנו'],['bird','ציפורים'],['snail','שבלולים'],['star','כוכבים']],
    forest:[['mouse','עכברים'],['ladybug','פרות משה רבנו'],['snail','שבלולים'],['bird','ציפורים'],['star','כוכבים']],
    beach:[['star','כוכבים'],['crab','סרטנים'],['bird','ציפורים']],
  };
  let uidN = 0;

  function build(kind, W, H, opt={}){
    const k = H/500, dense = opt.dense || 1, exclude = opt.exclude || new Set();
    const objs = [], boxes = [];
    const bands = {sun:[.08,.16], sky:[.08,.28], air:[.3,.52], sea:[.52,.6], seaair:[.42,.5], ground:[.6,.97]};
    const ov = (a,b) => !(a[0]+a[2]<b[0] || b[0]+b[2]<a[0] || a[1]+a[3]<b[1] || b[1]+b[3]<a[1]);
    const boxOf = (o)=>{ const [w,h]=sizeOf(o); const sh=.16; const bw=w*o.s, bh=h*o.s; return CENTER.has(o.type) ? [o.x-bw/2+bw*sh/2, o.y-bh/2+bh*sh/2, bw*(1-sh), bh*(1-sh)] : [o.x-bw/2+bw*sh/2, o.y-bh+bh*sh/2, bw*(1-sh), bh*(1-sh)]; };
    function place(type, band, yr){
      const [b0,b1] = yr || bands[band];
      for(let t=0;t<90;t++){
        const p = P[type](); const y = H*(b0 + Math.random()*(b1-b0));
        const depth = band==='ground' ? .72 + .45*((y/H)-.6)/.37 : 1;
        const o = {type, p, x:0, y, s:BASE[type]*k*depth, flip:Math.random()<.5 && !['house','sun','sailboat','palm'].includes(type), band};
        const [w] = sizeOf(o); const m = w*o.s/2 + 6; o.x = m + Math.random()*(W-2*m);
        if(type==='sun') o.x = W*(.08+Math.random()*.1) + 40*k;
        const bx = boxOf(o); if(bx[1] < 2 && !CENTER.has(type)) continue;
        if(boxes.some(b=>ov(b,bx))) continue;
        o.z = band==='sun' ? 1 : band==='sky' ? 10+y : band==='sea'||band==='seaair' ? 500+y : band==='air' ? 3000+y : 1000+y;
        boxes.push(bx); objs.push(o); return o;
      }
      return null;
    }
    for(const [type, n, band, yr] of SPEC[kind]){
      if(exclude.has(type)) continue;
      let cnt = Array.isArray(n) ? rnd(n[0], n[1]) : n;
      if(dense>1 && !['sun','house','pond','sailboat','palm','umbrella','sandcastle'].includes(type)) cnt = Math.round(cnt*dense + (cnt?0:.4));
      for(let i=0;i<cnt;i++){
        const o = place(type, band, yr);
        if(o && type==='pond' && !exclude.has('duck')){ objs.push({type:'duck', p:P.duck(), x:o.x+rnd(-30,20)*o.s, y:o.y-16*o.s, s:o.s*.7, flip:Math.random()<.5, z:o.z+.5}); }
      }
    }
    return {kind, W, H, k, objs, extra:[], uid:++uidN};
  }
  function drawObj(o){
    const s = o.s, sx = o.flip ? -s : s;
    const inner = o.hidden ? `<g class="wig" data-h="${o.hid}" style="animation-delay:${o.wd}s">${DRAW[o.type](o.p)}</g>` : DRAW[o.type](o.p);
    return `<g transform="translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) scale(${sx.toFixed(3)} ${s.toFixed(3)})">${inner}</g>`;
  }
  function fullBox(o){ const [w,h]=sizeOf(o); const bw=w*o.s, bh=h*o.s; return CENTER.has(o.type) ? [o.x-bw/2, o.y-bh/2, bw, bh] : [o.x-bw/2, o.y-bh, bw, bh]; }
  function overlapArea(a,b){ const x=Math.max(0, Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0])), y=Math.max(0, Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1])); return x*y; }
  function render(sc){
    const items = [...sc.objs.filter(o=>!o.removed), ...sc.extra].sort((a,b)=>a.z-b.z);
    const u = sc.uid + '_' + (++uidN);
    return `<svg viewBox="0 0 ${sc.W} ${sc.H}" width="${sc.W}" height="${sc.H}" style="display:block">${BG[sc.kind](sc.W,sc.H,u)}${items.map(drawObj).join('')}</svg>`;
  }
  const hitR = o => { const [w,h]=sizeOf(o); return Math.max(34, Math.min(80, Math.max(w,h)*o.s*.5)); };
  function hitPt(o, l){ return {x:o.x + l[0]*o.s*(o.flip?-1:1), y:o.y + l[1]*o.s}; }

  // spot-the-difference: returns the changed copy + list of differences
  function makeDiffs(sc, D){
    const B = JSON.parse(JSON.stringify(sc));
    const cands = [];
    sc.objs.forEach((o,i)=>{ (MUT[o.type]||[]).forEach(fn=>{ const m = fn(o); if(m.ok===false) return; const pt = hitPt(o, m.hit || [0,0]); cands.push({i, m, pt, r:m.r || hitR(o), type:o.type}); }); });
    const out = [], usedObj = new Set();
    for(const c of shuffle(cands)){
      if(out.length>=D) break;
      if(usedObj.has(c.i)) continue;
      if(c.pt.x<26 || c.pt.x>sc.W-26 || c.pt.y<26 || c.pt.y>sc.H-26) continue;
      if(out.some(d=>Math.hypot(d.x-c.pt.x, d.y-c.pt.y) < 95)) continue;
      if(out.filter(d=>d.type===c.type).length>=1 && cands.length>D*3) continue;
      c.m.apply(B.objs[c.i]); usedObj.add(c.i);
      out.push({x:c.pt.x, y:c.pt.y, r:c.r, type:c.type, found:false});
    }
    return {B, diffs:out};
  }
  // hidden friends: adds T hidden items to the scene and returns their hit spots
  function hideFriends(sc, type, T, lv){
    const spots = [];
    sc.objs.forEach(o=>{ if(o.band!=='ground' && o.type!=='house') return; (HIDE[o.type]||[]).forEach(hd=>{ const pt = hitPt(o,[hd.dx,hd.dy]); spots.push({x:pt.x, y:pt.y, z:o.z + (hd.z<0 ? -.4 : .4), s:o.s*(hd.sc||.85), kind:hd.z<0?'behind':'front', host:o}); }); });
    for(let i=0;i<10;i++){ const y = sc.H*(.68+Math.random()*.28), d = .72+.45*((y/sc.H)-.6)/.37; spots.push({x: 40+Math.random()*(sc.W-80), y, z:1000+y, s:sc.k*d*.85, kind:'grass'}); }
    const pref = lv<=0 ? {front:0, grass:1, behind:1} : lv===1 ? {grass:0, behind:0, front:1} : {behind:0, grass:0, front:1};
    const ordered = shuffle(spots).sort((a,b)=>pref[a.kind]-pref[b.kind] + (Math.random()-.5)*1.4);
    const chosen = [], [w,h] = SIZE[type];
    for(const sp of ordered){
      if(chosen.length>=T) break;
      const s = Math.max(sp.s, .58*sc.k);
      const cy = sp.y - h*s/2;
      if(sp.x - w*s/2 < 6 || sp.x + w*s/2 > sc.W-6 || sp.y - h*s < 6 || sp.y > sc.H-4) continue;
      if(chosen.some(c=>Math.hypot(c.x-sp.x, c.cy-cy) < 90*sc.k)) continue;
      const item = {type, p:P[type](), x:sp.x, y: CENTER.has(type) ? cy : sp.y, s, flip:Math.random()<.5, z:sp.z, hidden:true, hid:chosen.length, wd:(-Math.random()*3.6).toFixed(2)};
      sc.extra.push(item);
      // nothing except the hiding place itself may cover the friend
      const ib = fullBox(item), ia = ib[2]*ib[3];
      sc.objs.forEach(o=>{ if(o===sp.host || o.removed || o.z <= item.z) return; if(overlapArea(fullBox(o), ib) > ia*.12) o.removed = true; });
      // grass only hides the feet (about a third of the body)
      if(sp.kind==='grass') sc.extra.push({type:'grass', p:{}, x:sp.x + rnd(-5,5), y:sp.y+3, s:Math.max(h*s*.36/40, .35*sc.k)*1.15, flip:Math.random()<.5, z:sp.z+.5});
      chosen.push({x:sp.x, y:sp.y, cy, r: Math.max(w,h)*s/2 + 20, found:false, id:chosen.length});
    }
    return chosen;
  }
  function icon(type, px=46){
    const [w,h] = SIZE[type]; const p = P[type]();
    const vb = CENTER.has(type) ? `${-w/2-4} ${-h/2-4} ${w+8} ${h+8}` : `${-w/2-4} ${-h-4} ${w+8} ${h+8}`;
    return `<svg viewBox="${vb}" width="${px}" height="${px}" style="display:block">${DRAW[type](p)}</svg>`;
  }
  return {build, render, makeDiffs, hideFriends, icon, FIND, KINDS:Object.keys(SPEC)};
})();

    let cnt = 0, misses = 0, lastFind = performance.now();
    const wigOf = sp => scene.querySelector(`.wig[data-h="${sp.id}"]`);
    const giveHint = () => { const sp = spots.find(s=>!s.found); if(!sp) return; const w = wigOf(sp); if(w && !w.classList.contains('hint')){ w.classList.add('hint'); sfx.tick(.8); say(pick(['תסתכל כאן... משהו זז!','הנה, רמז!','מי מציץ שם?'])); } };

      const slots = h(`<div class="slots" style="direction:${dir};top:300px">${letters.map(()=>'<div class="slot"></div>').join('')}</div>`); area.appendChild(slots);
      const extra = shuffle(alphabet.filter(c=>!letters.includes(c))).slice(0, letters.length<=3 ? 1 : 2);
      const tiles = h(`<div class="tiles" style="top:460px;direction:ltr"></div>`); area.appendChild(tiles);
      let pos = 0;
      shuffle([...letters, ...extra]).forEach(c=>{
        const t = h(`<button class="toy tile">${c}</button>`);
        t.addEventListener('click', async()=>{
          if(!ctx.alive(tok) || t.classList.contains('used') || pos>=letters.length) return;
          if(c===letters[pos]){
            t.classList.add('used'); const s = slots.children[pos]; s.textContent = c; s.classList.add('full'); pos++; sfx.pop();
            if(lang==='en') sayList([[c,'en']], false); else sayList([[HE.find(l=>l.ch===c)?.name || c,'he']], false);
            if(pos===letters.length){
              ctx.right(centerOf(slots), false);
              for(let k=0;k<letters.length;k++){ slots.children[k].classList.add('read'); await sleep(260); }
              await sayList([[`כל הכבוד! בנית את המילה`,'he'],[spoken,lang]]);
              if(ctx.alive(tok)) ctx.solved(300);
            }
          } else {
            ctx.wrong(t, false);
            if(ctx.qMist>=2){ const right = [...tiles.children].find(x=>!x.classList.contains('used') && x.textContent===letters[pos]); right && right.classList.add('hint'); }
            sayList([[pick(OOPS),'he']]);
          }
        });
        tiles.appendChild(t);
      });
      ctx.prompt([['בוא נבנה את המילה','he'],[spoken,lang]]);
    }
  }
};

      `כל הכבוד ${N}! קיבלת מדבקה חדשה!`, 'ובפעם הבאה, זה יהיה קצת יותר מאתגר!', `היי ${N}!`, 'הי הי! זה מדגדג!', 'בוא נשחק ביחד!', 'לחץ על הכפתור הגדול!',
      'לאן עכשיו?', 'מה נשחק עכשיו?', `בוא ${N}, נבחר משחק!`, 'אני אוהב לשחק איתך!', 'בוא נלמד משהו חדש!', 'לחץ על אחד הבתים!',
      ...Object.values(ZONES).map(z=>`${z.name}! מה נשחק?`), ...DECOR.map(d=>d.say)])},
    {id:'games', name:'הוראות במשחקים', items: he(['בוא נכתוב את האות', 'בוא נכתוב באנגלית את האות', 'בוא נכתוב את המספר', 'שים את האצבע על הנקודה הירוקה, ותמשיך עם הקו', 'מתחילים בנקודה הירוקה', 'כתבת את המספר',
      'מצא את כל האותיות', 'מצאת את כל האותיות', 'מצאת את כולן!', 'זאת האות', 'נחפש את', 'זאת',
      'סופרים כמה יש, ומותחים קו למספר הנכון', 'עוד פעם! חבר כל קבוצה למספר שלה', 'כמה יש כאן?', 'כל הכבוד, חיברת את הכול!', 'הממ... בוא נספור שוב.',
      'אפשר ללחוץ ולספור', ...Object.values(COUNT_NAMES).map(n=>`כמה ${n} יש?`), 'ועוד', 'כמה זה ביחד?', 'היו', 'הלכו. כמה נשארו?',
      'זה בלון', 'אנחנו מחפשים', 'לאיזה סל זה שייך? שים בסל באותו הצבע', 'ולאן זה הולך?', 'זה סל', 'איזה צבע זה?',
      'יש', 'הבדלים בין שתי התמונות. תמצא אותם?', 'מצאת אחד!', 'יופי! עוד אחד?', 'מצאת את כל ההבדלים!',
      ...[...new Set(Object.values(ILL.FIND).flat().map(x=>x[1]))], 'מסתתרים בתמונה. תמצא אותם?', 'מצאת את כולם!', 'תסתכל כאן... משהו זז!', 'הנה, רמז!', 'מי מציץ שם?',
      'באיזו אות מתחילה המילה', 'מתחיל ב', 'איזו תמונה מתאימה למילה?', 'נכון! קראת', 'בוא נבנה את המילה', 'כל הכבוד! בנית את המילה'])},
    {id:'letters', name:'אותיות', items: HE.flatMap(l=>[{t:l.name, lang:'he', label:`${l.ch}  ·  ${stripNiqqud(l.name)}`}, {t:`כמו ${l.word}`, lang:'he'}])},
    {id:'numbers', name:'מספרים', items: Array.from({length:31},(_,i)=>({t:String(i), lang:'he'}))},
    {id:'colors', name:'צבעים', items: COLORS.flatMap(c=>[{t:c.he, lang:'he'}, {t:`פוצץ את הבלונים ה${c.pl}!`, lang:'he'}])},
    {id:'words', name:'מילים לקריאה', items: HE_WORDS.map(w=>({t:w[2]||w[0], lang:'he', label:`${w[1]}  ${w[0]}`}))},
    {id:'english', name:'English', items: [...EN.flatMap(l=>[{t:l.ch, lang:'en'}, {t:`${l.ch} is for ${l.word}`, lang:'en'}]), ...COLORS.map(c=>({t:c.en, lang:'en'})), ...EN_WORDS.map(w=>({t:w[0].toLowerCase(), lang:'en', label:`${w[1]}  ${w[0]}`}))]},

/* ---------- recording in the parents area ---------- */
let recStream = null, recMR = null, recKey = null, recTimer = null, vCat = 'general', vPage = 0, vMsg = '';
function releaseMic(){ try{ if(recMR) recMR.stop(); }catch(e){} if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream = null; } }
async function recToggle(item){
  if(recMR){ recMR.stop(); return; }
  ac(); stopSpeech();
  try{
    audioSession('play-and-record');
    if(!recStream) recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    vMsg = 'אין גישה למיקרופון כאן. ההקלטה עובדת באפליקציה שבמסך הבית: פותחים אותה, נכנסים לאזור ההורים ומאשרים גישה למיקרופון.';
    renderParent(); return;
  }
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
  const chunks = [];
  try{ recMR = new MediaRecorder(recStream, mime ? {mimeType:mime} : undefined); }catch(e){ vMsg = 'המכשיר הזה לא תומך בהקלטה.'; renderParent(); return; }
  recKey = item.key; vMsg = '';
  recMR.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  recMR.onstop = ()=>{
    clearTimeout(recTimer);
    const blob = new Blob(chunks, {type:(recMR && recMR.mimeType) || mime || 'audio/webm'});
    recMR = null; recKey = null;
    if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream = null; }
    audioSession('playback');
    if(blob.size > 600){ REC.put(item.key, blob).then(()=>renderParent()); setTimeout(()=>{ ac(); REC.play(item.key); }, 250); }
    else vMsg = 'ההקלטה יצאה ריקה. נסו שוב ודברו קרוב לטלפון.';
    renderParent();
  };
  recMR.start();
  recTimer = setTimeout(()=>{ if(recMR) recMR.stop(); }, 7000);
  renderParent();
}
function renderVoice(body){
  const cats = voiceCatalog();
  const cat = cats.find(c=>c.id===vCat) || cats[0];
  const PER = 12, pages = Math.max(1, Math.ceil(cat.items.length/PER));
  vPage = Math.min(vPage, pages-1);
  const done = cats.reduce((n,c)=>n + c.items.filter(it=>REC.has(it.key)).length, 0), total = cats.reduce((n,c)=>n + c.items.length, 0);
  const inf = REC.info(); if(inf.lastErr && !vMsg) vMsg = inf.lastErr;
  const head = h(`<div class="v-head"><div class="v-info"><b>${done}</b> מתוך ${total} הוקלטו · לוחצים 🎙 ואומרים את המשפט, ולוחצים שוב לסיום. מה שלא הוקלט נשמע בקריאה האוטומטית. ההקלטות נשמרות בטלפון הזה.</div><div class="seg v-cats"></div></div>`);
  cats.forEach(c=>{ const n = c.items.filter(it=>REC.has(it.key)).length; const b = h(`<button class="${c.id===cat.id?'on':''}">${c.name} <small>${n}/${c.items.length}</small></button>`); b.addEventListener('click', ()=>{ vCat = c.id; vPage = 0; renderParent(); }); head.querySelector('.v-cats').appendChild(b); });
  body.appendChild(head);
  if(vMsg) body.appendChild(h(`<div class="v-msg">${vMsg}</div>`));
  const grid = h(`<div class="v-grid"></div>`);
  cat.items.slice(vPage*PER, vPage*PER+PER).forEach(it=>{
    const has = REC.has(it.key), rec = recKey===it.key;
    const row = h(`<div class="v-row ${has?'has':''} ${rec?'rec':''}"><span class="v-t" dir="${it.lang==='en'?'ltr':'rtl'}"></span><button class="v-b v-rec" aria-label="הקלטה">${rec?'⏹':'🎙'}</button><button class="v-b" aria-label="השמעה">▶</button><button class="v-b v-del" aria-label="מחיקה" ${has?'':'disabled'}>🗑</button></div>`);
    row.querySelector('.v-t').textContent = (has ? '✓ ' : '') + (it.label || stripNiqqud(it.t));
    const [bRec, bPlay, bDel] = row.querySelectorAll('button');
    bRec.addEventListener('click', ()=>recToggle(it));
    bPlay.addEventListener('click', ()=>{ ac(); sayList([[it.t, it.lang]], false); });
    bDel.addEventListener('click', ()=>{ REC.del(it.key); renderParent(); });
    grid.appendChild(row);
  });
  body.appendChild(grid);
  if(pages > 1){
    const pg = h(`<div class="v-pager"><button class="p-btn alt">→ הקודם</button><span>עמוד ${vPage+1} מתוך ${pages}</span><button class="p-btn alt">הבא ←</button></div>`);
    const [prev, next] = pg.querySelectorAll('button');
    prev.disabled = vPage===0; next.disabled = vPage>=pages-1;
    prev.addEventListener('click', ()=>{ vPage--; renderParent(); }); next.addEventListener('click', ()=>{ vPage++; renderParent(); });
    body.appendChild(pg);
  }
}
