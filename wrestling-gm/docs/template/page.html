<title>{{title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Secular+One&display=swap">
<style>
{{css}}
</style>
<div class="doc" dir="rtl" lang="he">
  <header class="cover">
    <div class="cover-inner gutter">
      <div class="eyebrow"><span class="live">● {{kind}}</span><span>גרסה {{version}}</span><span>{{date}}</span><span>סטטוס: {{status}}</span></div>
      <h1>{{title}}</h1>
      <p class="lead">{{lead}}</p>
    </div>
    <div class="belt"></div>
  </header>
  <div class="layout gutter">
    <nav class="toc" aria-label="תוכן העניינים">
      <p class="toc-title">תוכן העניינים</p>
      <ol>{{toc}}</ol>
    </nav>
    <main class="content">
{{content}}
    </main>
  </div>
  <footer class="foot">
    <div class="foot-inner gutter"><span>מקור המסמך: <code>{{source}}</code></span><span>נבנה מהתבנית האחידה של מסמכי הפרויקט</span></div>
  </footer>
</div>
